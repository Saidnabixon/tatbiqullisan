/* ===== 18-page-content.js ===== */
/* ============================================================
   PAGES — Library, dictionary, blog, free resources, pricing,
   checkout, about, contact, teachers, legal, 404
   ============================================================ */
window.TLA = window.TLA || {};
TLA.pages = TLA.pages || {};

(function () {
  "use strict";
  const U = TLA.utils;
  const t = (k, v) => TLA.i18n.t(k, v);

  /* ================= Library ================= */
  const RES_ICONS = { reading: "◈", audio: "◉", video: "▶", grammar: "◆", vocabulary: "❖", exam: "★" };

  function openResource(res) {
    const locked = !res.free && !TLA.state.isAuthed();
    if (locked) {
      TLA.ui.modal("<h3>" + t("misc.locked") + "</h3>" +
        '<p class="muted" style="margin:var(--sp-3) 0 var(--sp-5)">' + t("library.needAuth") + "</p>" +
        '<div class="stack-sm"><button class="btn btn-primary btn-block" data-action="auth-register">' + t("result.gateCta") + "</button>" +
        '<button class="btn btn-ghost btn-block" data-action="auth-login">' + t("action.login") + "</button></div>",
        { label: res.titleUz });
      return;
    }

    const o = res.opens || {};
    let body = "";
    if (o.kind === "text") {
      const text = TLA.data.texts[o.id];
      body = '<h3 class="ar" style="text-align:center">' + text.titleAr + "</h3>" +
        '<p class="muted text-center" style="font-size:var(--fs-2xs);margin-top:4px">' + U.esc(text.titleUz) + "</p>" +
        '<div class="ptext" style="margin-top:var(--sp-5)">' + text.body + "</div>" +
        '<div style="margin-top:var(--sp-5);padding-top:var(--sp-4);border-top:1px dashed var(--border-strong);color:var(--ink-2);line-height:1.8">' +
        U.esc(text.uz) + "</div>" +
        '<button class="btn btn-quiet btn-sm" style="margin-top:var(--sp-4)" data-action="speak" data-text="' +
        U.attr(text.body) + '">◉ ' + t("lesson.listen") + "</button>";
    } else if (o.kind === "script") {
      const script = TLA.data.scripts[o.id];
      body = "<h3>" + U.esc(script.titleUz) + "</h3>" +
        '<p class="ar" style="text-align:center;font-size:1.3rem;margin-top:var(--sp-2)">' + script.titleAr + "</p>" +
        '<div style="margin-top:var(--sp-5)">' + TLA.widgets.audioPlayerMarkup("libAudio", { allowTranscript: true }) + "</div>" +
        '<div class="ar" style="margin-top:var(--sp-5)">' + script.body + "</div>" +
        '<p class="muted" style="margin-top:var(--sp-4);font-size:var(--fs-sm);line-height:1.7">' + U.esc(script.uz) + "</p>";
    } else if (o.kind === "grammar") {
      const g = TLA.data.grammar[o.id];
      body = "<h3>" + U.esc(g.titleUz) + "</h3>" +
        '<p class="ar ar-lg" style="margin-top:var(--sp-2)">' + g.titleAr + "</p>" +
        '<p style="margin-top:var(--sp-4);line-height:1.8;color:var(--ink-2)">' + U.esc(g.bodyUz) + "</p>" +
        '<div class="stack" style="margin-top:var(--sp-5)">' +
        g.examples.map(e => '<div class="ar-block" style="padding:var(--sp-4)"><p class="ar">' + e.ar +
          '</p><div class="translation">' + U.esc(e.uz) + "</div></div>").join("") + "</div>";
    } else if (o.kind === "dictionary") {
      body = "<h3>" + U.esc(res.titleUz) + "</h3>" +
        '<p class="muted" style="margin-top:var(--sp-3)">' + U.esc(res.descUz) + "</p>" +
        '<a class="btn btn-primary btn-block" style="margin-top:var(--sp-5)" href="#/dictionary" data-action="modal-close">' +
        t("nav.dictionary") + "</a>";
    } else {
      body = "<h3>" + U.esc(res.titleUz) + "</h3>" +
        '<p class="muted" style="margin-top:var(--sp-3);line-height:1.7">' + U.esc(res.descUz) + "</p>" +
        '<div class="alert alert-info" style="margin-top:var(--sp-5)"><span class="ico">◔</span><span>' +
        "Ushbu material fayl sifatida admin panel orqali biriktiriladi (PDF/video obyekt xotirasiga yuklanadi). " +
        "Demo rejimda biz o‘ylab topilgan havola yoki fayl ko‘rsatmaymiz.</span></div>";
    }

    TLA.ui.modal(body, { label: res.titleUz, wide: o.kind === "text" });
    if (o.kind === "script") TLA.widgets.mountAudioPlayer("libAudio", TLA.data.scripts[o.id], { allowTranscript: true });
  }

  TLA.pages.library = {
    render: function (params) {
      const q = params.query.q || "";
      const type = params.query.type || "";
      const level = params.query.level || "";
      const access = params.query.access || "";

      const list = TLA.data.library.filter(function (r) {
        if (type && r.type !== type) return false;
        if (level && r.level !== level) return false;
        if (access === "free" && !r.free) return false;
        if (access === "premium" && r.free) return false;
        if (q && !U.includesLoose(r.titleUz + " " + r.titleAr + " " + r.descUz, q)) return false;
        return true;
      });

      const chip = (label, key, value) => {
        const active = params.query[key] === value;
        const nq = Object.assign({}, params.query);
        if (active) delete nq[key]; else nq[key] = value;
        const qs = Object.keys(nq).filter(k => nq[k]).map(k => k + "=" + encodeURIComponent(nq[k])).join("&");
        return '<a class="chip' + (active ? " is-active" : "") + '" href="#/library' + (qs ? "?" + qs : "") + '">' + U.esc(label) + "</a>";
      };

      return TLA.ui.pageHead({
        crumbs: [{ label: t("nav.home"), href: "#/" }, { label: t("nav.library") }],
        eyebrow: t("nav.library"),
        title: t("library.title"),
        lead: t("library.sub")
      }) +
        '<section class="section"><div class="container">' +
        '<div class="toolbar">' +
        '<div class="search-box"><span class="search-ico">⌕</span>' +
        '<input class="input" id="libSearch" placeholder="' + U.attr(t("library.search")) + '" value="' + U.attr(q) + '"></div>' +
        '<a class="btn btn-ghost btn-sm" href="#/library">' + t("action.reset") + "</a></div>" +

        '<div class="filter-row" style="margin-bottom:var(--sp-4)">' +
        [["reading", t("library.books")], ["audio", t("library.audio")], ["video", t("library.video")],
        ["grammar", t("library.grammar")], ["vocabulary", t("library.vocab")], ["exam", t("library.exam")]]
          .map(x => chip(x[1], "type", x[0])).join("") +
        "</div>" +
        '<div class="filter-row" style="margin-bottom:var(--sp-6)">' +
        TLA.data.levels.map(l => chip(l.code, "level", l.id)).join("") +
        chip(t("misc.free"), "access", "free") + chip(t("misc.premium"), "access", "premium") +
        "</div>" +

        (list.length
          ? '<div class="grid grid-2">' + list.map(function (r) {
            return '<button class="res-card" data-open-res="' + r.id + '" data-reveal>' +
              '<span class="res-ico ' + (r.format === "pdf" ? "pdf" : r.type === "audio" ? "audio" : r.type === "video" ? "video" : "") + '">' +
              (RES_ICONS[r.type] || "◈") + "</span>" +
              '<span style="flex:1"><span class="rt">' + U.esc(r.titleUz) + "</span>" +
              '<span class="rs">' + U.esc(r.descUz) + "</span>" +
              '<span class="rm">' + TLA.ui.levelPill(r.level) +
              '<span class="badge badge-outline">' + t("misc.skill." + r.skill) + "</span>" +
              (r.free ? '<span class="badge badge-free">' + t("misc.free") + "</span>"
                : '<span class="badge badge-gold">' + t("misc.premium") + "</span>") +
              "</span></span></button>";
          }).join("") + "</div>"
          : TLA.ui.emptyState("؟", t("empty.search"), t("empty.searchD"),
            '<a class="btn btn-ghost" href="#/library">' + t("action.reset") + "</a>")) +
        "</div></section>";
    },
    mounted: function (params) {
      const search = U.$("#libSearch");
      if (search) {
        search.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            const nq = Object.assign({}, params.query, { q: search.value });
            const qs = Object.keys(nq).filter(k => nq[k]).map(k => k + "=" + encodeURIComponent(nq[k])).join("&");
            location.hash = "#/library" + (qs ? "?" + qs : "");
          }
        });
      }
      U.$$("[data-open-res]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const res = TLA.data.library.filter(r => r.id === btn.dataset.openRes)[0];
          if (res) openResource(res);
        });
      });
      if (params.query.open) {
        const res = TLA.data.library.filter(r => r.id === params.query.open)[0];
        if (res) openResource(res);
      }
    },
    meta: { title: "Arab tili kutubxonasi — Tatbiqul Lisan Academy", desc: "Matnlar, audio darslar, grammatika qo‘llanmalari va imtihon materiallari." }
  };

  /* ================= Dictionary ================= */
  TLA.pages.dictionary = {
    render: function (params) {
      const q = params.query.q || "";
      const dueMode = params.query.due === "1";
      const due = TLA.state.dueWords();
      const saved = Object.keys(TLA.state.profile().vocab);

      let list = TLA.data.dictionary;
      if (dueMode) list = list.filter(d => due.indexOf(d.ar) !== -1);
      if (q) list = list.filter(d => U.includesLoose(d.ar + " " + d.uz + " " + d.tr + " " + d.ex, q));

      return TLA.ui.pageHead({
        crumbs: [{ label: t("nav.library"), href: "#/library" }, { label: t("nav.dictionary") }],
        eyebrow: t("nav.dictionary"),
        title: t("dict.title"),
        lead: t("dict.sub"),
        extra: '<div class="row row-wrap" style="margin-top:var(--sp-4);gap:var(--sp-3)">' +
          '<span class="badge">' + t("dict.saved") + ": " + saved.length + "</span>" +
          (due.length ? '<a class="badge badge-gold" href="#/dictionary?due=1">' + t("dict.reviewDue") + ": " + due.length + "</a>" : "") +

      '<p class="muted" style="margin-top:var(--sp-2);font-size:var(--fs-sm)">' + U.esc(plan.uz) + " — " +

      { label: t("pricing.demoPay") }

    U.$$("[data-method]").forEach(function (btn) {

        TLA.ui.toast(t("pricing.paySuccess"), "success");
        TLA.router.rerender();
      }, 900);
    });
  }

        "</div></div></div></div></div></section>";

    mounted: function () {
      const form = U.$("#contactForm");
      if (!form) return;
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        const fd = new FormData(form);
        const name = (fd.get("name") || "").toString().trim();
        const email = (fd.get("email") || "").toString().trim();
        const message = (fd.get("message") || "").toString().trim();
        if (name.length < 2) return TLA.ui.toast(t("auth.errName"), "error");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return TLA.ui.toast(t("auth.errEmail"), "error");

        TLA.ui.toast("Xabar saqlandi. Backend ulangach, u avtomatik yuboriladi.", "success");

        '<div class="row" style="justify-content:center;gap:var(--sp-3);margin-top:var(--sp-6)">' +
        '<a class="btn btn-primary" href="#/">' + t("error.goHome") + "</a>" +
        '<button class="btn btn-ghost" data-action="search-open">' + t("nav.search") + "</button>" +
        "</div></div></div></section>";
    },
    meta: { title: "Sahifa topilmadi — Tatbiqul Lisan Academy", desc: "" }
  };
})();

              '<td><span class="badge badge-jade">' + U.esc(p.status) + " (demo)</span></td></tr>").join("") +
            "</tbody></table></div>"
          : '<p class="muted" style="margin-top:var(--sp-3);font-size:var(--fs-sm)">Hali to‘lov qayd etilmagan.</p>') +
        TLA.ui.complianceNote("To‘lov provayderi kalitlari faqat serverda saqlanadi. Bu panel demo tranzaksiyalarni ko‘rsatadi.") +
        "</div>";
    },

    analytics: function () {
      const counts = TLA.state.analyticsSummary();
      const users = TLA.state.allUsers();
      const levelDist = {};
      users.forEach(function (u) {
        const p = TLA.state.profileOf(u.id);
        if (p.level) levelDist[p.level] = (levelDist[p.level] || 0) + 1;
      });
      const series = TLA.data.levels.map(l => ({ label: l.code, value: levelDist[l.id] || 0 }));
      const maxUsers = Math.max(1, Math.max.apply(null, series.map(s => s.value)));

      return '<div class="grid grid-2">' +
        '<div class="card"><h3>Foydalanuvchilar darajasi</h3>' +
        '<div style="margin-top:var(--sp-4)">' + TLA.charts.bars(series, { max: maxUsers }) + "</div></div>" +
        '<div class="card"><h3>Hodisalar</h3>' +
        (Object.keys(counts).length
          ? '<div class="stack-sm" style="margin-top:var(--sp-4)">' +
            Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 10).map(function (k) {
              const max = Math.max.apply(null, Object.keys(counts).map(x => counts[x]));
              return '<div class="meter-row"><span class="lbl">' + U.esc(k) + '</span><span class="val">' + counts[k] +
                '</span><span class="progress"><span style="width:' + U.pct(counts[k], max) + '%"></span></span></div>';
            }).join("") + "</div>"
          : '<p class="muted" style="margin-top:var(--sp-3);font-size:var(--fs-sm)">Hodisalar hali yozilmagan.</p>') +
        "</div></div>" +
        '<div class="card" style="margin-top:var(--sp-6)"><h3>Savol sifati</h3>' +
        '<p class="muted" style="font-size:var(--fs-sm);margin-top:var(--sp-2)">Savollar bazasi bo‘limida p-qiymat bo‘yicha to‘liq ro‘yxat mavjud.</p>' +
        '<a class="btn btn-ghost btn-sm" style="margin-top:var(--sp-4)" href="#/admin?tab=questions">Ochish</a></div>';
    },

    settings: function () {
      const cfg = TLA.state.config();
      const field = (path, label, value, type, placeholder) =>
        '<label class="field"><span class="label">' + U.esc(label) + "</span>" +
        '<input class="input" type="' + (type || "text") + '" data-cfg="' + path + '" value="' + U.attr(value || "") +
        '" placeholder="' + U.attr(placeholder || "") + '"></label>';

      return '<div class="card"><h3>Kontakt ma’lumotlari</h3>' +
        '<p class="muted" style="font-size:var(--fs-sm);margin-top:var(--sp-2)">Bu maydonlar «Aloqa» sahifasi va footerda ko‘rsatiladi. Bo‘sh qoldirilsa, sayt «admin panelda kiritiladi» deb yozadi — soxta raqam yoki manzil hech qachon ko‘rsatilmaydi.</p>' +
        '<div class="grid grid-2" style="gap:var(--sp-4);margin-top:var(--sp-4)">' +
        field("contact.phone", "Telefon", cfg.contact.phone, "tel", "+998 ...") +
        field("contact.email", "Email", cfg.contact.email, "email", "info@...") +
        field("contact.telegram", "Telegram havolasi", cfg.contact.telegram, "url", "https://t.me/...") +
        field("contact.address", "Manzil", cfg.contact.address) +
        field("contact.workHours", "Ish vaqti", cfg.contact.workHours, "text", "Du–Sha 09:00–18:00") +
        "</div></div>" +

        '<div class="card" style="margin-top:var(--sp-6)"><h3>Ijtimoiy tarmoqlar</h3>' +
        '<div class="grid grid-2" style="gap:var(--sp-4);margin-top:var(--sp-4)">' +
        field("social.telegram", "Telegram kanal", cfg.social.telegram, "url") +
        field("social.instagram", "Instagram", cfg.social.instagram, "url") +
        field("social.youtube", "YouTube", cfg.social.youtube, "url") +
        "</div></div>" +

        '<div class="card" style="margin-top:var(--sp-6)"><h3>Umumiy</h3>' +
        '<div class="grid grid-2" style="gap:var(--sp-4);margin-top:var(--sp-4)">' +
        field("currency", "Valyuta belgisi", cfg.currency) +
        field("certificatePrefix", "Sertifikat prefiksi", cfg.certificatePrefix, "text", "TLA") +
        field("verifyBaseUrl", "Tekshirish URL asosi", cfg.verifyBaseUrl, "url") +
        "</div>" +
        '<button class="btn btn-primary" id="saveCfg" style="margin-top:var(--sp-4)">' + t("action.save") + "</button>" +
        '<p class="field-hint">Tekshirish URL sertifikatdagi QR kodga yoziladi.</p></div>';
    }
  };

  /* ---------------- Page ---------------- */
  TLA.pages.admin = {
    render: function (params) {
      if (!TLA.state.isAuthed()) {
        return TLA.ui.pageHead({ title: t("nav.admin") }) +
          '<section class="section"><div class="container container-narrow">' +
          TLA.ui.emptyState("◍", t("auth.needAuth"), t("admin.roleNote"),
            '<button class="btn btn-primary" data-action="auth-login">' + t("action.login") + "</button>") +
          "</div></section>";
      }
      if (!TLA.state.isAdmin()) {
        return TLA.ui.pageHead({ title: t("nav.admin") }) +
          '<section class="section"><div class="container container-narrow">' +
          TLA.ui.emptyState("⚿", "Ruxsat yo‘q", t("admin.roleNote"),
            '<a class="btn btn-ghost" href="#/dashboard">' + t("nav.dashboard") + "</a>") +
          "</div></section>";
      }

      const active = params.query.tab && views[params.query.tab] ? params.query.tab : "overview";

      return TLA.ui.pageHead({
        eyebrow: t("nav.admin"),
        title: t("admin.title"),
        lead: "Kontent, foydalanuvchilar va platforma sozlamalarini boshqarish."
      }) +
        '<section class="section"><div class="container">' +
        '<div class="alert alert-info" style="margin-bottom:var(--sp-5)"><span class="ico">◈</span><span>' +
        t("admin.demoNote") + "</span></div>" +
        '<div class="tabs" style="margin-bottom:var(--sp-6)">' +
        TABS.map(x => '<a class="tab" href="#/admin?tab=' + x.id + '" aria-selected="' + (x.id === active) + '">' +
          U.esc(x.label) + "</a>").join("") +
        "</div>" +
        '<div id="adminPanel">' + views[active]() + "</div>" +
        "</div></section>";
    },

    mounted: function (params) {
      if (!TLA.state.isAdmin()) return;
      const active = params.query.tab && views[params.query.tab] ? params.query.tab : "overview";

      if (active === "users") {
        U.$$("[data-role]").forEach(function (sel) {
          sel.addEventListener("change", function () {
            TLA.state.setUserRole(sel.dataset.role, sel.value);
            TLA.ui.toast("Rol yangilandi.", "success");
            TLA.ui.renderHeader();
          });
        });
        U.$$("[data-del-user]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            TLA.ui.confirmDialog("Foydalanuvchini o‘chirish", "Bu amalni bekor qilib bo‘lmaydi.", t("action.delete"), function () {
              TLA.state.removeUser(btn.dataset.delUser);
              TLA.router.rerender();
              TLA.ui.toast("O‘chirildi.", "info");
            }, true);
          });
        });
      }

      if (active === "questions") {
        const form = U.$("#qForm");
        if (form) {
          form.addEventListener("submit", function (ev) {
            ev.preventDefault();
            const fd = new FormData(form);
            const opts = [0, 1, 2, 3].map(i => (fd.get("opt" + i) || "").toString().trim());
            if (opts.some(o => !o)) return TLA.ui.toast("Barcha variantlarni to‘ldiring.", "error");
            TLA.state.addQuestion({
              type: "mcq",
              level: fd.get("level"),
              skill: fd.get("skill"),
              topic: "custom",
              diff: "medium",
              promptUz: (fd.get("promptUz") || "").toString().trim(),
              ar: (fd.get("ar") || "").toString().trim(),
              opts: opts,
              optsAr: !!fd.get("optsAr"),
              ans: 0,
              expUz: (fd.get("expUz") || "").toString().trim(),
              tags: ["custom"]
            });
            TLA.ui.toast("Savol qo‘shildi.", "success");
            TLA.router.rerender();
          });
        }
        U.$$("[data-del-q]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            TLA.state.removeQuestion(btn.dataset.delQ);
            TLA.router.rerender();
            TLA.ui.toast("Savol o‘chirildi.", "info");
          });
        });
      }

      if (active === "teachers") {
        const form = U.$("#teacherForm");
        if (form) {
          form.addEventListener("submit", function (ev) {
            ev.preventDefault();
            const fd = new FormData(form);
            const name = (fd.get("name") || "").toString().trim();
            if (name.length < 2) return TLA.ui.toast("Ismni kiriting.", "error");
            TLA.state.addTeacher({
              name: name,
              title: (fd.get("title") || "").toString().trim(),
              bio: (fd.get("bio") || "").toString().trim(),
              languages: (fd.get("languages") || "").toString().trim()
            });
            TLA.ui.toast("O‘qituvchi qo‘shildi.", "success");
            TLA.router.rerender();
          });
        }
        U.$$("[data-del-teacher]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            TLA.state.removeTeacher(btn.dataset.delTeacher);
            TLA.router.rerender();
          });
        });
      }

      if (active === "payments") {
        const save = U.$("#savePrices");
        if (save) {
          save.addEventListener("click", function () {
            U.$$("[data-price]").forEach(function (input) {
              TLA.state.setPlanPrice(input.dataset.price, input.value);
            });
            TLA.ui.toast("Narxlar saqlandi.", "success");
          });
        }
      }

      if (active === "settings") {
        const save = U.$("#saveCfg");
        if (save) {
          save.addEventListener("click", function () {
            U.$$("[data-cfg]").forEach(function (input) {
              TLA.state.setConfig(input.dataset.cfg, input.value.trim());
            });
            TLA.ui.toast("Sozlamalar saqlandi.", "success");
            TLA.ui.renderFooter();
          });
        }
      }
    },

    meta: { title: "Admin panel — Tatbiqul Lisan Academy", desc: "" }
  };
})();


/* ===== 20-router.js ===== */
/* ============================================================
   ROUTER + BOOT
   Hash routing keeps the whole app in a single file with no
   server rewrite rules. Every page exposes render(params),
   optional mounted(params) / unmount() and meta.
   ============================================================ */
window.TLA = window.TLA || {};

TLA.router = (function () {
  "use strict";
  const U = TLA.utils;

  const ROUTES = [
    { re: /^\/?$/, page: "home" },
    { re: /^\/learn$/, page: "learn" },
    { re: /^\/learn\/([^/]+)$/, page: "course", keys: ["id"] },
    { re: /^\/lesson\/([^/]+)$/, page: "lesson", keys: ["id"] },
    { re: /^\/exams$/, page: "exams" },
    { re: /^\/exams\/([^/]+)$/, page: "examTrack", keys: ["track"] },
    { re: /^\/tests$/, page: "tests" },
    { re: /^\/test\/([^/]+)$/, page: "test", keys: ["id"] },
    { re: /^\/result\/([^/]+)$/, page: "result", keys: ["id"] },
    { re: /^\/library$/, page: "library" },
    { re: /^\/dictionary$/, page: "dictionary" },
    { re: /^\/blog$/, page: "blog" },
    { re: /^\/blog\/([^/]+)$/, page: "blogPost", keys: ["slug"] },
    { re: /^\/free$/, page: "free" },
    { re: /^\/pricing$/, page: "pricing" },
    { re: /^\/dashboard$/, page: "dashboard" },
    { re: /^\/progress$/, page: "progress" },
    { re: /^\/certificates$/, page: "certificates" },
    { re: /^\/verify$/, page: "verify" },
    { re: /^\/profile$/, page: "profile" },
    { re: /^\/leaderboard$/, page: "leaderboard" },
    { re: /^\/teachers$/, page: "teachers" },
    { re: /^\/about$/, page: "about" },
    { re: /^\/contact$/, page: "contact" },
    { re: /^\/legal\/([^/]+)$/, page: "legal", keys: ["doc"] }
  ];

  let currentPage = null;
  let currentHash = null;

  function parse(hash) {
    const raw = (hash || location.hash || "#/").replace(/^#/, "");
    const [pathPart, queryPart] = raw.split("?");
    const path = decodeURIComponent(pathPart || "/");
    const query = {};
    (queryPart || "").split("&").filter(Boolean).forEach(function (pair) {
      const [k, v] = pair.split("=");
      if (k) query[decodeURIComponent(k)] = decodeURIComponent(v || "");
    });

    if (path === "/admin") return { page: "admin", params: { query: query } };

    for (let i = 0; i < ROUTES.length; i++) {
      const match = path.match(ROUTES[i].re);
      if (match) {
        const params = { query: query };
        (ROUTES[i].keys || []).forEach(function (key, ki) {
          params[key] = match[ki + 1];
        });
        return { page: ROUTES[i].page, params: params };
      }
    }
    return { page: "notFound", params: { query: query } };
  }

  function applyMeta(page, params) {
    const meta = typeof page.meta === "function" ? page.meta(params) : page.meta;
    if (!meta) return;
    if (meta.title) document.title = meta.title;
    const desc = document.querySelector('meta[name="description"]');
    if (desc && meta.desc !== undefined) desc.setAttribute("content", meta.desc);
    const ogTitle = document.querySelector('meta[property="og:title"]');
    if (ogTitle && meta.title) ogTitle.setAttribute("content", meta.title);
    const ogDesc = document.querySelector('meta[property="og:description"]');
    if (ogDesc && meta.desc !== undefined) ogDesc.setAttribute("content", meta.desc);
  }

  function render() {
    const route = parse();
    const page = TLA.pages[route.page] || TLA.pages.notFound;
    const host = U.$("#pageHost");
    if (!host) return;

    // let the previous page release timers, audio and listeners
    if (currentPage && currentPage.unmount) {
      try { currentPage.unmount(); } catch (e) { /* keep navigating */ }
    }

    host.setAttribute("aria-busy", "true");
    try {
      host.innerHTML = page.render(route.params);
    } catch (err) {
      host.innerHTML = '<section class="section"><div class="container container-narrow">' +
        '<div class="alert alert-danger"><span class="ico">!</span><span>' +
        TLA.i18n.t("error.generic") + "</span></div>" +
        '<p class="muted mono" style="margin-top:var(--sp-4);font-size:var(--fs-2xs)">' +
        TLA.utils.esc(String(err && err.message ? err.message : err)) + "</p>" +
        '<a class="btn btn-primary" style="margin-top:var(--sp-4)" href="#/">' + TLA.i18n.t("error.goHome") + "</a>" +
        "</div></section>";
    }
    host.removeAttribute("aria-busy");

    currentPage = page;
    applyMeta(page, route.params);

    if (page.mounted) {
      try { page.mounted(route.params); } catch (e) { /* page still renders */ }
    }

    TLA.ui.renderHeader();
    TLA.ui.renderBottomNav();
    TLA.ui.reveal(host);
    TLA.state.track("page_view", { page: route.page });
  }

  function onHashChange() {
    const next = location.hash || "#/";
    if (next === currentHash) return;

    // guard against losing an in-progress exam
    if (TLA.pages.test && TLA.pages.test.isRunning && TLA.pages.test.isRunning() &&
      next.indexOf("#/test/") !== 0 && next.indexOf("#/result/") !== 0) {
      const previous = currentHash;
      TLA.ui.confirmDialog(
        TLA.i18n.t("test.exit"),
        TLA.i18n.t("test.exitConfirm"),
        TLA.i18n.t("test.exit"),
        function () {
          currentHash = next;
          if (TLA.pages.test.unmount) TLA.pages.test.unmount();
          render();
          U.scrollToTop(true);
        },
        true
      );
      // stay where we are until the user confirms
      location.hash = previous || "#/";
      return;
    }

    currentHash = next;
    TLA.ui.closeModal();
    TLA.ui.closeDrawer();
    TLA.ui.closeSearch();
    render();
    U.scrollToTop(true);
  }

  function go(hash) {
    if (location.hash === hash) { render(); return; }
    location.hash = hash;
  }

  function rerender() { render(); }

  function start() {
    window.addEventListener("hashchange", onHashChange);
    if (!location.hash) location.hash = "#/";
    currentHash = location.hash;
    render();
  }

  return { start, go, rerender, parse };
})();

/* ============================================================
   BOOT
   ============================================================ */
(async function boot() {
  "use strict";

  function fatal(message) {
    const host = document.getElementById("pageHost");
    if (host) {
      host.innerHTML = '<section class="section"><div class="container container-narrow">' +
        '<div class="alert alert-danger"><span class="ico">!</span><span>' + message + "</span></div></div></section>";
    }
  }

  try {
    await TLA.state.init();
    TLA.state.hydrateCustomQuestions();
    // Backend session restore (05b-api.js + 06-state.js): if a saved token
    // is present, this resolves before the shell paints so a reload never
    // flashes "guest" before flipping to "logged in". Costs nothing when
    // there is no token (the common case for the static-only deployment —
    // see DEPLOY.md) since restoreSession() returns immediately in that case.
    await TLA.state.restoreSession();

    const settings = TLA.state.settings();
    TLA.i18n.set(settings.lang || "uz");
    TLA.ui.applySettings();
    TLA.ui.renderShell();
    TLA.ui.bindGlobal();
    TLA.ui.bindScroll();
    TLA.audio.refreshVoices();
    TLA.state.touchStreak();

    TLA.router.start();

    // remove the pre-boot splash once the first page is painted
    const splash = document.getElementById("bootSplash");
    if (splash) {
      splash.classList.add("out");
      setTimeout(() => splash.remove(), 420);
    }

    document.documentElement.classList.add("is-ready");
  } catch (err) {
    fatal("Ilovani ishga tushirishda xatolik: " + (err && err.message ? err.message : err));
  }
})();

</script>
