/* ===== 01-tokens.css ===== */
/* ============================================================
   TATBIQUL LISAN ACADEMY — DESIGN TOKENS
   Palette concept: Arabic manuscript illumination
   (lapis ground · gold leaf · ivory vellum · jade · rubric red)
   ============================================================ */

:root {
  /* --- Brand: navy / lapis ground --- */
  --navy-950: #04101c;
  --navy-900: #071a2c;
  --navy-850: #0a2135;
  --navy-800: #0d2137;
  --navy-700: #123054;
  --navy-600: #1a4272;
  --navy-500: #245a94;
  --navy-400: #4a7cb0;
  --navy-300: #8badcd;
  --navy-200: #c3d6e6;
  --navy-100: #e3ecf4;

  /* --- Accent: warm gold leaf (used sparingly) --- */
  --gold-700: #8a6a20;
  --gold-600: #a8842c;
  --gold-500: #c8a253;
  --gold-400: #ddba76;
  --gold-300: #e7cd93;
  --gold-200: #f2e3bf;
  --gold-100: #faf3e0;

  /* --- Support: jade (progress / success) --- */
  --jade-700: #145b50;
  --jade-600: #1e7d6e;
  --jade-500: #2b9c89;
  --jade-300: #8fd2c5;
  --jade-100: #e4f4f0;

  /* --- Support: rubric red (warnings / errors) --- */
  --rubric-700: #8e321f;
  --rubric-600: #b3452f;
  --rubric-500: #cf6349;
  --rubric-300: #eca894;
  --rubric-100: #fbeae5;

  /* --- Neutrals: vellum --- */
  --ivory: #fbf7ef;
  --beige: #ede3d1;
  --gray-50: #f6f7f9;
  --gray-100: #eef1f5;
  --gray-200: #e0e5ec;
  --gray-300: #c8d0da;
  --gray-400: #98a4b3;
  --gray-500: #6b7785;
  --gray-600: #4c5765;
  --gray-700: #333c48;
  --white: #ffffff;

  /* --- Semantic (light theme default) --- */
  --bg: #f7f5f0;
  --bg-alt: var(--ivory);
  --bg-deep: var(--navy-900);
  --surface: #ffffff;
  --surface-2: #fbfaf7;
  --surface-3: #f1f2f5;
  --surface-inverse: var(--navy-850);
  --border: #e3e0d8;
  --border-strong: #cfcbc0;
  --border-inverse: rgba(231, 205, 147, 0.22);

  --ink: #17202b;
  --ink-2: #414c5a;
  --ink-3: #6b7785;
  --ink-inverse: #f4f1e9;
  --ink-inverse-2: rgba(244, 241, 233, 0.72);

  --brand: var(--navy-700);
  --brand-strong: var(--navy-900);
  --brand-soft: #eaf0f7;
  --accent: var(--gold-600);
  --accent-soft: var(--gold-100);
  --accent-ink: #6d5316;
  --success: var(--jade-600);
  --success-soft: var(--jade-100);
  --danger: var(--rubric-600);
  --danger-soft: var(--rubric-100);
  --warn: #b3801f;
  --warn-soft: #fbf1da;
  --info: var(--navy-600);
  --info-soft: #e8f0f9;

  --glass: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.6);
  --glass-dark: rgba(9, 27, 46, 0.55);

  /* --- Typography --- */
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
    "URW Palladio L", Georgia, "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    "Noto Sans", Arial, sans-serif;
  --font-arabic: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic",
    "Sakkal Majalla", "Geeza Pro", "Segoe UI", "Times New Roman", serif;
  --font-arabic-ui: "Noto Sans Arabic", "Dubai", "Segoe UI", "Geeza Pro", Tahoma, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", "Segoe UI Mono",
    "Roboto Mono", Menlo, Consolas, monospace;

  --fs-3xs: 0.6875rem;
  --fs-2xs: 0.75rem;
  --fs-xs: 0.8125rem;
  --fs-sm: 0.875rem;
  --fs-md: 0.9375rem;
  --fs-base: 1rem;
  --fs-lg: 1.125rem;
  --fs-xl: 1.3125rem;
  --fs-2xl: 1.625rem;
  --fs-3xl: 2rem;
  --fs-4xl: 2.5rem;
  --fs-5xl: 3.25rem;
  --fs-6xl: 4rem;

  --lh-tight: 1.12;
  --lh-snug: 1.28;
  --lh-normal: 1.55;
  --lh-loose: 1.75;
  --lh-arabic: 2.05;

  --tracking-eyebrow: 0.16em;
  --tracking-tight: -0.02em;

  /* --- Spacing (4px base) --- */
  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.25rem;
  --sp-6: 1.5rem;
  --sp-7: 2rem;
  --sp-8: 2.5rem;
  --sp-9: 3rem;
  --sp-10: 4rem;
  --sp-11: 5rem;
  --sp-12: 6.5rem;

  --section-y: clamp(3.5rem, 7vw, 6.5rem);
  --container: 1280px;
  --container-wide: 1400px;
  --container-narrow: 820px;

  /* --- Radius --- */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* --- Shadow --- */
  --sh-xs: 0 1px 2px rgba(9, 27, 46, 0.06);
  --sh-sm: 0 2px 6px rgba(9, 27, 46, 0.07), 0 1px 2px rgba(9, 27, 46, 0.05);
  --sh-md: 0 8px 22px -8px rgba(9, 27, 46, 0.16), 0 2px 6px rgba(9, 27, 46, 0.05);
  --sh-lg: 0 20px 46px -18px rgba(9, 27, 46, 0.28), 0 6px 14px -8px rgba(9, 27, 46, 0.1);
  --sh-xl: 0 38px 80px -30px rgba(4, 16, 28, 0.42), 0 10px 24px -14px rgba(4, 16, 28, 0.2);
  --sh-gold: 0 10px 30px -12px rgba(168, 132, 44, 0.45);
  --sh-inset: inset 0 1px 0 rgba(255, 255, 255, 0.6);

  /* --- Motion --- */
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --t-fast: 140ms;
  --t-base: 240ms;
  --t-slow: 480ms;

  /* --- Layers --- */
  --z-base: 1;
  --z-sticky: 40;
  --z-header: 60;
  --z-drawer: 80;
  --z-modal: 100;
  --z-toast: 120;

  --header-h: 72px;
  --bottomnav-h: 64px;
  --font-scale: 1;
}

/* ---------- Dark theme (purpose-built, not inverted) ---------- */
[data-theme="dark"] {
  --bg: #061321;
  --bg-alt: #08182a;
  --bg-deep: #040e1a;
  --surface: #0c2138;
  --surface-2: #102942;
  --surface-3: #163150;
  --surface-inverse: #081a2c;
  --border: rgba(148, 183, 214, 0.16);
  --border-strong: rgba(148, 183, 214, 0.3);
  --border-inverse: rgba(231, 205, 147, 0.2);

  --ink: #e9eff6;
  --ink-2: #b7c6d6;
  --ink-3: #8296ab;
  --ink-inverse: #f4f1e9;
  --ink-inverse-2: rgba(244, 241, 233, 0.7);

  --brand: #6ea3d8;
  --brand-strong: #cfe2f5;
  --brand-soft: rgba(36, 90, 148, 0.24);
  --accent: var(--gold-400);
  --accent-soft: rgba(200, 162, 83, 0.16);
  --accent-ink: var(--gold-300);
  --success: #3fb39d;
  --success-soft: rgba(43, 156, 137, 0.18);
  --danger: #e08267;
  --danger-soft: rgba(179, 69, 47, 0.22);
  --warn: #dcae52;
  --warn-soft: rgba(179, 128, 31, 0.2);
  --info: #74a8dd;
  --info-soft: rgba(36, 90, 148, 0.22);

  --glass: rgba(16, 41, 66, 0.62);
  --glass-border: rgba(148, 183, 214, 0.18);
  --glass-dark: rgba(4, 14, 26, 0.6);

  --sh-xs: 0 1px 2px rgba(0, 0, 0, 0.4);
  --sh-sm: 0 2px 6px rgba(0, 0, 0, 0.35);
  --sh-md: 0 10px 26px -10px rgba(0, 0, 0, 0.6);
  --sh-lg: 0 22px 50px -20px rgba(0, 0, 0, 0.72);
  --sh-xl: 0 40px 84px -32px rgba(0, 0, 0, 0.82);
  --sh-inset: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}


/* ===== 02-base.css ===== */
/* ============================================================
   BASE — reset, typography, RTL, a11y, utilities
   ============================================================ */

*,
*::before,
*::after { box-sizing: border-box; }

* { margin: 0; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  font-size: calc(100% * var(--font-scale));
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  overflow-x: hidden;
  text-rendering: optimizeLegibility;
  transition: background-color var(--t-base) var(--ease), color var(--t-base) var(--ease);
}

body.is-locked { overflow: hidden; }

img, svg, video, canvas { display: block; max-width: 100%; }
img { height: auto; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button { background: none; border: 0; cursor: pointer; }

a { color: inherit; text-decoration: none; }

ul, ol { list-style: none; padding: 0; }

h1, h2, h3, h4, h5 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  color: var(--ink);
  text-wrap: balance;
}

h1 { font-size: clamp(2.1rem, 5.2vw, var(--fs-5xl)); }
h2 { font-size: clamp(1.7rem, 3.6vw, var(--fs-4xl)); }
h3 { font-size: clamp(1.3rem, 2.4vw, var(--fs-2xl)); }
h4 { font-size: var(--fs-xl); }
h5 { font-size: var(--fs-lg); }

p { text-wrap: pretty; }

hr { border: 0; border-top: 1px solid var(--border); }

::selection { background: var(--gold-300); color: var(--navy-900); }

/* ---------- Scrollbar ---------- */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) transparent;
}
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--r-pill);
  border: 3px solid var(--bg);
}
*::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

/* ---------- Focus visibility ---------- */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

.skip-link {
  position: absolute;
  inset-inline-start: var(--sp-4);
  top: -100px;
  z-index: 200;
  background: var(--navy-900);
  color: var(--ivory);
  padding: var(--sp-3) var(--sp-5);
  border-radius: var(--r-sm);
  transition: top var(--t-base) var(--ease);
}
.skip-link:focus { top: var(--sp-4); }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Arabic / RTL ---------- */
.ar,
[lang="ar"] {
  font-family: var(--font-arabic);
  direction: rtl;
  line-height: var(--lh-arabic);
  font-size: 1.14em;
  letter-spacing: 0;
  text-align: start;
  unicode-bidi: isolate;
}

.ar-ui { font-family: var(--font-arabic-ui); direction: rtl; unicode-bidi: isolate; }

.ar-lg { font-size: 1.5em; line-height: 1.9; }
.ar-xl { font-size: 2em; line-height: 1.7; }

html[dir="rtl"] body { font-family: var(--font-arabic-ui); }
html[dir="rtl"] h1,
html[dir="rtl"] h2,
html[dir="rtl"] h3,
html[dir="rtl"] h4,
html[dir="rtl"] h5 { font-family: var(--font-arabic); letter-spacing: 0; line-height: 1.35; }
html[dir="rtl"] .ar,
html[dir="rtl"] [lang="ar"] { direction: rtl; }
html[dir="rtl"] .mirror { transform: scaleX(-1); }

/* Latin fragments inside RTL layout stay readable */
html[dir="rtl"] .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ---------- Layout helpers ---------- */
.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--sp-5);
}
.container-narrow { max-width: var(--container-narrow); }
.container-wide { max-width: var(--container-wide); }

.section { padding-block: var(--section-y); position: relative; }
.section-tight { padding-block: clamp(2.5rem, 4.5vw, 4rem); }

.stack > * + * { margin-top: var(--sp-4); }
.stack-sm > * + * { margin-top: var(--sp-2); }
.stack-lg > * + * { margin-top: var(--sp-6); }

.row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
.row-wrap { flex-wrap: wrap; }
.row-top { align-items: flex-start; }

.grid { display: grid; gap: var(--sp-5); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-auto { grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }

/* Grid tracks default to min-width:auto, so one wide child (a table, a long
   Arabic word, a tab strip) can push a column past the viewport. Clamping every
   grid child to min-width:0 makes collapsing layouts shrink instead of overflow. */
.grid > *,
.grid-2 > *, .grid-3 > *, .grid-4 > *, .grid-auto > * { min-width: 0; }

.spacer { flex: 1 1 auto; }
.hidden { display: none !important; }
.text-center { text-align: center; }
.text-end { text-align: end; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }
.muted { color: var(--ink-3); }
.strong { font-weight: 650; }
.full { width: 100%; }

.lead {
  font-size: clamp(1.02rem, 1.6vw, var(--fs-lg));
  color: var(--ink-2);
  line-height: var(--lh-loose);
  max-width: 62ch;
}

/* ---------- Eyebrow (structural label) ---------- */
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-3);
  font-family: var(--font-body);
  font-size: var(--fs-2xs);
  font-weight: 700;
  letter-spacing: var(--tracking-eyebrow);
  text-transform: uppercase;
  color: var(--accent-ink);
}
.eyebrow::before {
  content: "";
  width: 28px;
  height: 1px;
  background: linear-gradient(to right, var(--gold-500), transparent);
}
html[dir="rtl"] .eyebrow::before { background: linear-gradient(to left, var(--gold-500), transparent); }
[data-theme="dark"] .eyebrow { color: var(--gold-300); }

.section-head { max-width: 70ch; margin-bottom: var(--sp-8); }
.section-head .eyebrow { margin-bottom: var(--sp-4); }
.section-head h2 + p { margin-top: var(--sp-4); }
.section-head.center { margin-inline: auto; text-align: center; }
.section-head.center .eyebrow::before { display: none; }

/* ---------- Ornament: manuscript hairline ---------- */
.rule-gold {
  height: 2px;
  background: linear-gradient(to right, transparent, var(--gold-500), transparent);
  opacity: 0.6;
  border-radius: 2px;
}

/* ---------- Motion & scroll reveal ---------- */
[data-reveal] {
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out);
  transition-delay: var(--reveal-delay, 0ms);
  will-change: opacity, transform;
}
[data-reveal].is-visible { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  [data-reveal] { opacity: 1; transform: none; }
}
html[data-motion="off"] [data-reveal] { opacity: 1; transform: none; }
html[data-motion="off"] .floaty,
html[data-motion="off"] .hero-scene * { animation: none !important; }


/* ===== 03-components.css ===== */
/* ============================================================
   COMPONENTS — design-system primitives
   ============================================================ */

/* ---------------- Buttons ---------------- */
.btn {
  --btn-bg: var(--navy-800);
  --btn-ink: var(--ivory);
  --btn-border: transparent;
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 0.72rem 1.35rem;
  min-height: 46px;
  border-radius: var(--r-pill);
  border: 1px solid var(--btn-border);
  background: var(--btn-bg);
  color: var(--btn-ink);
  font-family: var(--font-body);
  font-size: var(--fs-sm);
  font-weight: 650;
  letter-spacing: 0.01em;
  line-height: 1;
  text-align: center;
  cursor: pointer;
  overflow: hidden;
  transition: transform var(--t-fast) var(--ease), box-shadow var(--t-base) var(--ease),
    background-color var(--t-base) var(--ease), color var(--t-base) var(--ease),
    border-color var(--t-base) var(--ease), opacity var(--t-base) var(--ease);
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--sh-md); }
.btn:active { transform: translateY(0); box-shadow: var(--sh-xs); }
.btn:disabled,
.btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
.btn .ico { flex: none; }

.btn-primary {
  --btn-bg: linear-gradient(135deg, var(--navy-700), var(--navy-900) 70%);
  box-shadow: var(--sh-sm), inset 0 1px 0 rgba(255, 255, 255, 0.12);
}
.btn-primary::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent 20%, rgba(231, 205, 147, 0.28), transparent 80%);
  transform: translateX(-120%);
  transition: transform 700ms var(--ease-out);
}
.btn-primary:hover::after { transform: translateX(120%); }
[data-theme="dark"] .btn-primary { --btn-bg: linear-gradient(135deg, var(--navy-600), var(--navy-800)); }

.btn-gold {
  --btn-bg: linear-gradient(135deg, var(--gold-400), var(--gold-600));
  --btn-ink: #26200c;
  box-shadow: var(--sh-gold), inset 0 1px 0 rgba(255, 255, 255, 0.4);
}
.btn-ghost {
  --btn-bg: transparent;
  --btn-ink: var(--ink);
  --btn-border: var(--border-strong);
}
.btn-ghost:hover { --btn-bg: var(--surface-3); }

.btn-soft {
  --btn-bg: var(--brand-soft);
  --btn-ink: var(--navy-700);
  --btn-border: transparent;
}
[data-theme="dark"] .btn-soft { --btn-ink: var(--brand-strong); }

.btn-quiet {
  --btn-bg: transparent;
  --btn-ink: var(--ink-2);
  min-height: 38px;
  padding: 0.4rem 0.7rem;
  font-weight: 600;
}
.btn-quiet:hover { --btn-bg: var(--surface-3); box-shadow: none; transform: none; }

.btn-danger { --btn-bg: var(--danger); --btn-ink: #fff; }
.btn-success { --btn-bg: var(--success); --btn-ink: #fff; }

.btn-lg { min-height: 54px; padding: 0.95rem 1.8rem; font-size: var(--fs-md); }
.btn-sm { min-height: 36px; padding: 0.4rem 0.9rem; font-size: var(--fs-xs); }
.btn-block { width: 100%; }
.btn-icon { padding: 0; width: 42px; height: 42px; min-height: 0; border-radius: var(--r-pill); }

.btn-arrow .arw { transition: transform var(--t-base) var(--ease); }
.btn-arrow:hover .arw { transform: translateX(4px); }
html[dir="rtl"] .btn-arrow .arw { transform: scaleX(-1); }
html[dir="rtl"] .btn-arrow:hover .arw { transform: scaleX(-1) translateX(4px); }

/* ---------------- Cards ---------------- */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-6);
  box-shadow: var(--sh-sm);
  transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease),
    border-color var(--t-base) var(--ease);
}
.card-hover:hover {
  transform: translateY(-4px);
  box-shadow: var(--sh-lg);
  border-color: var(--gold-300);
}
.card-flat { box-shadow: none; }
.card-pad-sm { padding: var(--sp-4); }
.card-glass {
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid var(--glass-border);
}
.card-dark {
  background: linear-gradient(160deg, var(--navy-800), var(--navy-950));
  color: var(--ink-inverse);
  border-color: var(--border-inverse);
}
.card-dark h1, .card-dark h2, .card-dark h3, .card-dark h4 { color: var(--ivory); }
.card-dark .muted { color: var(--ink-inverse-2); }

.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); margin-bottom: var(--sp-4); }
.card-title { font-size: var(--fs-lg); font-family: var(--font-display); font-weight: 600; }
.card-sub { font-size: var(--fs-sm); color: var(--ink-3); margin-top: 2px; }

/* illuminated corner ornament */
.card-illum::before,
.card-illum::after {
  content: "";
  position: absolute;
  width: 20px; height: 20px;
  border: 1.5px solid var(--gold-400);
  opacity: 0.55;
  pointer-events: none;
}
.card-illum::before { inset-block-start: 10px; inset-inline-start: 10px; border-inline-end: 0; border-block-end: 0; border-start-start-radius: 8px; }
.card-illum::after { inset-block-end: 10px; inset-inline-end: 10px; border-inline-start: 0; border-block-start: 0; border-end-end-radius: 8px; }

/* ---------------- Badges & chips ---------------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0.28rem 0.65rem;
  border-radius: var(--r-pill);
  font-size: var(--fs-2xs);
  font-weight: 700;
  letter-spacing: 0.03em;
  background: var(--surface-3);
  color: var(--ink-2);
  border: 1px solid transparent;
  white-space: nowrap;
}
.badge-gold { background: var(--accent-soft); color: var(--accent-ink); border-color: rgba(200, 162, 83, 0.35); }
.badge-navy { background: var(--brand-soft); color: var(--navy-700); }
[data-theme="dark"] .badge-navy { color: var(--brand-strong); }
.badge-jade { background: var(--success-soft); color: var(--success); }
.badge-red { background: var(--danger-soft); color: var(--danger); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-free { background: var(--success-soft); color: var(--jade-700); }
[data-theme="dark"] .badge-free { color: var(--jade-300); }
.badge-outline { background: transparent; border-color: var(--border-strong); color: var(--ink-3); }
.badge-demo { background: repeating-linear-gradient(135deg, var(--warn-soft), var(--warn-soft) 6px, transparent 6px, transparent 12px); color: var(--warn); border-color: rgba(179, 128, 31, 0.3); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0.45rem 0.9rem;
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  cursor: pointer;
  transition: all var(--t-fast) var(--ease);
}
.chip:hover { border-color: var(--gold-400); color: var(--ink); }
.chip[aria-pressed="true"], .chip.is-active {
  background: var(--navy-800);
  border-color: var(--navy-800);
  color: var(--ivory);
}
[data-theme="dark"] .chip[aria-pressed="true"],
[data-theme="dark"] .chip.is-active { background: var(--gold-500); border-color: var(--gold-500); color: #22190a; }

/* level pill */
.lvl {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 42px;
  height: 26px;
  padding-inline: 8px;
  border-radius: var(--r-xs);
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  font-weight: 700;
  letter-spacing: 0.06em;
  background: var(--navy-800);
  color: var(--gold-300);
  border: 1px solid rgba(231, 205, 147, 0.25);
}
.lvl-a1 { background: #1f4d63; }
.lvl-a2 { background: #1c5a5a; }
.lvl-b1 { background: #2a5a3d; }
.lvl-b2 { background: #5c4a17; }
.lvl-c1 { background: #6b3a1c; }
.lvl-c2 { background: #5c2333; }

/* ---------------- Forms ---------------- */
.field { display: block; }
.field + .field { margin-top: var(--sp-4); }
.label {
  display: block;
  font-size: var(--fs-xs);
  font-weight: 650;
  color: var(--ink-2);
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}
.input,
.select,
.textarea {
  width: 100%;
  padding: 0.72rem 0.95rem;
  min-height: 46px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  color: var(--ink);
  font-size: var(--fs-sm);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.input::placeholder, .textarea::placeholder { color: var(--ink-3); opacity: 0.75; }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--navy-500);
  box-shadow: 0 0 0 3px var(--brand-soft);
  outline: none;
}
.textarea { min-height: 120px; resize: vertical; line-height: var(--lh-normal); }
.select {
  appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-inline-end: 2.2rem;
}
html[dir="rtl"] .select { background-position: 13px 50%, 18px 50%; padding-inline-end: 0.95rem; padding-inline-start: 2.2rem; }
.field-error .input, .field-error .select, .field-error .textarea { border-color: var(--danger); }
.field-msg { font-size: var(--fs-2xs); color: var(--danger); margin-top: 5px; min-height: 1em; }
.field-hint { font-size: var(--fs-2xs); color: var(--ink-3); margin-top: 5px; }

.check {
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  cursor: pointer;
  font-size: var(--fs-sm);
  color: var(--ink-2);
  line-height: 1.4;
}
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--navy-700); flex: none; cursor: pointer; }

.switch { display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch .track {
  width: 46px; height: 26px;
  background: var(--gray-300);
  border-radius: var(--r-pill);
  position: relative;
  transition: background var(--t-base) var(--ease);
  flex: none;
}
.switch .track::after {
  content: "";
  position: absolute;
  top: 3px; inset-inline-start: 3px;
  width: 20px; height: 20px;
  background: #fff;
  border-radius: 50%;
  box-shadow: var(--sh-sm);
  transition: transform var(--t-base) var(--ease-spring);
}
.switch input:checked + .track { background: var(--success); }
.switch input:checked + .track::after { transform: translateX(20px); }
html[dir="rtl"] .switch input:checked + .track::after { transform: translateX(-20px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

.search-box { position: relative; }
.search-box .input { padding-inline-start: 2.6rem; }
.search-box .search-ico {
  position: absolute;
  inset-inline-start: 0.9rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--ink-3);
  pointer-events: none;
}

/* ---------------- Tabs & segmented ---------------- */
.tabs {
  display: flex;
  gap: var(--sp-1);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  padding: 0.7rem 1rem;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-3);
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold-500); }

.segmented {
  display: inline-flex;
  padding: 4px;
  gap: 2px;
  background: var(--surface-3);
  border-radius: var(--r-pill);
  border: 1px solid var(--border);
}
.segmented button {
  padding: 0.42rem 0.95rem;
  border-radius: var(--r-pill);
  font-size: var(--fs-xs);
  font-weight: 650;
  color: var(--ink-3);
  transition: all var(--t-fast) var(--ease);
}
.segmented button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--sh-xs);
}

/* ---------------- Progress ---------------- */
.progress {
  height: 8px;
  background: var(--surface-3);
  border-radius: var(--r-pill);
  overflow: hidden;
  position: relative;
}
.progress > span {
  display: block;
  height: 100%;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--navy-600), var(--navy-500));
  transition: width 900ms var(--ease-out);
}
.progress.gold > span { background: linear-gradient(90deg, var(--gold-600), var(--gold-400)); }
.progress.jade > span { background: linear-gradient(90deg, var(--jade-700), var(--jade-500)); }
.progress.sm { height: 5px; }
.progress.lg { height: 12px; }
html[dir="rtl"] .progress > span { margin-inline-start: auto; }

.meter-row { display: grid; grid-template-columns: 1fr auto; gap: 4px var(--sp-3); align-items: center; }
.meter-row .lbl { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); }
.meter-row .val { font-size: var(--fs-xs); font-family: var(--font-mono); color: var(--ink-3); }
.meter-row .progress { grid-column: 1 / -1; }

/* ---------------- Alerts ---------------- */
.alert {
  display: flex;
  gap: var(--sp-3);
  padding: var(--sp-4);
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  line-height: var(--lh-normal);
}
.alert .ico { flex: none; font-size: 1.1em; line-height: 1.4; }
.alert-info { background: var(--info-soft); border-color: transparent; color: var(--navy-700); }
[data-theme="dark"] .alert-info { color: var(--brand-strong); }
.alert-warn { background: var(--warn-soft); border-color: transparent; color: #7a5a15; }
[data-theme="dark"] .alert-warn { color: var(--warn); }
.alert-danger { background: var(--danger-soft); border-color: transparent; color: var(--rubric-700); }
[data-theme="dark"] .alert-danger { color: var(--danger); }
.alert-success { background: var(--success-soft); border-color: transparent; color: var(--jade-700); }
[data-theme="dark"] .alert-success { color: var(--jade-300); }

/* Compliance note — used wherever content is demo/unofficial */
.note-compliance {
  display: flex;
  gap: var(--sp-3);
  align-items: flex-start;
  padding: var(--sp-3) var(--sp-4);
  border-inline-start: 3px solid var(--gold-500);
  background: var(--accent-soft);
  border-radius: var(--r-sm);
  font-size: var(--fs-2xs);
  color: var(--accent-ink);
  line-height: 1.5;
}
[data-theme="dark"] .note-compliance { color: var(--gold-300); }

/* ---------------- Table ---------------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); min-width: 560px; }
table.tbl th {
  text-align: start;
  padding: 0.8rem 1rem;
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-3);
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  font-weight: 700;
  white-space: nowrap;
}
table.tbl td { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); color: var(--ink-2); vertical-align: middle; }
table.tbl tbody tr:last-child td { border-bottom: 0; }
table.tbl tbody tr:hover { background: var(--surface-2); }

/* ---------------- Avatar ---------------- */
.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(140deg, var(--navy-600), var(--navy-900));
  color: var(--gold-300);
  font-weight: 700;
  font-size: var(--fs-sm);
  border: 1px solid rgba(231, 205, 147, 0.3);
  flex: none;
  overflow: hidden;
}
.avatar-lg { width: 76px; height: 76px; font-size: var(--fs-2xl); }
.avatar-sm { width: 30px; height: 30px; font-size: var(--fs-2xs); }

/* ---------------- Modal ---------------- */
.modal-root {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  display: grid;
  place-items: center;
  padding: var(--sp-4);
}
.modal-root[hidden] { display: none; }
.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(4, 14, 26, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: fadeIn var(--t-base) var(--ease);
}
.modal {
  position: relative;
  width: min(560px, 100%);
  max-height: min(88vh, 780px);
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-xl);
  padding: var(--sp-7);
  animation: modalIn var(--t-slow) var(--ease-out);
}
.modal-lg { width: min(880px, 100%); }
.modal-close {
  position: absolute;
  inset-block-start: var(--sp-4);
  inset-inline-end: var(--sp-4);
  width: 36px; height: 36px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--ink-3);
  background: var(--surface-3);
  transition: all var(--t-fast) var(--ease);
}
.modal-close:hover { background: var(--danger-soft); color: var(--danger); }
.modal h3 { margin-bottom: var(--sp-2); padding-inline-end: 2.5rem; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to { opacity: 1; transform: none; }
}

/* ---------------- Toast ---------------- */
.toast-wrap {
  position: fixed;
  inset-block-end: calc(var(--sp-5) + env(safe-area-inset-bottom, 0px));
  inset-inline-end: var(--sp-5);
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  pointer-events: none;
  max-width: min(360px, calc(100vw - 2rem));
}
.toast {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0.85rem 1.1rem;
  border-radius: var(--r-md);
  background: var(--navy-850);
  color: var(--ivory);
  box-shadow: var(--sh-lg);
  font-size: var(--fs-sm);
  border: 1px solid var(--border-inverse);
  pointer-events: auto;
  animation: toastIn var(--t-base) var(--ease-spring);
}
.toast.out { animation: toastOut var(--t-base) var(--ease) forwards; }
.toast .ico { font-size: 1.05rem; }
.toast-success { border-inline-start: 3px solid var(--jade-500); }
.toast-error { border-inline-start: 3px solid var(--rubric-500); }
.toast-xp { border-inline-start: 3px solid var(--gold-400); }
@keyframes toastIn { from { opacity: 0; transform: translateY(14px) scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px) scale(0.98); } }

/* ---------------- Skeleton ---------------- */
.skel {
  background: linear-gradient(90deg, var(--surface-3) 25%, var(--surface-2) 37%, var(--surface-3) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  border-radius: var(--r-sm);
  height: 14px;
}
.skel-card { height: 190px; border-radius: var(--r-lg); }
.skel-title { height: 26px; width: 55%; }
.skel-line { height: 12px; }
.skel-line.short { width: 40%; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

/* ---------------- Empty state ---------------- */
.empty {
  text-align: center;
  padding: var(--sp-9) var(--sp-5);
  border: 1px dashed var(--border-strong);
  border-radius: var(--r-lg);
  background: var(--surface-2);
}
.empty .glyph {
  width: 62px; height: 62px;
  margin: 0 auto var(--sp-4);
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 1.6rem;
  font-family: var(--font-arabic);
}
.empty h4 { margin-bottom: var(--sp-2); }
.empty p { color: var(--ink-3); font-size: var(--fs-sm); max-width: 46ch; margin: 0 auto var(--sp-5); }

/* ---------------- Accordion ---------------- */
.acc { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
.acc + .acc { margin-top: var(--sp-3); }
.acc summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5);
  cursor: pointer;
  font-weight: 650;
  font-size: var(--fs-sm);
  list-style: none;
  transition: background var(--t-fast) var(--ease);
}
.acc summary::-webkit-details-marker { display: none; }
.acc summary:hover { background: var(--surface-2); }
.acc summary::after {
  content: "+";
  font-family: var(--font-mono);
  font-size: 1.15rem;
  color: var(--accent);
  transition: transform var(--t-base) var(--ease-spring);
  flex: none;
}
.acc[open] summary::after { transform: rotate(45deg); }
.acc .acc-body { padding: 0 var(--sp-5) var(--sp-5); color: var(--ink-2); font-size: var(--fs-sm); line-height: var(--lh-loose); }

/* ---------------- Tooltip ---------------- */
.tip { position: relative; display: inline-flex; }
.tip::after {
  content: attr(data-tip);
  position: absolute;
  inset-block-end: calc(100% + 8px);
  inset-inline-start: 50%;
  transform: translateX(-50%) translateY(4px);
  background: var(--navy-900);
  color: var(--ivory);
  padding: 0.35rem 0.6rem;
  border-radius: var(--r-xs);
  font-size: var(--fs-3xs);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: all var(--t-fast) var(--ease);
  z-index: 5;
}
.tip:hover::after, .tip:focus-visible::after { opacity: 1; transform: translateX(-50%); }

/* ---------------- Dropdown menu ---------------- */
.menu {
  position: absolute;
  inset-block-start: calc(100% + 10px);
  inset-inline-end: 0;
  min-width: 230px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--sh-lg);
  padding: var(--sp-2);
  z-index: var(--z-header);
  animation: menuIn 180ms var(--ease-out);
}
.menu[hidden] { display: none; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.menu-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: 0.6rem 0.75rem;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  text-align: start;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.menu-item:hover { background: var(--surface-3); color: var(--ink); }
.menu-item.danger:hover { background: var(--danger-soft); color: var(--danger); }
.menu-sep { height: 1px; background: var(--border); margin: var(--sp-2) 0; }
.menu-label { padding: 0.35rem 0.75rem; font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 700; }

/* ---------------- Misc ---------------- */
.kbd {
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  padding: 2px 6px;
  border-radius: 5px;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--ink-3);
  box-shadow: 0 1px 0 var(--border-strong);
}
.divider-or {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  color: var(--ink-3);
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.divider-or::before, .divider-or::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.stat-tile { padding: var(--sp-5); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); }
.stat-tile .k { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); font-weight: 700; }
.stat-tile .v { font-family: var(--font-display); font-size: var(--fs-3xl); line-height: 1.1; margin-top: 6px; }
.stat-tile .d { font-size: var(--fs-2xs); color: var(--ink-3); margin-top: 4px; }

.pagination { display: flex; gap: var(--sp-2); justify-content: center; align-items: center; }
.pagination button {
  min-width: 38px; height: 38px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-2);
  transition: all var(--t-fast) var(--ease);
}
.pagination button:hover:not(:disabled) { border-color: var(--gold-400); }
.pagination button[aria-current="page"] { background: var(--navy-800); color: var(--ivory); border-color: var(--navy-800); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }


/* ===== 04-layout.css ===== */
/* ============================================================
   LAYOUT — header, navigation, drawer, bottom nav, footer
   ============================================================ */

.app-shell { display: flex; flex-direction: column; min-height: 100vh; }
main#main { flex: 1 0 auto; }

/* ---------------- Header ---------------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: var(--z-header);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border-bottom: 1px solid transparent;
  transition: border-color var(--t-base) var(--ease), background-color var(--t-base) var(--ease),
    box-shadow var(--t-base) var(--ease);
}
.site-header.is-scrolled {
  border-bottom-color: var(--border);
  box-shadow: 0 6px 24px -18px rgba(9, 27, 46, 0.5);
  background: color-mix(in srgb, var(--bg) 94%, transparent);
}
.header-inner {
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: var(--sp-4);
}

/* Logo */
.logo { display: inline-flex; align-items: center; gap: var(--sp-3); flex: none; }
.logo-mark {
  width: 42px; height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, var(--navy-700), var(--navy-950));
  border: 1px solid rgba(231, 205, 147, 0.35);
  box-shadow: var(--sh-sm), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  position: relative;
  overflow: hidden;
  flex: none;
}
.logo-mark span {
  font-family: var(--font-arabic);
  font-size: 1.7rem;
  line-height: 1;
  color: var(--gold-300);
  transform: translateY(-1px);
}
.logo-mark::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 9px;
  border: 1px solid rgba(231, 205, 147, 0.18);
}
.logo-text { display: flex; flex-direction: column; line-height: 1.1; }
.logo-text .t1 {
  font-family: var(--font-display);
  font-size: var(--fs-md);
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.logo-text .t2 {
  font-size: var(--fs-3xs);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
}

/* Primary nav */
.nav-primary { display: flex; align-items: center; gap: 2px; margin-inline-start: var(--sp-5); }
.nav-item { position: relative; }
.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 0.55rem 0.8rem;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-2);
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  white-space: nowrap;
}
.nav-link:hover { color: var(--ink); background: var(--surface-3); }
.nav-link.is-active { color: var(--ink); }
.nav-link.is-active::after {
  content: "";
  position: absolute;
  inset-block-end: 2px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  width: 16px; height: 2px;
  background: var(--gold-500);
  border-radius: 2px;
}
.nav-link .caret { font-size: 0.6rem; opacity: 0.6; transition: transform var(--t-fast) var(--ease); }
.nav-item.is-open .nav-link .caret { transform: rotate(180deg); }

/* Mega dropdown */
.mega {
  position: absolute;
  inset-block-start: calc(100% + 8px);
  inset-inline-start: 50%;
  transform: translateX(-50%);
  width: max-content;
  min-width: 300px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--sh-lg);
  padding: var(--sp-4);
  z-index: var(--z-header);
  animation: menuIn 200ms var(--ease-out);
}
.mega[hidden] { display: none; }
.mega-grid { display: grid; gap: 4px; }
.mega-grid.cols-2 { grid-template-columns: repeat(2, minmax(190px, 1fr)); gap: 4px var(--sp-3); }
.mega-link {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0.6rem 0.7rem;
  border-radius: var(--r-sm);
  transition: background var(--t-fast) var(--ease);
}
.mega-link:hover { background: var(--surface-3); }
.mega-link .mt { font-size: var(--fs-sm); font-weight: 650; color: var(--ink); }
.mega-link .ms { font-size: var(--fs-2xs); color: var(--ink-3); }
.mega-foot {
  margin-top: var(--sp-3);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-3);
  font-size: var(--fs-2xs);
  color: var(--ink-3);
}

/* Header actions */
.header-actions { display: flex; align-items: center; gap: var(--sp-2); margin-inline-start: auto; }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: var(--r-sm);
  display: grid;
  place-items: center;
  color: var(--ink-2);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
  position: relative;
  flex: none;
}
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn .dot {
  position: absolute;
  top: 7px; inset-inline-end: 7px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--rubric-500);
  border: 2px solid var(--bg);
}
.lang-switch { position: relative; }
.lang-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 40px;
  padding-inline: 0.75rem;
  border-radius: var(--r-sm);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.05em;
  color: var(--ink-2);
  border: 1px solid var(--border);
  transition: all var(--t-fast) var(--ease);
}
.lang-btn:hover { border-color: var(--gold-400); color: var(--ink); }

.burger { display: none; }

/* XP pill in header */
.xp-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding-inline: 0.7rem;
  border-radius: var(--r-pill);
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: var(--fs-2xs);
  font-weight: 700;
  border: 1px solid rgba(200, 162, 83, 0.3);
}
[data-theme="dark"] .xp-pill { color: var(--gold-300); }

/* ---------------- Mobile drawer ---------------- */
.drawer-root { position: fixed; inset: 0; z-index: var(--z-drawer); }
.drawer-root[hidden] { display: none; }
.drawer-backdrop {
  position: absolute; inset: 0;
  background: rgba(4, 14, 26, 0.5);
  backdrop-filter: blur(4px);
  animation: fadeIn var(--t-base) var(--ease);
}
.drawer {
  position: absolute;
  inset-block: 0;
  inset-inline-end: 0;
  width: min(360px, 88vw);
  background: var(--surface);
  border-inline-start: 1px solid var(--border);
  box-shadow: var(--sh-xl);
  padding: var(--sp-5);
  overflow-y: auto;
  overscroll-behavior: contain;
  animation: drawerIn var(--t-base) var(--ease-out);
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
}
@keyframes drawerIn { from { transform: translateX(100%); } to { transform: none; } }
html[dir="rtl"] .drawer { animation-name: drawerInRtl; }
@keyframes drawerInRtl { from { transform: translateX(-100%); } to { transform: none; } }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.drawer-nav { display: flex; flex-direction: column; gap: 2px; }
.drawer-nav > a,
.drawer-nav > button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  padding: 0.8rem 0.9rem;
  border-radius: var(--r-sm);
  font-size: var(--fs-md);
  font-weight: 600;
  color: var(--ink-2);
  text-align: start;
  width: 100%;
  transition: background var(--t-fast) var(--ease);
}
.drawer-nav > a:hover,
.drawer-nav > button:hover { background: var(--surface-3); color: var(--ink); }
.drawer-sub { display: grid; gap: 2px; padding-inline-start: var(--sp-4); margin-block: 2px; }
.drawer-sub a {
  padding: 0.55rem 0.9rem;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  color: var(--ink-3);
}
.drawer-sub a:hover { background: var(--surface-3); color: var(--ink); }
.drawer-sub[hidden] { display: none; }

/* ---------------- Bottom nav (mobile) ---------------- */
.bottom-nav {
  position: fixed;
  inset-inline: 0;
  inset-block-end: 0;
  z-index: var(--z-sticky);
  display: none;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border-top: 1px solid var(--border);
  padding-block: 6px;
  padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
}
.bottom-nav ul { display: grid; grid-template-columns: repeat(5, 1fr); }
.bottom-nav a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 2px;
  font-size: var(--fs-3xs);
  font-weight: 600;
  color: var(--ink-3);
  transition: color var(--t-fast) var(--ease);
  position: relative;
}
.bottom-nav a .bi { font-size: 1.15rem; line-height: 1; }
.bottom-nav a.is-active { color: var(--ink); }
.bottom-nav a.is-active::before {
  content: "";
  position: absolute;
  top: 0;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  width: 22px; height: 2px;
  border-radius: 2px;
  background: var(--gold-500);
}

/* ---------------- Search overlay ---------------- */
.search-overlay {
  position: fixed;
  inset: 0;
  z-index: var(--z-modal);
  padding: clamp(1rem, 8vh, 6rem) var(--sp-4) var(--sp-4);
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.search-overlay[hidden] { display: none; }
.search-panel {
  position: relative;
  width: min(680px, 100%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  box-shadow: var(--sh-xl);
  overflow: hidden;
  animation: modalIn var(--t-base) var(--ease-out);
  display: flex;
  flex-direction: column;
  max-height: 76vh;
}
.search-panel .search-head { padding: var(--sp-4); border-bottom: 1px solid var(--border); }
.search-panel .search-head .input { min-height: 52px; font-size: var(--fs-md); border: 0; background: transparent; padding-inline-start: 2.4rem; }
.search-panel .search-head .input:focus { box-shadow: none; }
.search-results { overflow-y: auto; padding: var(--sp-3); }
.search-group + .search-group { margin-top: var(--sp-3); }
.search-group-label {
  font-size: var(--fs-3xs);
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-3);
  font-weight: 700;
  padding: var(--sp-2) var(--sp-3);
}
.search-hit {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  padding: 0.65rem 0.75rem;
  border-radius: var(--r-sm);
  text-align: start;
  transition: background var(--t-fast) var(--ease);
}
.search-hit:hover, .search-hit.is-cursor { background: var(--surface-3); }
.search-hit .ht { font-size: var(--fs-sm); font-weight: 600; color: var(--ink); }
.search-hit .hs { font-size: var(--fs-2xs); color: var(--ink-3); }
.search-foot {
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--border);
  display: flex;
  gap: var(--sp-4);
  font-size: var(--fs-3xs);
  color: var(--ink-3);
  flex-wrap: wrap;
}

/* ---------------- Footer ---------------- */
.site-footer {
  margin-top: var(--sp-10);
  background: linear-gradient(180deg, var(--navy-900), var(--navy-950));
  color: var(--ink-inverse-2);
  position: relative;
  overflow: hidden;
}
.site-footer::before {
  content: "";
  position: absolute;
  inset-block-start: 0;
  inset-inline: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold-500), transparent);
  opacity: 0.7;
}
.footer-top {
  display: grid;
  grid-template-columns: 1.35fr repeat(3, 1fr);
  gap: var(--sp-8);
  padding-block: var(--sp-10) var(--sp-8);
}
.footer-brand .logo-text .t1 { color: var(--ivory); }
.footer-brand .logo-text .t2 { color: rgba(244, 241, 233, 0.5); }
.footer-brand p { font-size: var(--fs-sm); line-height: var(--lh-loose); margin-top: var(--sp-4); max-width: 34ch; }
.footer-brand .ar-motto { font-family: var(--font-arabic); color: var(--gold-300); font-size: var(--fs-lg); margin-top: var(--sp-3); direction: rtl; }
.footer-col h5 {
  color: var(--gold-300);
  font-family: var(--font-body);
  font-size: var(--fs-2xs);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: var(--sp-4);
  font-weight: 700;
}
.footer-col a {
  display: block;
  padding-block: 6px;
  font-size: var(--fs-sm);
  color: rgba(244, 241, 233, 0.72);
  transition: color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.footer-col a:hover { color: var(--ivory); transform: translateX(3px); }
html[dir="rtl"] .footer-col a:hover { transform: translateX(-3px); }
.footer-social { display: flex; gap: var(--sp-2); margin-top: var(--sp-5); }
.footer-social a {
  width: 38px; height: 38px;
  border-radius: var(--r-sm);
  display: grid;
  place-items: center;
  border: 1px solid rgba(231, 205, 147, 0.25);
  color: var(--gold-300);
  transition: all var(--t-fast) var(--ease);
}
.footer-social a:hover { background: rgba(231, 205, 147, 0.12); transform: translateY(-2px); }
.footer-bottom {
  border-top: 1px solid rgba(231, 205, 147, 0.15);
  padding-block: var(--sp-5);
  display: flex;
  justify-content: space-between;
  gap: var(--sp-4);
  flex-wrap: wrap;
  font-size: var(--fs-2xs);
  color: rgba(244, 241, 233, 0.55);
}
.footer-bottom .links { display: flex; gap: var(--sp-4); flex-wrap: wrap; }
.footer-bottom a:hover { color: var(--ivory); }

/* ---------------- Sticky mobile CTA ---------------- */
.sticky-cta {
  position: fixed;
  inset-inline: var(--sp-4);
  inset-block-end: calc(var(--bottomnav-h) + var(--sp-3) + env(safe-area-inset-bottom, 0px));
  z-index: var(--z-sticky);
  display: none;
  gap: var(--sp-2);
  padding: var(--sp-2);
  background: var(--glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-pill);
  box-shadow: var(--sh-lg);
  animation: toastIn var(--t-base) var(--ease-spring);
}
.sticky-cta .btn { flex: 1; }

/* ---------------- Page chrome ---------------- */
.page-head {
  padding-block: var(--sp-8) var(--sp-6);
  border-bottom: 1px solid var(--border);
  background:
    radial-gradient(900px 260px at 8% -40%, var(--brand-soft), transparent 70%),
    var(--bg-alt);
}
.page-head h1 { margin-block: var(--sp-3) var(--sp-3); }
.page-head .lead { margin-bottom: var(--sp-2); }
.breadcrumbs { display: flex; gap: var(--sp-2); align-items: center; font-size: var(--fs-2xs); color: var(--ink-3); flex-wrap: wrap; }
.breadcrumbs a:hover { color: var(--ink); text-decoration: underline; }
.breadcrumbs .sep { opacity: 0.5; }

.toolbar {
  display: flex;
  gap: var(--sp-3);
  align-items: center;
  flex-wrap: wrap;
  padding-block: var(--sp-5);
}
.toolbar .search-box { flex: 1 1 260px; }
.filter-row { display: flex; gap: var(--sp-2); flex-wrap: wrap; align-items: center; }


/* ===== 05-pages.css ===== */
/* ============================================================
   PAGES — hero, courses, lesson, tests, results, dashboard,
   library, blog, pricing, certificate, admin
   ============================================================ */

/* ================= HERO ================= */
.hero {
  position: relative;
  overflow: hidden;
  padding-block: clamp(2.5rem, 6vw, 5.5rem) clamp(3rem, 7vw, 6rem);
  background:
    radial-gradient(1100px 520px at 78% 8%, rgba(200, 162, 83, 0.13), transparent 62%),
    radial-gradient(900px 500px at 6% 0%, rgba(36, 90, 148, 0.14), transparent 60%),
    var(--bg-alt);
}
[data-theme="dark"] .hero {
  background:
    radial-gradient(1100px 520px at 78% 8%, rgba(200, 162, 83, 0.1), transparent 62%),
    radial-gradient(900px 500px at 6% 0%, rgba(36, 90, 148, 0.22), transparent 60%),
    var(--bg-alt);
}
.hero-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  gap: clamp(2rem, 4vw, 4rem);
  align-items: center;
}
.hero-copy { max-width: 40rem; }
.hero h1 { margin-block: var(--sp-4) var(--sp-5); }
.hero h1 .accent {
  background: linear-gradient(100deg, var(--gold-600), var(--gold-400) 55%, var(--gold-600));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  font-style: italic;
}
.hero .lead { margin-bottom: var(--sp-6); }
.hero-cta { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
.hero-meta {
  margin-top: var(--sp-7);
  padding-top: var(--sp-5);
  border-top: 1px solid var(--border);
  display: flex;
  gap: var(--sp-6);
  flex-wrap: wrap;
}
.hero-meta div { display: flex; flex-direction: column; gap: 2px; }
.hero-meta .n { font-family: var(--font-display); font-size: var(--fs-xl); color: var(--ink); }
.hero-meta .l { font-size: var(--fs-2xs); color: var(--ink-3); letter-spacing: 0.03em; }

/* --------- 3D scene (pure CSS + canvas, no libraries) --------- */
.hero-scene {
  position: relative;
  height: clamp(360px, 42vw, 520px);
  perspective: 1400px;
  perspective-origin: 55% 42%;
}
.girih {
  position: absolute;
  inset: -6% -4%;
  width: 108%;
  height: 112%;
  opacity: 0.5;
  pointer-events: none;
}
.book3d {
  position: absolute;
  inset-inline-start: 50%;
  inset-block-start: 50%;
  width: min(430px, 78%);
  height: 300px;
  transform-style: preserve-3d;
  transform: translate(-50%, -50%) rotateX(54deg) rotateZ(-32deg);
  animation: bookFloat 9s var(--ease) infinite;
}
html[dir="rtl"] .book3d { transform: translate(50%, -50%) rotateX(54deg) rotateZ(32deg); }
@keyframes bookFloat {
  0%, 100% { transform: translate(-50%, -50%) rotateX(54deg) rotateZ(-32deg) translateZ(0); }
  50% { transform: translate(-50%, -54%) rotateX(50deg) rotateZ(-29deg) translateZ(18px); }
}
.book-half {
  position: absolute;
  inset-block: 0;
  width: 50%;
  background: linear-gradient(160deg, #fffdf7, #f3ead9);
  border: 1px solid rgba(168, 132, 44, 0.4);
  box-shadow: 0 26px 50px -22px rgba(4, 16, 28, 0.55);
  transform-style: preserve-3d;
  padding: 18px 16px;
  overflow: hidden;
}
.book-half.left {
  inset-inline-start: 0;
  border-start-start-radius: 8px;
  border-end-start-radius: 8px;
  transform: rotateY(6deg);
  transform-origin: right center;
}
.book-half.right {
  inset-inline-end: 0;
  border-start-end-radius: 8px;
  border-end-end-radius: 8px;
  transform: rotateY(-6deg);
  transform-origin: left center;
}
.book-half::after {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px solid rgba(168, 132, 44, 0.45);
  border-radius: 3px;
  pointer-events: none;
}
.book-lines { display: flex; flex-direction: column; gap: 11px; margin-top: 34px; padding-inline: 6px; }
.book-lines i {
  display: block;
  height: 5px;
  border-radius: 3px;
  background: linear-gradient(90deg, rgba(13, 33, 55, 0.32), rgba(13, 33, 55, 0.1));
}
.book-lines i:nth-child(2n) { width: 82%; }
.book-lines i:nth-child(3n) { width: 66%; }
.book-headpiece {
  height: 22px;
  border-radius: 4px;
  background:
    repeating-linear-gradient(90deg, var(--gold-500) 0 6px, transparent 6px 12px),
    linear-gradient(90deg, rgba(200, 162, 83, 0.25), rgba(36, 90, 148, 0.2));
  opacity: 0.75;
  margin-inline: 6px;
}
.book-ar {
  position: absolute;
  inset-block-start: 42%;
  inset-inline: 12px;
  text-align: center;
  font-family: var(--font-arabic);
  font-size: 1.5rem;
  color: rgba(13, 33, 55, 0.62);
  direction: rtl;
}
.book-spine {
  position: absolute;
  inset-block: -3px;
  inset-inline-start: calc(50% - 5px);
  width: 10px;
  background: linear-gradient(90deg, #cbb887, #8a6a20, #cbb887);
  transform: translateZ(-2px);
  border-radius: 3px;
}
.book-shadow {
  position: absolute;
  inset-inline-start: 50%;
  inset-block-start: 62%;
  width: min(460px, 82%);
  height: 90px;
  transform: translate(-50%, 0) rotateX(78deg);
  background: radial-gradient(ellipse at center, rgba(4, 16, 28, 0.35), transparent 68%);
  filter: blur(12px);
  pointer-events: none;
}

/* letter tiles orbiting */
.letter-tile {
  position: absolute;
  width: 54px; height: 54px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-family: var(--font-arabic);
  font-size: 2.1rem;
  color: var(--gold-300);
  background: linear-gradient(150deg, rgba(13, 33, 55, 0.94), rgba(4, 16, 28, 0.9));
  border: 1px solid rgba(231, 205, 147, 0.35);
  box-shadow: var(--sh-lg);
  animation: floaty 7s var(--ease) infinite;
}
.lt1 { inset-block-start: 6%; inset-inline-start: 4%; animation-delay: 0s; }
.lt2 { inset-block-start: 24%; inset-inline-end: 2%; animation-delay: 1.4s; }
.lt3 { inset-block-end: 12%; inset-inline-start: 12%; animation-delay: 2.6s; }
@keyframes floaty {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-16px) rotate(3deg); }
}
.floaty { animation: floaty 7s var(--ease) infinite; }

/* floating UI cards */
.float-card {
  position: absolute;
  padding: 0.7rem 0.9rem;
  border-radius: var(--r-md);
  background: var(--glass);
  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--sh-lg);
  min-width: 150px;
  animation: floaty 8s var(--ease) infinite;
}
[data-theme="dark"] .float-card { background: rgba(12, 33, 56, 0.78); border-color: rgba(148, 183, 214, 0.22); }
.float-card .fk { font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 700; }
.float-card .fv { font-family: var(--font-display); font-size: var(--fs-lg); color: var(--ink); line-height: 1.2; }
.fc1 { inset-block-start: 2%; inset-inline-end: 6%; animation-delay: 0.6s; }
.fc2 { inset-block-start: 43%; inset-inline-start: -2%; animation-delay: 1.8s; }
.fc3 { inset-block-end: 2%; inset-inline-end: 10%; animation-delay: 3s; }

/* ================= Trust strip ================= */
.trust-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--sh-sm);
}
.trust-strip > div { background: var(--surface); padding: var(--sp-5); }
.trust-strip .ti { font-size: 1.4rem; margin-bottom: var(--sp-2); color: var(--accent); }
.trust-strip h4 { font-size: var(--fs-md); margin-bottom: 4px; }
.trust-strip p { font-size: var(--fs-2xs); color: var(--ink-3); line-height: 1.5; }

/* ================= Goal cards ================= */
.goal-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
  padding: var(--sp-6);
  border-radius: var(--r-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: transform var(--t-base) var(--ease), box-shadow var(--t-base) var(--ease), border-color var(--t-base) var(--ease);
  min-height: 210px;
  text-align: start;
  width: 100%;
}
.goal-card::before {
  content: "";
  position: absolute;
  inset-block-start: 0;
  inset-inline: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gold-600), var(--gold-300));
  transform: scaleX(0);
  transform-origin: inline-start;
  transition: transform var(--t-slow) var(--ease-out);
}
.goal-card:hover { transform: translateY(-5px); box-shadow: var(--sh-lg); border-color: var(--gold-300); }
.goal-card:hover::before { transform: scaleX(1); }
.goal-card .gicon {
  width: 48px; height: 48px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 1.3rem;
  background: var(--brand-soft);
  color: var(--navy-700);
}
[data-theme="dark"] .goal-card .gicon { color: var(--brand-strong); }
.goal-card h3 { font-size: var(--fs-lg); }
.goal-card p { font-size: var(--fs-sm); color: var(--ink-3); line-height: var(--lh-normal); }
.goal-card .go {
  margin-top: auto;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--accent-ink);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
[data-theme="dark"] .goal-card .go { color: var(--gold-300); }

/* ================= Diagnostic band ================= */
.diag-band {
  position: relative;
  overflow: hidden;
  border-radius: var(--r-xl);
  background: linear-gradient(140deg, var(--navy-800), var(--navy-950) 65%);
  color: var(--ink-inverse);
  padding: clamp(2rem, 4vw, 3.5rem);
  border: 1px solid var(--border-inverse);
  box-shadow: var(--sh-xl);
}
.diag-band::after {
  content: "";
  position: absolute;
  inset-block-start: -40%;
  inset-inline-end: -10%;
  width: 460px; height: 460px;
  background: radial-gradient(circle, rgba(200, 162, 83, 0.22), transparent 62%);
  pointer-events: none;
}
.diag-band h2 { color: var(--ivory); }
.diag-band p { color: var(--ink-inverse-2); }
.diag-inner { position: relative; display: grid; grid-template-columns: 1.15fr 0.85fr; gap: var(--sp-8); align-items: center; }
.diag-steps { display: grid; gap: var(--sp-3); }
.diag-step {
  display: flex;
  gap: var(--sp-3);
  align-items: flex-start;
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md);
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(231, 205, 147, 0.16);
}
.diag-step .num {
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  color: var(--gold-300);
  border: 1px solid rgba(231, 205, 147, 0.4);
  border-radius: 6px;
  padding: 2px 6px;
  flex: none;
}
.diag-step .st { font-size: var(--fs-sm); font-weight: 650; color: var(--ivory); }
.diag-step .sd { font-size: var(--fs-2xs); color: var(--ink-inverse-2); }

/* ================= Shamsa rosette (signature) ================= */
.shamsa { display: block; width: 100%; height: auto; max-width: 420px; margin-inline: auto; }
.shamsa .ring { fill: none; stroke: var(--border-strong); stroke-width: 1; opacity: 0.55; }
.shamsa .spoke { stroke: var(--border-strong); stroke-width: 1; opacity: 0.4; }
.shamsa .petal { fill: none; stroke: var(--gold-400); stroke-width: 1; opacity: 0.5; }
.shamsa .area { fill: rgba(200, 162, 83, 0.22); stroke: var(--gold-600); stroke-width: 2; stroke-linejoin: round; }
[data-theme="dark"] .shamsa .area { fill: rgba(221, 186, 118, 0.2); stroke: var(--gold-400); }
.shamsa .node { fill: var(--gold-600); }
[data-theme="dark"] .shamsa .node { fill: var(--gold-300); }
.shamsa .lbl { font-size: 9px; fill: var(--ink-3); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.shamsa .val { font-size: 9px; fill: var(--ink-2); font-family: var(--font-mono); }
.shamsa-on-dark .lbl { fill: rgba(244, 241, 233, 0.62); }
.shamsa-on-dark .val { fill: rgba(244, 241, 233, 0.85); }
.shamsa-on-dark .ring, .shamsa-on-dark .spoke { stroke: rgba(231, 205, 147, 0.25); }
.shamsa-on-dark .area { fill: rgba(231, 205, 147, 0.18); stroke: var(--gold-300); }
.shamsa-on-dark .node { fill: var(--gold-200); }

/* ================= Charts ================= */
.chart-svg { width: 100%; height: auto; overflow: visible; }
.chart-svg .grid-line { stroke: var(--border); stroke-width: 1; }
.chart-svg .axis-lbl { font-size: 10px; fill: var(--ink-3); }
.chart-svg .bar { fill: var(--navy-600); transition: fill var(--t-fast) var(--ease); }
.chart-svg .bar.alt { fill: var(--gold-500); }
.chart-svg .bar:hover { fill: var(--gold-500); }
.chart-svg .line { fill: none; stroke: var(--navy-600); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.chart-svg .line-area { fill: url(#lineGrad); opacity: 0.5; }
.chart-svg .dot { fill: var(--surface); stroke: var(--navy-600); stroke-width: 2; }
[data-theme="dark"] .chart-svg .line, [data-theme="dark"] .chart-svg .dot { stroke: var(--gold-400); }
[data-theme="dark"] .chart-svg .bar { fill: var(--navy-500); }
.donut-track { fill: none; stroke: var(--surface-3); }
.donut-value { fill: none; stroke: var(--gold-500); stroke-linecap: round; transition: stroke-dasharray 1s var(--ease-out); }

/* ================= Level ladder ================= */
.ladder { display: grid; gap: var(--sp-3); }
.ladder-item {
  display: grid;
  grid-template-columns: 62px 1fr auto;
  gap: var(--sp-4);
  align-items: center;
  padding: var(--sp-4) var(--sp-5);
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all var(--t-base) var(--ease);
  text-align: start;
  width: 100%;
}
.ladder-item:hover { border-color: var(--gold-400); transform: translateX(4px); box-shadow: var(--sh-md); }
html[dir="rtl"] .ladder-item:hover { transform: translateX(-4px); }
.ladder-item .code {
  font-family: var(--font-display);
  font-size: var(--fs-2xl);
  color: var(--accent-ink);
  line-height: 1;
}
[data-theme="dark"] .ladder-item .code { color: var(--gold-300); }
.ladder-item .nm { font-weight: 650; font-size: var(--fs-md); }
.ladder-item .ds { font-size: var(--fs-2xs); color: var(--ink-3); }

/* ================= Course cards ================= */
.course-card {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  padding: var(--sp-5);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  transition: all var(--t-base) var(--ease);
  height: 100%;
}
.course-card:hover { transform: translateY(-4px); box-shadow: var(--sh-lg); border-color: var(--gold-300); }
.course-card .cc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-3); }
.course-card h3 { font-size: var(--fs-lg); }
.course-card .ar-title { font-family: var(--font-arabic); font-size: var(--fs-lg); color: var(--accent-ink); direction: rtl; }
[data-theme="dark"] .course-card .ar-title { color: var(--gold-300); }
.course-card .desc { font-size: var(--fs-sm); color: var(--ink-3); line-height: var(--lh-normal); }
.course-card .facts { display: flex; gap: var(--sp-4); flex-wrap: wrap; font-size: var(--fs-2xs); color: var(--ink-3); }
.course-card .facts b { color: var(--ink-2); font-weight: 650; }
.course-card .skills { display: flex; gap: 5px; flex-wrap: wrap; }
.course-card .cc-foot { margin-top: auto; padding-top: var(--sp-4); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }

/* ================= Curriculum ================= */
.module {
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--surface);
}
.module + .module { margin-top: var(--sp-3); }
.module-head {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4) var(--sp-5);
  cursor: pointer;
  width: 100%;
  text-align: start;
  transition: background var(--t-fast) var(--ease);
}
.module-head:hover { background: var(--surface-2); }
.module-head .midx {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--brand-soft);
  color: var(--navy-700);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 700;
  flex: none;
}
[data-theme="dark"] .module-head .midx { color: var(--brand-strong); }
.module-head .mt { font-weight: 650; font-size: var(--fs-md); }
.module-head .ms { font-size: var(--fs-2xs); color: var(--ink-3); }
.module-body { border-top: 1px solid var(--border); }
.module-body[hidden] { display: none; }
.lesson-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0.7rem var(--sp-5);
  width: 100%;
  text-align: start;
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  transition: background var(--t-fast) var(--ease);
}
.lesson-row:last-child { border-bottom: 0; }
.lesson-row:hover { background: var(--surface-2); color: var(--ink); }
.lesson-row .ldot {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  display: grid;
  place-items: center;
  font-size: 10px;
  color: var(--ink-3);
  flex: none;
}
.lesson-row.done .ldot { background: var(--success); border-color: var(--success); color: #fff; }
.lesson-row.locked { opacity: 0.62; }

/* ================= Lesson view ================= */
.lesson-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--sp-7); align-items: start; }
.lesson-side { position: sticky; top: calc(var(--header-h) + var(--sp-4)); display: grid; gap: var(--sp-4); }
.ar-block {
  background: linear-gradient(160deg, var(--gold-100), var(--surface));
  border: 1px solid rgba(200, 162, 83, 0.28);
  border-radius: var(--r-md);
  padding: var(--sp-6);
  position: relative;
}
[data-theme="dark"] .ar-block { background: linear-gradient(160deg, rgba(200, 162, 83, 0.09), var(--surface-2)); }
.ar-block .ar { font-size: 1.45rem; color: var(--ink); }
.ar-block .translation { margin-top: var(--sp-4); padding-top: var(--sp-4); border-top: 1px dashed var(--border-strong); font-size: var(--fs-sm); color: var(--ink-3); }

.vocab-card {
  display: grid;
  gap: var(--sp-2);
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  transition: all var(--t-base) var(--ease);
}
.vocab-card:hover { border-color: var(--gold-400); box-shadow: var(--sh-md); }
.vocab-card .word { font-family: var(--font-arabic); font-size: 1.7rem; line-height: 1.4; direction: rtl; color: var(--ink); }
.vocab-card .translit { font-size: var(--fs-2xs); color: var(--ink-3); font-family: var(--font-mono); }
.vocab-card .mean { font-size: var(--fs-sm); font-weight: 650; }
.vocab-card .ex { font-family: var(--font-arabic); font-size: var(--fs-md); color: var(--ink-2); direction: rtl; line-height: 1.9; }
.vocab-card .vc-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-1); }

/* Audio player */
.audio-player {
  display: grid;
  gap: var(--sp-3);
  padding: var(--sp-4);
  border-radius: var(--r-md);
  background: linear-gradient(150deg, var(--navy-800), var(--navy-950));
  border: 1px solid var(--border-inverse);
  color: var(--ink-inverse);
}
.audio-player .ap-row { display: flex; align-items: center; gap: var(--sp-3); }
.audio-player .ap-play {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: var(--gold-400);
  color: var(--navy-900);
  display: grid;
  place-items: center;
  font-size: 1rem;
  flex: none;
  transition: transform var(--t-fast) var(--ease-spring);
}
.audio-player .ap-play:hover { transform: scale(1.06); }
.audio-player .ap-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); position: relative; cursor: pointer; }
.audio-player .ap-fill { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--gold-400); border-radius: 3px; width: 0%; }
.audio-player .ap-time { font-family: var(--font-mono); font-size: var(--fs-2xs); color: var(--ink-inverse-2); flex: none; }
.audio-player .ap-ctrls { display: flex; gap: var(--sp-2); align-items: center; flex-wrap: wrap; }
.audio-player .ap-btn {
  padding: 0.3rem 0.6rem;
  border-radius: var(--r-xs);
  border: 1px solid rgba(231, 205, 147, 0.28);
  color: var(--gold-300);
  font-size: var(--fs-3xs);
  font-weight: 700;
  transition: all var(--t-fast) var(--ease);
}
.audio-player .ap-btn:hover, .audio-player .ap-btn[aria-pressed="true"] { background: rgba(231, 205, 147, 0.16); }
.audio-player .ap-note { font-size: var(--fs-3xs); color: var(--ink-inverse-2); }
.wave { display: flex; align-items: flex-end; gap: 2px; height: 26px; }
.wave i { width: 3px; background: rgba(231, 205, 147, 0.55); border-radius: 2px; height: 30%; }
.wave.playing i { animation: waveBeat 900ms var(--ease) infinite; }
.wave i:nth-child(2n) { animation-delay: 120ms; }
.wave i:nth-child(3n) { animation-delay: 240ms; }
.wave i:nth-child(5n) { animation-delay: 360ms; }
@keyframes waveBeat { 0%, 100% { height: 25%; } 50% { height: 100%; } }

/* ================= Test runner ================= */
.test-shell { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--sp-6); align-items: start; }
.test-bar {
  position: sticky;
  top: var(--header-h);
  z-index: var(--z-sticky);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding-block: var(--sp-3);
}
.test-bar .row-between { gap: var(--sp-4); }
.timer {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: var(--fs-lg);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  padding: 0.35rem 0.8rem;
  border-radius: var(--r-sm);
  background: var(--surface-3);
  color: var(--ink);
}
.timer.warn { background: var(--warn-soft); color: var(--warn); animation: pulse 1.6s var(--ease) infinite; }
.timer.danger { background: var(--danger-soft); color: var(--danger); animation: pulse 1s var(--ease) infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }

.q-card { padding: clamp(1.25rem, 3vw, 2.25rem); }
.q-index { font-size: var(--fs-2xs); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.q-text { font-size: var(--fs-lg); line-height: var(--lh-normal); margin-block: var(--sp-3) var(--sp-5); }
.q-text.ar { font-size: 1.55rem; }
.q-audio { margin-bottom: var(--sp-5); }

.opt {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  width: 100%;
  padding: var(--sp-4) var(--sp-5);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  text-align: start;
  font-size: var(--fs-md);
  color: var(--ink-2);
  transition: all var(--t-fast) var(--ease);
  cursor: pointer;
}
.opt + .opt { margin-top: var(--sp-3); }
.opt:hover { border-color: var(--navy-400); background: var(--surface-2); transform: translateX(3px); }
html[dir="rtl"] .opt:hover { transform: translateX(-3px); }
.opt .key {
  width: 30px; height: 30px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--ink-3);
  flex: none;
  transition: all var(--t-fast) var(--ease);
}
.opt .otext { flex: 1; }
.opt.ar-opt .otext { font-family: var(--font-arabic); font-size: 1.3rem; direction: rtl; text-align: start; }
.opt.is-selected { border-color: var(--navy-700); background: var(--brand-soft); color: var(--ink); }
.opt.is-selected .key { background: var(--navy-800); border-color: var(--navy-800); color: var(--ivory); }
.opt.is-correct { border-color: var(--success); background: var(--success-soft); }
.opt.is-correct .key { background: var(--success); border-color: var(--success); color: #fff; }
.opt.is-wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt.is-wrong .key { background: var(--danger); border-color: var(--danger); color: #fff; }
.opt:disabled { cursor: default; transform: none; }

.q-explain {
  margin-top: var(--sp-5);
  padding: var(--sp-4);
  border-radius: var(--r-md);
  background: var(--info-soft);
  border-inline-start: 3px solid var(--info);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  line-height: var(--lh-normal);
  animation: modalIn var(--t-base) var(--ease-out);
}

.q-nav-panel { position: sticky; top: calc(var(--header-h) + 76px); }
.q-palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.q-dot {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: var(--fs-3xs);
  font-weight: 700;
  color: var(--ink-3);
  display: grid;
  place-items: center;
  transition: all var(--t-fast) var(--ease);
  position: relative;
}
.q-dot:hover { border-color: var(--navy-400); }
.q-dot.answered { background: var(--brand-soft); border-color: var(--navy-400); color: var(--navy-700); }
[data-theme="dark"] .q-dot.answered { color: var(--brand-strong); }
.q-dot.flagged::after {
  content: "";
  position: absolute;
  top: -3px; inset-inline-end: -3px;
  width: 9px; height: 9px;
  background: var(--warn);
  border-radius: 50%;
  border: 1.5px solid var(--surface);
}
.q-dot.current { border-color: var(--gold-500); box-shadow: 0 0 0 2px var(--accent-soft); color: var(--ink); }
.legend { display: grid; gap: 6px; font-size: var(--fs-3xs); color: var(--ink-3); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-inline-end: 6px; }

/* Reading split */
.reading-split { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-5); align-items: start; }
.passage {
  padding: var(--sp-6);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  max-height: 68vh;
  overflow-y: auto;
  position: sticky;
  top: calc(var(--header-h) + 84px);
}
.passage .ptitle { font-family: var(--font-arabic); font-size: 1.5rem; text-align: center; margin-bottom: var(--sp-4); color: var(--accent-ink); direction: rtl; }
[data-theme="dark"] .passage .ptitle { color: var(--gold-300); }
.passage .ptext { font-family: var(--font-arabic); font-size: calc(1.22rem * var(--reader-scale, 1)); line-height: 2.15; direction: rtl; text-align: justify; color: var(--ink); }
.reader-tools { display: flex; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-4); padding-bottom: var(--sp-3); border-bottom: 1px solid var(--border); flex-wrap: wrap; }

/* Writing */
.writing-area { position: relative; }
.writing-area .textarea { min-height: 260px; font-size: var(--fs-md); line-height: 1.9; }
.writing-area.ar-input .textarea { font-family: var(--font-arabic); direction: rtl; font-size: 1.25rem; line-height: 2.1; }
.wcount { display: flex; gap: var(--sp-4); font-size: var(--fs-2xs); color: var(--ink-3); margin-top: var(--sp-2); flex-wrap: wrap; }
.wcount b { color: var(--ink-2); }
.rubric { display: grid; gap: var(--sp-3); }
.rubric-item { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-3); align-items: center; padding: var(--sp-3) var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2); font-size: var(--fs-sm); }
.rubric-item .stars { display: flex; gap: 3px; }
.rubric-item .stars button { color: var(--border-strong); font-size: 1.05rem; transition: color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.rubric-item .stars button.on { color: var(--gold-500); }
.rubric-item .stars button:hover { transform: scale(1.18); }

/* Speaking */
.rec-panel { display: grid; gap: var(--sp-4); place-items: center; padding: var(--sp-7); border-radius: var(--r-lg); background: var(--surface-2); border: 1px solid var(--border); text-align: center; }
