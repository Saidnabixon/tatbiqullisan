      (opts.extra || "") + "</div></header>";
  }

  /* ---------------- Scroll reveal ---------------- */
  let observer = null;
  function reveal(root) {
    const nodes = U.$$("[data-reveal]", root || document);
    if (!("IntersectionObserver" in window)) {
      nodes.forEach(n => n.classList.add("is-visible"));
      return;
    }
    if (!observer) {
      observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { rootMargin: "0px 0px -40px 0px", threshold: 0.05 });
    }
    nodes.forEach(n => observer.observe(n));
  }

  /* ---------------- Header scroll state ---------------- */
  function bindScroll() {
    const header = U.$("#siteHeader");
    const onScroll = U.throttle(function () {
      header.classList.toggle("is-scrolled", window.scrollY > 8);
    }, 100);
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  /* ---------------- Global delegated actions ---------------- */
  function bindGlobal() {
    document.addEventListener("click", function (ev) {
      // dropdown toggles
      const dropBtn = ev.target.closest("[data-dropdown] > button");
      if (dropBtn) {
        const item = dropBtn.parentElement;
        const menu = item.querySelector(".mega, .menu");
        const open = item.classList.contains("is-open");
        U.$$("[data-dropdown]").forEach(function (n) {
          n.classList.remove("is-open");
          const m = n.querySelector(".mega, .menu");
          if (m) m.hidden = true;
          const b = n.querySelector("button");
          if (b) b.setAttribute("aria-expanded", "false");
        });
        if (!open && menu) {
          item.classList.add("is-open");
          menu.hidden = false;
          dropBtn.setAttribute("aria-expanded", "true");
        }
        ev.stopPropagation();
        return;
      }

      const act = ev.target.closest("[data-action]");
      if (act) {
        const action = act.dataset.action;
        switch (action) {
          case "theme": toggleTheme(); return;
          case "lang-menu": {
            const menu = U.$("#langMenu");
            if (menu) {
              menu.hidden = !menu.hidden;
              act.setAttribute("aria-expanded", String(!menu.hidden));
            }
            ev.stopPropagation();
            return;
          }
          case "set-lang": setLang(act.dataset.lang); closeDrawer(); return;
          case "search-open": openSearch(); return;
          case "search-close": closeSearch(); return;
          case "drawer-open": openDrawer(); return;
          case "drawer-close": closeDrawer(); return;
          case "drawer-group": {
            const target = U.$("#" + act.dataset.target);
            if (target) target.hidden = !target.hidden;
            return;
          }
          case "modal-close": closeModal(); return;
          case "auth-login": closeDrawer(); openAuth("login"); return;
          case "auth-register": closeDrawer(); openAuth("register"); return;
          case "telegram-auth": toast(t("auth.telegramSoon"), "info"); return;
          case "logout":
            TLA.state.logout();
            closeDrawer();
            closeModal();
            renderShell();
            TLA.router.go("#/");
            toast(t("action.logout"), "info");
            return;
          case "notif": openNotifications(); return;
          case "notif-read": TLA.state.markAllRead(); closeModal(); renderHeader(); return;
          case "speak": {
            const ok = TLA.audio.speakOnce(act.dataset.text || "");
            if (!ok) toast("Bu qurilmada arabcha ovoz mavjud emas.", "info");
            return;
          }
          case "save-word": {
            const word = act.dataset.word;
            if (TLA.state.hasWord(word)) {
              TLA.state.removeWord(word);
              act.classList.remove("is-active");
              act.setAttribute("aria-pressed", "false");
              toast("So‘z ro‘yxatdan olib tashlandi.", "info");
            } else {
              TLA.state.saveWord(word);
              act.classList.add("is-active");
              act.setAttribute("aria-pressed", "true");
              toast(t("lesson.added"), "success");
            }
            return;
          }
          case "bookmark": {
            const on = TLA.state.toggleBookmark(act.dataset.id);
            act.setAttribute("aria-pressed", String(on));
            act.classList.toggle("is-active", on);
            return;
          }
          case "copy": {
            U.copyText(act.dataset.text || "").then(function () { toast(t("action.copied"), "success"); });
            return;
          }
          case "print": window.print(); return;
          case "scroll-top": U.scrollToTop(); return;
        }
      }

      // search result click bookkeeping
      const hit = ev.target.closest("[data-search-go]");
      if (hit) {
        TLA.state.addSearch(hit.dataset.searchGo);
        closeSearch();
        return;
      }

      // close open menus when clicking elsewhere
      U.$$("[data-dropdown].is-open").forEach(function (n) {
        n.classList.remove("is-open");
        const m = n.querySelector(".mega, .menu");
        if (m) m.hidden = true;
      });
      const lang = U.$("#langMenu");
      if (lang && !lang.hidden) lang.hidden = true;
    });

    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") {
        closeSearch();
        closeModal();
        closeDrawer();
      }
      if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") {
        ev.preventDefault();
        openSearch();
      }
    });

    // keep focus inside an open modal
    document.addEventListener("focusin", function (ev) {
      const root = U.$("#modalRoot");
      if (!root || root.hidden) return;
      if (!root.contains(ev.target)) {
        const first = root.querySelector("button, input, select, textarea, a[href]");
        if (first) first.focus();
      }
    });
  }

  return {
    applySettings, toggleTheme, setLang, toast, modal, closeModal, confirmDialog,
    renderShell, renderHeader, renderFooter, renderBottomNav,
    openAuth, openOnboarding, openSearch, closeSearch, openDrawer, closeDrawer,
    levelPill, skillBadges, emptyState, skeletonCards, complianceNote, pageHead,
    reveal, bindGlobal, bindScroll, openNotifications
  };
})();

  /* ---------------- Girih pattern (ambient canvas) ---------------- */
  function drawGirih(canvas) {
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(240, rect.width), h = Math.max(200, rect.height);
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    const stroke = dark ? "rgba(231,205,147,0.20)" : "rgba(26,66,114,0.16)";
    const accent = dark ? "rgba(231,205,147,0.32)" : "rgba(168,132,44,0.28)";
    const cell = 84;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches ||
      document.documentElement.getAttribute("data-motion") === "off";

    function star(cx, cy, r, rotation) {
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = rotation + (Math.PI / 4) * i;
        const rr = i % 2 === 0 ? r : r * 0.56;
        const x = cx + rr * Math.cos(a);
        const y = cy + rr * Math.sin(a);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }

    function frame(offset) {
      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 1;
      for (let y = -cell; y < h + cell; y += cell) {
        for (let x = -cell; x < w + cell; x += cell) {
          const cx = x + (offset % cell), cy = y + (offset * 0.4 % cell);
          ctx.strokeStyle = stroke;
          star(cx, cy, cell * 0.42, 0);
          ctx.strokeStyle = accent;
          ctx.beginPath();
          ctx.arc(cx, cy, cell * 0.17, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = stroke;
          ctx.beginPath();
          ctx.moveTo(cx + cell / 2, cy);
          ctx.lineTo(cx, cy + cell / 2);
          ctx.moveTo(cx - cell / 2, cy);
          ctx.lineTo(cx, cy - cell / 2);
          ctx.stroke();
        }
      }
    }

    if (reduced) { frame(0); return; }
    let start = null;
    let raf = null;
    function loop(ts) {
      if (!start) start = ts;
      const offset = ((ts - start) / 240) % cell;
      frame(offset);
      raf = requestAnimationFrame(loop);
    }
    raf = requestAnimationFrame(loop);
    canvas._stop = function () { if (raf) cancelAnimationFrame(raf); };
  }

  TLA.widgets.mountAudioPlayer = function (id, script, opts) {
    const o = opts || {};
    const root = document.getElementById(id);
    if (!root || !script) return null;
    const fill = root.querySelector('[data-ap="fill"]');
    const time = root.querySelector('[data-ap="time"]');
    const playBtn = root.querySelector('[data-ap="toggle"]');
    const wave = root.querySelector(".wave");
    const track = root.querySelector('[data-ap="track"]');
    const transcriptBody = root.querySelector('[data-ap="transcript-body"]');

    const player = TLA.audio.createPlayer({
      text: script.body,
      seconds: script.seconds,
      maxPlays: o.maxPlays,
      onTick: function (progress, elapsed) {
        fill.style.width = (progress * 100).toFixed(1) + "%";
        time.textContent = U.fmtTime(elapsed);
        track.setAttribute("aria-valuenow", Math.round(progress * 100));
      },
      onState: function (state) {
        playBtn.textContent = state === "playing" ? "❚❚" : "▶";
        wave.classList.toggle("playing", state === "playing");
      },
      onEnd: function () { if (o.onEnd) o.onEnd(); },
      onLimit: function () { TLA.ui.toast(t("test.audioOnce"), "info"); }
    });

    root.addEventListener("click", function (ev) {
      const btn = ev.target.closest("[data-ap]");
      if (!btn) return;
      const kind = btn.dataset.ap;
      if (kind === "toggle") player.toggle();
      else if (kind === "restart") { player.stop(false); player.play(); }
      else if (kind === "rate") {
        root.querySelectorAll('[data-ap="rate"]').forEach(b => b.setAttribute("aria-pressed", "false"));
        btn.setAttribute("aria-pressed", "true");
        player.setRate(Number(btn.dataset.value));
      } else if (kind === "transcript") {
        const open = transcriptBody.hidden;
        transcriptBody.hidden = !open;
        if (open) transcriptBody.textContent = script.body;
        btn.textContent = open ? t("test.hideTranscript") : t("test.showTranscript");
      } else if (kind === "track") {
        const rect = track.getBoundingClientRect();
        const ratio = TLA.i18n.isRTL()
          ? (rect.right - ev.clientX) / rect.width
          : (ev.clientX - rect.left) / rect.width;
        player.seek(ratio);
      }
    });

    return player;
  };

  TLA.widgets.mountSpeaking = function (task) {
    const timerEl = U.$("#spTimer");
    const phaseEl = U.$("#spPhase");
    const recBtn = U.$("#spRec");
    const playBtn = U.$("#spPlay");
    const againBtn = U.$("#spAgain");
    const audioEl = U.$("#spAudio");
    const noteEl = U.$("#spNote");
    if (!recBtn) return;

    let phase = "prep";
    let left = task.prepSeconds;
    let interval = null;
    let recorder = null;
    let chunks = [];

    function paint() { timerEl.textContent = U.fmtTime(left); }

    function startCountdown(seconds, onDone) {
      clearInterval(interval);
      left = seconds;
      paint();
      interval = setInterval(function () {
        left--;
        paint();
        if (left <= 0) { clearInterval(interval); onDone(); }
      }, 1000);
    }

    startCountdown(task.prepSeconds, function () {
      phaseEl.textContent = "Tayyorgarlik tugadi — yozishni boshlashingiz mumkin.";
    });

    function stopRecording() {
      clearInterval(interval);
      phase = "done";
      recBtn.classList.remove("recording");
      recBtn.textContent = "●";
      phaseEl.textContent = "Yozib olindi. Tinglab ko‘ring va ro‘yxat bo‘yicha o‘zingizni tekshiring.";
      againBtn.disabled = false;
      TLA.state.addXp(10, "speaking");
      if (recorder && recorder.state === "recording") recorder.stop();
    }

    recBtn.addEventListener("click", function () {
      if (phase === "recording") { stopRecording(); return; }
      phase = "recording";
      recBtn.classList.add("recording");
      recBtn.textContent = "■";
      phaseEl.textContent = "Yozilmoqda — savolga javob bering.";
      startCountdown(task.speakSeconds, stopRecording);

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          chunks = [];
          recorder = new MediaRecorder(stream);
          recorder.ondataavailable = e => chunks.push(e.data);
          recorder.onstop = function () {
            const blob = new Blob(chunks, { type: "audio/webm" });
            audioEl.src = URL.createObjectURL(blob);
            audioEl.hidden = false;
            playBtn.disabled = false;
            stream.getTracks().forEach(tr => tr.stop());
          };
          recorder.start();
        }).catch(function () {
          noteEl.textContent = "Mikrofonga ruxsat berilmadi — mashq taymer rejimida davom etadi. Javobingizni ovoz chiqarib ayting va ro‘yxat bo‘yicha baholang.";
        });
      } else {
        noteEl.textContent = "Bu muhitda yozib olish qo‘llab-quvvatlanmaydi — mashq taymer rejimida davom etadi.";
      }
    });

    playBtn.addEventListener("click", function () { audioEl.play(); });
    againBtn.addEventListener("click", function () {
      phase = "prep";
      audioEl.hidden = true;
      playBtn.disabled = true;
      againBtn.disabled = true;
      phaseEl.textContent = "Tayyorgarlik bosqichi — fikringizni tuzing.";
      startCountdown(task.prepSeconds, function () {
        phaseEl.textContent = "Tayyorgarlik tugadi — yozishni boshlashingiz mumkin.";
      });
    });
  };

        course.code + " darajasi bo‘yicha to‘liq test</span></span>" +
        '<a class="btn btn-soft btn-sm" href="#/test/darajaviy-' + course.id + '-full">' + t("test.start") + "</a></div></div></div>" +

        '<div class="progress jade lg"><span style="width:' + prog.pct + '%"></span></div>' +

  /* ================= Lesson page ================= */
  const LESSON_TABS = ["lesson", "vocab", "grammar", "reading", "listening", "speaking", "writing", "practice"];

  TLA.pages.lesson = {
    render: function (params) {

      const { course, module, lesson } = found;

      const all = course.modules.reduce((acc, m) => acc.concat(m.lessons), []);

      if (locked) {
        return TLA.ui.pageHead({
          crumbs: [{ label: t("nav.learn"), href: "#/learn" }, { label: course.titleUz, href: "#/learn/" + course.id }, { label: lesson.titleUz }],
          title: lesson.titleUz
        }) + '<section class="section"><div class="container container-narrow">' +
          TLA.ui.emptyState("◍", t("misc.locked"), t("auth.needAuth"),

            t("result.gateCta") + '</button><button class="btn btn-ghost" data-action="auth-login">' + t("action.login") + "</button></div>") +
          "</div></section>";
      }

      const tabs = '<div class="tabs" role="tablist">' +
        LESSON_TABS.map((k, i) => '<button class="tab" role="tab" data-tab="' + k + '" aria-selected="' + (i === 0) + '">' +
          t("lesson.tabs." + (k === "vocab" ? "vocab" : k)) + "</button>").join("") + "</div>";

      return TLA.ui.pageHead({
        crumbs: [
          { label: t("nav.learn"), href: "#/learn" },
          { label: course.titleUz, href: "#/learn/" + course.id },
          { label: module.titleUz }
        ],
        eyebrow: course.code + " · " + t("courses.module") + " " + module.no,
        title: lesson.titleUz,
        extra: '<p class="ar ar-lg" style="margin-top:var(--sp-2);color:var(--accent-ink)">' + lesson.titleAr + "</p>" +
          '<div class="row row-wrap" style="margin-top:var(--sp-4);gap:var(--sp-3)">' +
          '<span class="badge">' + t("misc.skill." + lesson.skill) + "</span>" +
          '<span class="badge badge-outline">' + lesson.minutes + " " + t("test.minutes") + "</span>" +
          (done ? '<span class="badge badge-jade">✓ ' + t("lesson.completed") + "</span>" : "") +
          '<span class="badge badge-demo">' + t("misc.demoContent") + "</span></div>"
      }) +
        '<section class="section"><div class="container"><div class="lesson-layout">' +
        "<div>" + tabs + '<div id="lessonPanels" style="margin-top:var(--sp-6)"></div>' +
        '<div class="row-between row-wrap" style="margin-top:var(--sp-8);gap:var(--sp-3);padding-top:var(--sp-6);border-top:1px solid var(--border)">' +
        (prev ? '<a class="btn btn-ghost" href="#/lesson/' + prev.id + '">← ' + t("action.prev") + "</a>" : "<span></span>") +
        '<div class="row" style="gap:var(--sp-3)">' +
        '<button class="btn ' + (done ? "btn-ghost" : "btn-success") + '" id="lessonDone"' + (done ? " disabled" : "") + ">" +
        (done ? "✓ " + t("lesson.completed") : t("lesson.complete")) + "</button>" +
        (next ? '<a class="btn btn-primary btn-arrow" href="#/lesson/' + next.id + '">' + t("lesson.next") + ' <span class="arw">→</span></a>' : "") +
        "</div></div></div>" +

        '<aside class="lesson-side">' +
        '<div class="card"><div class="row-between" style="margin-bottom:var(--sp-3)"><strong>' + U.esc(module.titleUz) + "</strong>" +
        '<span class="mono" style="font-size:var(--fs-2xs)">' + (idx + 1) + "/" + all.length + "</span></div>" +
        '<div class="progress"><span style="width:' + U.pct(idx + 1, all.length) + '%"></span></div>' +
        '<div class="stack-sm" style="margin-top:var(--sp-4);max-height:280px;overflow:auto">' +
        module.lessons.map(l => '<a class="lesson-row ' + (TLA.state.lessonDone(l.id) ? "done" : "") + '" href="#/lesson/' + l.id +
          '" style="border:0;border-radius:var(--r-sm);' + (l.id === lesson.id ? "background:var(--brand-soft)" : "") + '">' +
          '<span class="ldot">' + (TLA.state.lessonDone(l.id) ? "✓" : l.no) + "</span><span>" + U.esc(l.titleUz) + "</span></a>").join("") +
        "</div></div>" +
        '<div class="card"><h4 style="font-size:var(--fs-md)">' + t("lesson.test") + "</h4>" +
        '<p class="muted" style="font-size:var(--fs-2xs);margin-top:var(--sp-2)">Dars yakunida ' + course.code + ' darajasidagi mashq testini topshiring.</p>' +
        '<a class="btn btn-soft btn-block btn-sm" style="margin-top:var(--sp-3)" href="#/test/darajaviy-' + course.id + "-" + (lesson.skill === "reading" || lesson.skill === "listening" || lesson.skill === "grammar" || lesson.skill === "vocabulary" ? lesson.skill : "placement") + '">' +
        t("test.start") + "</a></div>" +
        "</aside></div></div></section>";
    },

    mounted: function (params) {
      const found = TLA.data.lessonById(params.id);
      if (!found) return;
      const { course, lesson } = found;
      const host = U.$("#lessonPanels");
      if (!host) return;

      const text = TLA.data.texts[lesson.textId];
      const grammar = TLA.data.grammar[lesson.grammarId];
      const script = Object.keys(TLA.data.scripts)
        .map(k => TLA.data.scripts[k])
        .filter(s => s.level === course.level)[0] || TLA.data.scripts.s_a1;
      const words = TLA.data.dictionary.filter(d => d.level === course.level).slice(0, 6);
      const writing = TLA.data.writingTasks.filter(w => w.level === course.level)[0];
      const speaking = TLA.data.speakingTasks.filter(s => s.level === course.level)[0];

      let activePlayer = null;

      function renderPanel(key) {
        if (activePlayer) { activePlayer.destroy(); activePlayer = null; }

        if (key === "lesson") {
          host.innerHTML = '<div class="stack-lg">' +
            '<div class="card"><span class="eyebrow">Dars maqsadi</span>' +
            '<h3 style="margin:var(--sp-3) 0">' + U.esc(lesson.titleUz) + "</h3>" +
            '<p class="muted" style="line-height:1.75">Ushbu darsda «' + U.esc(lesson.titleAr) + "» mavzusi bo‘yicha yangi so‘zlar, grammatik qoida, matn va tinglash mashqi beriladi. " +
            "Dars oxirida mashq savollari orqali o‘zlashtirishni tekshirasiz.</p>" +
            '<div class="grid grid-2" style="gap:var(--sp-3);margin-top:var(--sp-5)">' +
            '<div class="stat-tile"><div class="k">Asosiy ko‘nikma</div><div class="v" style="font-size:var(--fs-lg)">' +
            t("misc.skill." + lesson.skill) + "</div></div>" +
            '<div class="stat-tile"><div class="k">Davomiylik</div><div class="v" style="font-size:var(--fs-lg)">' + lesson.minutes + " min</div></div>" +
            "</div></div>" +
            '<div class="ar-block"><p class="ar ar-lg">' + text.body.split(".")[0] + ".</p>" +
            '<div class="translation">' + U.esc(text.uz.split(".")[0]) + ".</div>" +
            '<button class="btn btn-quiet btn-sm" style="margin-top:var(--sp-3)" data-action="speak" data-text="' +
            U.attr(text.body.split(".")[0]) + '">◉ ' + t("lesson.listen") + "</button></div>" +
            '<div class="alert alert-info"><span class="ico">◈</span><span>Har bir bo‘limni ketma-ket bajaring: leksika → grammatika → o‘qish → tinglash → mashq. Bu tartib eslab qolishni sezilarli oshiradi.</span></div>' +
            "</div>";
        } else if (key === "vocab") {
          host.innerHTML = '<div class="stack-lg"><div class="row-between"><h3>' + t("lesson.tabs.vocab") + "</h3>" +
            '<a class="btn btn-quiet btn-sm" href="#/dictionary">' + t("nav.dictionary") + " →</a></div>" +
            '<div class="grid grid-2">' + words.map(TLA.widgets.vocabCard).join("") + "</div>" +
            '<div class="alert alert-success"><span class="ico">✦</span><span>Saqlangan so‘zlar 1, 3, 7, 15 va 30-kunlarda takrorlashga chiqadi.</span></div></div>';
        } else if (key === "grammar") {
          host.innerHTML = '<div class="card"><span class="eyebrow">' + t("lesson.tabs.grammar") + "</span>" +
            '<h3 style="margin:var(--sp-3) 0">' + U.esc(grammar.titleUz) + "</h3>" +
            '<p class="ar ar-lg">' + grammar.titleAr + "</p>" +
            '<p style="margin-top:var(--sp-4);line-height:1.8;color:var(--ink-2)">' + U.esc(grammar.bodyUz) + "</p>" +
            '<div class="stack" style="margin-top:var(--sp-6)">' +
            grammar.examples.map(e => '<div class="ar-block" style="padding:var(--sp-4)"><p class="ar">' + e.ar + "</p>" +
              '<div class="translation">' + U.esc(e.uz) + "</div>" +
              '<button class="btn btn-quiet btn-sm" style="margin-top:var(--sp-2)" data-action="speak" data-text="' +
              U.attr(e.ar) + '">◉</button></div>').join("") +
            "</div></div>";
        } else if (key === "reading") {
          host.innerHTML = '<div class="passage" style="position:static;max-height:none">' +
            '<div class="reader-tools">' +
            '<span class="muted" style="font-size:var(--fs-2xs)">' + t("test.fontSize") + "</span>" +
            '<button class="chip" data-font="0.9">A−</button><button class="chip" data-font="1.1">A</button><button class="chip" data-font="1.3">A+</button>' +
            '<span class="spacer"></span>' +
            '<button class="chip" id="toggleTr">' + t("lesson.translation") + "</button>" +
            '<button class="btn btn-quiet btn-sm" data-action="speak" data-text="' + U.attr(text.body) + '">◉ ' + t("lesson.listen") + "</button>" +
            "</div>" +
            '<h3 class="ptitle">' + text.titleAr + "</h3>" +
            '<div class="ptext" id="readerText">' + text.body + "</div>" +
            '<div id="readerTr" hidden style="margin-top:var(--sp-5);padding-top:var(--sp-4);border-top:1px dashed var(--border-strong);color:var(--ink-2);line-height:1.8">' +
            U.esc(text.uz) + "</div></div>";
        } else if (key === "listening") {
          host.innerHTML = '<div class="stack-lg"><div class="card">' +
            '<div class="row-between" style="margin-bottom:var(--sp-4)"><h3>' + U.esc(script.titleUz) + "</h3>" +
            '<span class="badge">' + script.titleAr + "</span></div>" +
            TLA.widgets.audioPlayerMarkup("lessonAudio", { allowTranscript: true }) +
            '<p class="muted" style="font-size:var(--fs-2xs);margin-top:var(--sp-4)">Dars rejimida matn ochiq — imtihon rejimida esa tinglash bo‘limi yakunlangunicha yopiq bo‘ladi.</p>' +
            "</div>" +
            '<div class="card"><h4>Tarjima</h4><p class="muted" style="margin-top:var(--sp-3);line-height:1.75">' +
            U.esc(script.uz) + "</p></div></div>";
          activePlayer = TLA.widgets.mountAudioPlayer("lessonAudio", script, { allowTranscript: true });
        } else if (key === "speaking") {
          host.innerHTML = TLA.widgets.speakingMarkup(speaking);
          TLA.widgets.mountSpeaking(speaking);
        } else if (key === "writing") {
          host.innerHTML = TLA.widgets.writingMarkup(writing);
          TLA.widgets.mountWriting(writing);
        } else if (key === "practice") {
          const pool = TLA.data.filterQuestions({ level: course.level }).slice(0, 5);
          host.innerHTML = '<div class="stack-lg"><div class="row-between"><h3>' + t("lesson.tabs.practice") + "</h3>" +
            '<span class="badge">' + pool.length + " " + t("test.questions") + "</span></div>" +
            pool.map(function (q, i) {
              return '<div class="card q-card" data-practice="' + q.id + '">' +
                '<span class="q-index">' + t("test.question") + " " + (i + 1) + "</span>" +
                '<p class="q-text">' + U.esc(q.promptUz) + "</p>" +
                (q.ar ? '<p class="q-text ar">' + q.ar + "</p>" : "") +
                q.opts.map((o, oi) => '<button class="opt' + (q.optsAr ? " ar-opt" : "") + '" data-opt="' + oi + '">' +
                  '<span class="key">' + String.fromCharCode(65 + oi) + '</span><span class="otext">' + (q.optsAr ? o : U.esc(o)) + "</span></button>").join("") +
                '<div class="q-explain" hidden></div></div>';
            }).join("") +
            '<a class="btn btn-primary btn-block" href="#/test/darajaviy-' + course.id + '-placement">' + t("test.start") + "</a></div>";

          U.$$("[data-practice]", host).forEach(function (card) {
            const q = TLA.data.questionById(card.dataset.practice);
            const explain = card.querySelector(".q-explain");
            U.$$(".opt", card).forEach(function (btn) {
              btn.addEventListener("click", function () {
                if (card.dataset.answered) return;
                card.dataset.answered = "1";
                const chosen = Number(btn.dataset.opt);
                U.$$(".opt", card).forEach(function (b, bi) {
                  b.disabled = true;
                  if (bi === q.ans) b.classList.add("is-correct");
                  else if (bi === chosen) b.classList.add("is-wrong");
                });
                explain.hidden = false;
                explain.innerHTML = "<strong>" + (chosen === q.ans ? t("test.correct") : t("test.wrong")) + ".</strong> " + U.esc(q.expUz);
                if (chosen === q.ans) TLA.state.addXp(2, "practice");
              });
            });
          });
        }

        TLA.ui.reveal(host);
      }

      U.$$("[data-tab]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          U.$$("[data-tab]").forEach(b => b.setAttribute("aria-selected", "false"));
          btn.setAttribute("aria-selected", "true");
          renderPanel(btn.dataset.tab);
        });
      });

      host.addEventListener("click", function (ev) {
        const fontBtn = ev.target.closest("[data-font]");
        if (fontBtn) {
          const reader = U.$("#readerText");
          if (reader) reader.style.setProperty("--reader-scale", fontBtn.dataset.font);
          return;
        }
        if (ev.target.id === "toggleTr") {
          const tr = U.$("#readerTr");
          if (tr) tr.hidden = !tr.hidden;
        }
      });

      const doneBtn = U.$("#lessonDone");
      if (doneBtn) {
        doneBtn.addEventListener("click", function () {
          TLA.state.completeLesson(lesson.id, lesson.minutes);
          doneBtn.disabled = true;
          doneBtn.className = "btn btn-ghost";
          doneBtn.textContent = "✓ " + t("lesson.completed");
          TLA.ui.toast(t("misc.xpEarned", { n: 10 }), "xp");
          TLA.ui.renderHeader();
        });
      }

      renderPanel("lesson");
    },

    meta: function (params) {
      const f = TLA.data.lessonById(params.id);
      return f ? { title: f.lesson.titleUz + " — " + f.course.titleUz, desc: f.module.titleUz } : null;
    }
  };
})();

/* ============================================================
   PAGES — Exams hub, exam tracks, test catalogue
   ============================================================ */
window.TLA = window.TLA || {};
TLA.pages = TLA.pages || {};

(function () {
  "use strict";
  const U = TLA.utils;
  const t = (k, v) => TLA.i18n.t(k, v);

  function testStats(testId) {
    const list = TLA.state.attemptsFor(testId);
    if (!list.length) return null;
    const scores = list.map(a => a.score);
    return {
      count: list.length,
      best: Math.max.apply(null, scores),
      last: scores[scores.length - 1]
    };
  }

  function testCard(test, opts) {
    const o = opts || {};
    const stats = testStats(test.id);
    const locked = !test.free && !TLA.state.isAuthed();
    return '<article class="card card-hover" data-reveal>' +
      '<div class="row-between" style="margin-bottom:var(--sp-3)">' +
      '<div class="row" style="gap:var(--sp-2)">' +
      (test.levels.length === 1 ? TLA.ui.levelPill(test.levels[0]) : '<span class="badge">' + test.levels.length + " daraja</span>") +
      (test.kind === "mock" ? '<span class="badge badge-gold">MOCK</span>' : "") +
      "</div>" +
      (test.free ? '<span class="badge badge-free">' + t("misc.free") + "</span>"
        : '<span class="badge badge-gold">' + t("misc.premium") + "</span>") +
      "</div>" +
      "<h3 style='font-size:var(--fs-md)'>" + U.esc(test.titleUz) + "</h3>" +

  /* ================= Exams hub ================= */
  TLA.pages.exams = {
    render: function () {
      return TLA.ui.pageHead({
        crumbs: [{ label: t("nav.home"), href: "#/" }, { label: t("nav.exams") }],

        title: "Imtihonga tayyorgarlik yo‘nalishlari",
        lead: "Har bir yo‘nalish bo‘limlarga ajratilgan: mashq testlari, vaqt cheklovli rejim va to‘liq mock imtihon."
      }) +
        '<section class="section"><div class="container">' +
        '<div class="grid grid-3">' +
        TLA.data.examTracks.map(function (e) {
          const list = TLA.data.testsByTrack(e.id);
          return '<a class="card card-hover card-illum" href="#/exams/' + e.id + '" data-reveal>' +
            '<div class="row-between"><span style="font-size:1.4rem;color:var(--accent)">' + e.icon + "</span>" +
            '<span class="badge">' + list.length + " test</span></div>" +
            '<h3 style="margin-top:var(--sp-4)">' + U.esc(e.uz) + "</h3>" +
            '<p class="ar" style="color:var(--accent-ink);margin-top:4px">' + e.ar + "</p>" +
            '<p class="muted" style="font-size:var(--fs-sm);margin-top:var(--sp-3)">' + U.esc(e.descUz) + "</p></a>";
        }).join("") +
        "</div>" +
        '<div style="margin-top:var(--sp-6)">' + TLA.ui.complianceNote(t("exam.disclaimer")) + "</div>" +
        "</div></section>";
    },
    meta: { title: "Imtihonlar — Multilevel, TANAL Arobiy, Darajaviy", desc: "Arab tili imtihonlariga tayyorgarlik bo‘limlari va mock testlar." }
  };

  /* ================= Exam track ================= */
  TLA.pages.examTrack = {
    render: function (params) {
      const track = params.track;
      const meta = TLA.data.examTracks.filter(e => e.id === track)[0];
      if (!meta) return TLA.pages.notFound.render();
      const tests = TLA.data.testsByTrack(track);

      if (track === "darajaviy") {
        const byLevel = U.groupBy(tests, x => x.levels[0]);
        return TLA.ui.pageHead({
          crumbs: [{ label: t("nav.exams"), href: "#/exams" }, { label: meta.uz }],
          eyebrow: "A1 → C2",
          title: "DARAJAVIY TESTLAR",
          lead: meta.descUz
        }) +
          '<section class="section"><div class="container">' +
          TLA.data.levels.map(function (lv) {
            const list = byLevel[lv.id] || [];

              '<div class="row-between row-wrap" style="margin-bottom:var(--sp-4);gap:var(--sp-3)">' +
              '<div class="row" style="gap:var(--sp-4)">' + TLA.ui.levelPill(lv.code) +
              "<div><strong>" + U.esc(lv.uz) + '</strong><br><span class="muted" style="font-size:var(--fs-2xs)">' +
              U.esc(lv.descUz) + "</span></div></div>" +
              '<span class="badge">' + attemptsAll + " " + t("misc.attempts") + "</span></div>" +
              '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--sp-3)">' +
              list.map(function (x) {
                const s = testStats(x.id);
                return '<a class="res-card" href="#/test/' + x.id + '">' +

                  '<span style="flex:1"><span class="rt">' + U.esc(x.titleUz.replace(lv.code.toUpperCase() + " — ", "")) + "</span>" +
                  '<span class="rs">' + x.count + " " + t("test.questions") + " · " + x.minutes + " " + t("test.minutes") + "</span>" +

              }).join("") +
              "</div></div>";
          }).join("") +
          '<div>' + TLA.ui.complianceNote(t("exam.disclaimer")) + "</div>" +
          "</div></section>";
      }

      const sections = tests.filter(x => !x.isFull);
      const full = tests.filter(x => x.isFull)[0];

      return TLA.ui.pageHead({
        crumbs: [{ label: t("nav.exams"), href: "#/exams" }, { label: meta.uz }],
        eyebrow: t("nav.exams"),
        title: meta.uz.toUpperCase(),
        lead: meta.descUz,
        extra: '<p class="ar ar-lg" style="margin-top:var(--sp-3);color:var(--accent-ink)">' + meta.ar + "</p>"
      }) +
        '<section class="section"><div class="container">' +
        '<div class="grid grid-3">' + sections.map(x => testCard(x, { hideAr: false })).join("") + "</div>" +

        (full
          ? '<div class="diag-band" style="margin-top:var(--sp-8)" data-reveal><div class="diag-inner">' +
            "<div><span class='eyebrow' style='color:var(--gold-300)'>" + t("exam.mock") + "</span>" +
            '<h2 style="margin:var(--sp-4) 0;color:var(--ivory)">' + U.esc(full.titleUz) + "</h2>" +
            "<p>" + U.esc(full.descUz) + "</p>" +
            '<div class="row row-wrap" style="gap:var(--sp-3);margin:var(--sp-5) 0">' +
            '<span class="badge badge-gold">' + full.count + " " + t("test.questions") + "</span>" +
            '<span class="badge badge-gold">' + full.minutes + " " + t("test.minutes") + "</span>" +
            '<span class="badge badge-gold">' + t("exam.timed") + "</span></div>" +
            '<a class="btn btn-gold btn-lg" href="#/test/' + full.id + '">' + t("test.start") + "</a></div>" +
            '<div><div class="card card-glass" style="background:rgba(255,255,255,.06);border-color:rgba(231,205,147,.2)">' +
            "<h4 style='color:var(--ivory)'>" + t("test.rules") + "</h4>" +
            '<ul class="stack-sm" style="margin-top:var(--sp-4);color:var(--ink-inverse-2);font-size:var(--fs-sm)">' +
            [1, 2, 3, 4].map(n => '<li class="row row-top" style="gap:var(--sp-3)"><span style="color:var(--gold-300)">◦</span><span>' +
              t("test.rule" + n) + "</span></li>").join("") +
            "</ul></div></div></div></div>"
          : "") +

        '<div class="grid grid-2" style="margin-top:var(--sp-8)">' +
        '<div class="card" data-reveal><h3>' + t("exam.sections") + "</h3>" +
        '<p class="muted" style="font-size:var(--fs-sm);margin-top:var(--sp-2)">Har bir bo‘lim alohida mashq qilinadi, so‘ng to‘liq imtihon simulyatsiyasida birlashtiriladi.</p>' +
        '<div class="row row-wrap" style="gap:var(--sp-2);margin-top:var(--sp-4)">' +
        sections.map(x => '<a class="chip" href="#/test/' + x.id + '">' + U.esc(x.titleUz.split("— ")[1] || x.titleUz) + "</a>").join("") +
        "</div></div>" +
        '<div class="card" data-reveal><h3>Tayyorgarlik tartibi</h3>' +
        '<div class="timeline" style="margin-top:var(--sp-4)">' +
        [
          { h: "Diagnostika", p: "Boshlang‘ich darajani aniqlang." },
          { h: "Bo‘limlar bo‘yicha mashq", p: "Eng past ball olgan bo‘limdan boshlang." },
          { h: "Vaqt cheklovli rejim", p: "Tezlikni imtihon shartlariga moslashtiring." },
          { h: "To‘liq mock", p: "Har 2 haftada bir marta to‘liq simulyatsiya." }
        ].map(s => '<div class="timeline-item"><strong>' + s.h + '</strong><p class="muted" style="font-size:var(--fs-sm)">' + s.p + "</p></div>").join("") +
        "</div></div></div>" +

        '<div style="margin-top:var(--sp-6)">' + TLA.ui.complianceNote(t("exam.disclaimer")) + "</div>" +
        "</div></section>";
    },
    meta: function (params) {
      const m = TLA.data.examTracks.filter(e => e.id === params.track)[0];
      return m ? { title: m.uz + " tayyorgarlik — Tatbiqul Lisan Academy", desc: m.descUz } : null;
    }
  };

  /* ================= Test catalogue ================= */
  TLA.pages.tests = {
    render: function (params) {
      const skillFilter = params.query.skill || "";
      const kindFilter = params.query.kind || "";
      const levelFilter = params.query.level || "";

      let list = TLA.data.tests.filter(function (x) {
        if (skillFilter && x.skills.indexOf(skillFilter) === -1) return false;
        if (kindFilter && x.kind !== kindFilter) return false;
        if (levelFilter && x.levels.indexOf(levelFilter) === -1) return false;
        return true;
      });

      const chip = (label, key, value) => {
        const active = params.query[key] === value;
        const q = Object.assign({}, params.query);
        if (active) delete q[key]; else q[key] = value;
        const qs = Object.keys(q).filter(k => q[k]).map(k => k + "=" + encodeURIComponent(q[k])).join("&");
        return '<a class="chip' + (active ? " is-active" : "") + '" href="#/tests' + (qs ? "?" + qs : "") + '">' + U.esc(label) + "</a>";
      };

      return TLA.ui.pageHead({
        crumbs: [{ label: t("nav.home"), href: "#/" }, { label: t("nav.mock") }],
        eyebrow: t("nav.mock"),
        title: "Test va mock imtihonlar",
        lead: "Savollar har safar bazadan yangidan yig‘iladi — bir xil testni qayta topshirsangiz ham to‘plam takrorlanmaydi."
      }) +
        '<section class="section"><div class="container">' +
        '<div class="card card-dark" data-reveal style="margin-bottom:var(--sp-6)">' +
        '<div class="row-between row-wrap" style="gap:var(--sp-4)">' +
        '<div><h3 style="color:var(--ivory)">' + t("action.checkLevel") + "</h3>" +
        '<p class="muted" style="margin-top:var(--sp-2);max-width:52ch">' + t("diag.sub") + "</p></div>" +
        '<a class="btn btn-gold" href="#/test/diagnostic">' + t("action.startFree") + "</a></div></div>" +

        '<div class="filter-row" style="margin-bottom:var(--sp-5)">' +
        '<span class="muted" style="font-size:var(--fs-2xs);font-weight:700">' + t("courses.skills") + ":</span>" +
        TLA.data.skills.map(s => chip(t("misc.skill." + s.id), "skill", s.id)).join("") +
        "</div>" +
        '<div class="filter-row" style="margin-bottom:var(--sp-5)">' +
        '<span class="muted" style="font-size:var(--fs-2xs);font-weight:700">' + t("misc.level") + ":</span>" +
        TLA.data.levels.map(l => chip(l.code, "level", l.id)).join("") +
        chip(t("exam.mock"), "kind", "mock") +
        (Object.keys(params.query).length ? '<a class="btn btn-quiet btn-sm" href="#/tests">' + t("action.reset") + "</a>" : "") +
        "</div>" +

        (list.length
          ? '<div class="grid grid-3">' + list.map(x => testCard(x)).join("") + "</div>"
          : TLA.ui.emptyState("◉", t("empty.tests"), t("empty.searchD"),
            '<a class="btn btn-primary" href="#/test/diagnostic">' + t("empty.testsCta") + "</a>")) +
        "</div></section>";
    },
    meta: { title: "Mock testlar va mashqlar — Tatbiqul Lisan Academy", desc: "Arab tili bo‘yicha diagnostika, mashq va mock testlar to‘plami." }
  };

  TLA.pages.testCard = testCard;
})();


/* ===== 15-page-test.js ===== */
/* ============================================================
   PAGE — Test runner
   Intro → running → confirm → result. Supports MCQ, reading
   (passage + questions), listening (audio, transcript locked),
   writing and speaking sections.
   ============================================================ */
window.TLA = window.TLA || {};
TLA.pages = TLA.pages || {};

(function () {
  "use strict";
  const U = TLA.utils;
  const t = (k, v) => TLA.i18n.t(k, v);

  let session = null;
  let ticker = null;
  let player = null;

  function clearSession() {
    if (ticker) { clearInterval(ticker); ticker = null; }
    if (player) { player.destroy(); player = null; }
    TLA.audio.stopAll();
    session = null;
  }

  /* ---------------- Intro ---------------- */
  function introMarkup(test) {
    const stats = TLA.state.attemptsFor(test.id);
    const best = stats.length ? Math.max.apply(null, stats.map(a => a.score)) : null;
    return '<div class="container container-narrow">' +
      '<div class="card card-illum" data-reveal>' +
      '<div class="row-between row-wrap" style="gap:var(--sp-3);margin-bottom:var(--sp-5)">' +
      '<div class="row" style="gap:var(--sp-3)">' +
      (test.levels.length === 1 ? TLA.ui.levelPill(test.levels[0]) : '<span class="badge">' + test.levels.length + " daraja</span>") +
      (test.kind === "mock" ? '<span class="badge badge-gold">MOCK</span>' : "") +
      (test.free ? '<span class="badge badge-free">' + t("misc.free") + "</span>" : '<span class="badge badge-gold">' + t("misc.premium") + "</span>") +
      "</div>" +
      '<span class="badge badge-demo">' + t("misc.demoContent") + "</span></div>" +

      "<h1 style='font-size:var(--fs-3xl)'>" + U.esc(test.titleUz) + "</h1>" +
      '<p class="ar ar-lg" style="color:var(--accent-ink);margin-top:var(--sp-2)">' + test.titleAr + "</p>" +
      '<p class="lead" style="margin-top:var(--sp-4)">' + U.esc(test.descUz) + "</p>" +

      '<div class="grid grid-4" style="gap:var(--sp-3);margin:var(--sp-6) 0">' +
      '<div class="stat-tile"><div class="k">' + t("test.questions") + '</div><div class="v">' + test.count + "</div></div>" +
      '<div class="stat-tile"><div class="k">' + t("test.minutes") + '</div><div class="v">' + test.minutes + "</div></div>" +
      '<div class="stat-tile"><div class="k">' + t("exam.sections") + '</div><div class="v" style="font-size:var(--fs-lg)">' + test.skills.length + "</div></div>" +
      '<div class="stat-tile"><div class="k">' + t("misc.best") + '</div><div class="v">' + (best !== null ? best + "%" : "—") + "</div></div>" +
      "</div>" +

      "<h4>" + t("test.rules") + "</h4>" +
      '<ul class="stack-sm" style="margin-top:var(--sp-3);color:var(--ink-2);font-size:var(--fs-sm)">' +
      [1, 2, 3, 4].map(n => '<li class="row row-top" style="gap:var(--sp-3)"><span style="color:var(--accent)">◦</span><span>' +
        t("test.rule" + n) + "</span></li>").join("") +
      "</ul>" +

      (test.skills.indexOf("listening") !== -1 && TLA.audio.mode() === "demo"
        ? '<div class="alert alert-warn" style="margin-top:var(--sp-5)"><span class="ico">◉</span><span>' +
          "Bu qurilmada arabcha nutq ovozi topilmadi. Tinglash bo‘limi demo rejimda ishlaydi: audio o‘rniga matn ko‘rsatiladi.</span></div>"
        : "") +

      '<div class="row row-wrap" style="margin-top:var(--sp-6);gap:var(--sp-3)">' +
      '<button class="btn btn-primary btn-lg btn-arrow" id="startTest">' + t("test.start") + ' <span class="arw">→</span></button>' +
      '<a class="btn btn-ghost btn-lg" href="#/tests">' + t("action.back") + "</a></div>" +

      (stats.length
        ? '<div style="margin-top:var(--sp-6);padding-top:var(--sp-5);border-top:1px solid var(--border)">' +
          "<h4 style='font-size:var(--fs-md)'>" + t("dash.recent") + "</h4>" +
          '<div class="stack-sm" style="margin-top:var(--sp-3)">' +
          stats.slice(-3).reverse().map(a => '<a class="attempt-row" href="#/result/' + a.id + '">' +
            '<span class="badge ' + (a.score >= 75 ? "badge-jade" : "badge-warn") + '">' + a.score + "%</span>" +
            "<span>" + U.esc(a.titleUz) + "</span>" +
            '<span class="muted" style="font-size:var(--fs-2xs)">' + U.fmtDate(a.at, TLA.i18n.get()) + "</span>" +
            '<span class="arw">→</span></a>').join("") +
          "</div></div>"
        : "") +
      "</div>" +
      TLA.ui.complianceNote(t("exam.disclaimer")) +
      "</div>";
  }

  /* ---------------- Running ---------------- */
  function questionMarkup() {
    const item = session.items[session.index];
    const q = item.q;
    const answered = session.answers[session.index];
    const flagged = session.flags[session.index];

    const options = item.optOrder.map(function (origIdx, pos) {
      const selected = answered === pos;
      return '<button class="opt' + (q.optsAr ? " ar-opt" : "") + (selected ? " is-selected" : "") + '" data-opt="' + pos + '">' +
        '<span class="key">' + String.fromCharCode(65 + pos) + "</span>" +
        '<span class="otext">' + (q.optsAr ? q.opts[origIdx] : U.esc(q.opts[origIdx])) + "</span></button>";
    }).join("");

    const body = '<div class="card q-card">' +
      '<div class="row-between" style="margin-bottom:var(--sp-2)">' +
      '<span class="q-index">' + t("test.question") + " " + (session.index + 1) + " / " + session.items.length +
      " · " + t("misc.skill." + q.skill) + " · " + TLA.ui.levelPill(q.level) + "</span>" +
      '<button class="chip' + (flagged ? " is-active" : "") + '" id="flagBtn" aria-pressed="' + !!flagged + '">⚑ ' +
      (flagged ? t("test.flagged") : t("test.flag")) + "</button></div>" +
      (q.promptUz ? '<p class="q-text">' + U.esc(q.promptUz) + "</p>" : "") +
      (q.ar ? '<p class="q-text ar">' + q.ar + "</p>" : "") +
      options +
      "</div>";

    if (q.skill === "reading" && q.textId) {
      const text = TLA.data.texts[q.textId];
      return '<div class="reading-split">' +
        '<div class="passage"><div class="reader-tools">' +
        '<span class="muted" style="font-size:var(--fs-2xs)">' + t("test.fontSize") + "</span>" +
        '<button class="chip" data-font="0.95">A−</button><button class="chip" data-font="1.15">A</button><button class="chip" data-font="1.35">A+</button>' +
        "</div>" +
        '<h3 class="ptitle">' + text.titleAr + "</h3>" +
        '<div class="ptext" id="passageText">' + text.body + "</div></div>" +
        "<div>" + body + "</div></div>";
    }

    if (q.skill === "listening" && q.scriptId) {
      const script = TLA.data.scripts[q.scriptId];
      const demo = TLA.audio.mode() === "demo";
      return "<div>" +
        '<div class="q-audio card" style="margin-bottom:var(--sp-4)">' +
        '<div class="row-between" style="margin-bottom:var(--sp-3)"><strong>' + U.esc(script.titleUz) + "</strong>" +
        '<span class="badge badge-outline">' + t("test.audioOnce") + "</span></div>" +
        TLA.widgets.audioPlayerMarkup("testAudio", { allowTranscript: false }) +
        (demo
          ? '<div class="alert alert-warn" style="margin-top:var(--sp-3)"><span class="ico">◉</span><span>' +
            "Demo rejim: ovoz mavjud emas, shuning uchun matn ko‘rsatilmoqda.</span></div>" +
            '<p class="ar" style="margin-top:var(--sp-3)">' + script.body + "</p>"
          : '<p class="muted" style="font-size:var(--fs-2xs);margin-top:var(--sp-3)">' + t("test.transcriptHidden") + "</p>") +
        "</div>" + body + "</div>";
    }

    return body;
  }

  function paletteMarkup() {
    return '<div class="card q-nav-panel" data-reveal>' +
      '<div class="row-between" style="margin-bottom:var(--sp-3)"><strong style="font-size:var(--fs-sm)">' +
      t("test.question") + "</strong>" +
      '<span class="mono" style="font-size:var(--fs-2xs)">' +
      session.answers.filter(a => a !== null).length + "/" + session.items.length + "</span></div>" +
      '<div class="q-palette" id="palette">' +
      session.items.map(function (_, i) {
        const cls = [
          session.answers[i] !== null ? "answered" : "",
          session.flags[i] ? "flagged" : "",
          i === session.index ? "current" : ""
        ].join(" ");
        return '<button class="q-dot ' + cls + '" data-goto="' + i + '" aria-label="' + t("test.question") + " " + (i + 1) + '">' + (i + 1) + "</button>";
      }).join("") +
      "</div>" +
      '<div class="legend" style="margin-top:var(--sp-4)">' +
      '<span><i style="background:var(--brand-soft);border:1px solid var(--navy-400)"></i>' + t("test.answered") + "</span>" +
      '<span><i style="background:var(--surface);border:1px solid var(--border)"></i>' + t("test.unanswered") + "</span>" +
      '<span><i style="background:var(--warn)"></i>' + t("test.flagged") + "</span>" +
      "</div>" +
      '<button class="btn btn-primary btn-block" id="finishBtn" style="margin-top:var(--sp-5)">' + t("test.finish") + "</button>" +
      '<button class="btn btn-quiet btn-block" id="exitBtn" style="margin-top:var(--sp-2)">' + t("test.exit") + "</button>" +
      "</div>";
  }

  function runningMarkup() {
    return '<div class="test-bar"><div class="container">' +
      '<div class="row-between">' +
      '<div class="row" style="gap:var(--sp-3);min-width:0">' +
      '<span class="badge badge-navy nowrap">' + U.esc(session.test.titleUz) + "</span>" +
      '<span class="muted nowrap" style="font-size:var(--fs-2xs)">' + (session.index + 1) + " / " + session.items.length + "</span>" +
      "</div>" +
      '<div class="row" style="gap:var(--sp-3)">' +
      '<span class="timer" id="timer">' + U.fmtTime(session.left) + "</span>" +
      "</div></div>" +
      '<div class="progress sm" style="margin-top:var(--sp-2)"><span id="testProgress" style="width:' +
      U.pct(session.index + 1, session.items.length) + '%"></span></div>' +
      "</div></div>" +
      '<div class="container" style="padding-top:var(--sp-6);padding-bottom:var(--sp-9)">' +
      '<div class="test-shell">' +
      '<div id="questionHost">' + questionMarkup() + "</div>" +
      "<div>" + paletteMarkup() + "</div>" +
      "</div>" +
      '<div class="row-between" style="margin-top:var(--sp-6);gap:var(--sp-3)">' +
      '<button class="btn btn-ghost" id="prevBtn"' + (session.index === 0 ? " disabled" : "") + ">← " + t("action.prev") + "</button>" +
      '<button class="btn btn-primary btn-arrow" id="nextBtn">' +
      (session.index === session.items.length - 1 ? t("test.finish") : t("action.next")) + ' <span class="arw">→</span></button>' +
      "</div></div>";
  }

  /* ---------------- Section flows (writing / speaking) ---------------- */
  function specialMarkup(test) {
    const level = test.levels[1] || test.levels[0];
    if (test.section === "writing") {
      const task = TLA.data.writingTasks.filter(w => w.level === level)[0] || TLA.data.writingTasks[2];
      return '<div class="container">' + TLA.widgets.writingMarkup(task) + "</div>";
    }
    const task = TLA.data.speakingTasks.filter(s => s.level === level)[0] || TLA.data.speakingTasks[2];
    return '<div class="container">' + TLA.widgets.speakingMarkup(task) + "</div>";
  }

  /* ---------------- Submit ---------------- */
  function finish(auto) {
    const result = TLA.engine.scoreAttempt(session.items, session.answers);
    const level = TLA.engine.estimateLevel(result);
    const detail = session.items.map(function (item, i) {
      return {
        ref: item.ref,
        given: session.answers[i],
        correctPos: item.correctPos,
        ok: session.answers[i] === item.correctPos,
        optOrder: item.optOrder
      };
    });

    const attempt = TLA.state.recordAttempt({
      testId: session.test.id,
      titleUz: session.test.titleUz,
      kind: session.test.kind,
      track: session.test.track,
      score: result.score,
      correct: result.correct,
      total: result.total,
      skillScores: result.skillScores,
      skillLevels: TLA.engine.skillLevels(session.items, result),
      levelAccuracy: result.levelAccuracy,
      level: level,
      seconds: session.spent,
      auto: !!auto,
      detail: detail
    });

    clearSession();
    TLA.router.go("#/result/" + attempt.id);
  }

  function confirmFinish() {
    const unanswered = session.answers.filter(a => a === null).length;
    TLA.ui.confirmDialog(
      t("test.confirmTitle"),
      t("test.confirmBody", { n: unanswered }),
      t("test.confirmYes"),
      function () { finish(false); }
    );
  }

  /* ---------------- Mount running ---------------- */
  function paintQuestion() {
    const host = U.$("#questionHost");
    if (!host) return;
    if (player) { player.destroy(); player = null; }
    host.innerHTML = questionMarkup();

    const q = session.items[session.index].q;
    if (q.skill === "listening" && q.scriptId && TLA.audio.mode() !== "demo") {
      player = TLA.widgets.mountAudioPlayer("testAudio", TLA.data.scripts[q.scriptId], { maxPlays: 2 });
    }

    U.$$("[data-opt]", host).forEach(function (btn) {
      btn.addEventListener("click", function () {
        const pos = Number(btn.dataset.opt);
        session.answers[session.index] = session.answers[session.index] === pos ? null : pos;
        U.$$("[data-opt]", host).forEach(b => b.classList.remove("is-selected"));
        if (session.answers[session.index] !== null) btn.classList.add("is-selected");
        paintPalette();
      });
    });

    const flagBtn = U.$("#flagBtn");
    if (flagBtn) {
      flagBtn.addEventListener("click", function () {
        session.flags[session.index] = !session.flags[session.index];
        flagBtn.classList.toggle("is-active", session.flags[session.index]);
        flagBtn.setAttribute("aria-pressed", String(!!session.flags[session.index]));
        flagBtn.innerHTML = "⚑ " + (session.flags[session.index] ? t("test.flagged") : t("test.flag"));
        paintPalette();
      });
    }

    U.$$("[data-font]", host).forEach(function (btn) {
      btn.addEventListener("click", function () {
        const p = U.$("#passageText");
        if (p) p.style.setProperty("--reader-scale", btn.dataset.font);
      });
    });

    const prevBtn = U.$("#prevBtn");
    const nextBtn = U.$("#nextBtn");
    if (prevBtn) prevBtn.disabled = session.index === 0;
    if (nextBtn) {
      nextBtn.innerHTML = (session.index === session.items.length - 1 ? t("test.finish") : t("action.next")) +
        ' <span class="arw">→</span>';
    }
    const progress = U.$("#testProgress");
    if (progress) progress.style.width = U.pct(session.index + 1, session.items.length) + "%";
  }

  function paintPalette() {
    const palette = U.$("#palette");
    if (!palette) return;
    U.$$(".q-dot", palette).forEach(function (dot, i) {
      dot.classList.toggle("answered", session.answers[i] !== null);
      dot.classList.toggle("flagged", !!session.flags[i]);
      dot.classList.toggle("current", i === session.index);
    });
    const counter = palette.parentElement.querySelector(".mono");
    if (counter) counter.textContent = session.answers.filter(a => a !== null).length + "/" + session.items.length;
  }

  function goTo(index) {
    session.index = U.clamp(index, 0, session.items.length - 1);
    paintQuestion();
    paintPalette();
    U.scrollToTop();
  }

  function startTicker() {
    clearInterval(ticker);
    ticker = setInterval(function () {
      if (!session) return clearInterval(ticker);
      session.left--;
      session.spent++;
      const el = U.$("#timer");
      if (el) {
        el.textContent = U.fmtTime(session.left);
        el.classList.toggle("warn", session.left <= 120 && session.left > 30);
        el.classList.toggle("danger", session.left <= 30);
      }
      if (session.left <= 0) {
        clearInterval(ticker);
        TLA.ui.toast(t("test.timeUp"), "error");
        finish(true);
      }
    }, 1000);
  }

  function bindRunning() {
    const host = U.$("#pageHost");
    host.addEventListener("click", function (ev) {
      const dot = ev.target.closest("[data-goto]");
      if (dot) return goTo(Number(dot.dataset.goto));
      if (ev.target.closest("#prevBtn")) return goTo(session.index - 1);
      if (ev.target.closest("#nextBtn")) {
        if (session.index === session.items.length - 1) return confirmFinish();
        return goTo(session.index + 1);
      }
      if (ev.target.closest("#finishBtn")) return confirmFinish();
      if (ev.target.closest("#exitBtn")) {
        TLA.ui.confirmDialog(t("test.exit"), t("test.exitConfirm"), t("test.exit"), function () {
          clearSession();
          TLA.router.go("#/tests");
        }, true);
      }
    });

    session.keyHandler = function (ev) {
      if (!session) return;
      if (document.querySelector("#modalRoot:not([hidden])")) return;
      const key = ev.key.toLowerCase();
      if (["1", "2", "3", "4", "a", "b", "c", "d"].indexOf(key) !== -1) {
        const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
        const btn = U.$$("[data-opt]")[map[key]];
        if (btn) btn.click();
      } else if (ev.key === "ArrowRight") goTo(session.index + (TLA.i18n.isRTL() ? -1 : 1));
      else if (ev.key === "ArrowLeft") goTo(session.index + (TLA.i18n.isRTL() ? 1 : -1));
      else if (key === "f") { const f = U.$("#flagBtn"); if (f) f.click(); }
    };
    document.addEventListener("keydown", session.keyHandler);

    if (session.test.kind === "mock") {
      session.visHandler = function () {
        if (document.hidden && session) {
          session.tabSwitches = (session.tabSwitches || 0) + 1;
          TLA.ui.toast(t("test.tabWarning"), "error");
        }
      };
      document.addEventListener("visibilitychange", session.visHandler);
    }
  }

  /* ---------------- Page object ---------------- */
  TLA.pages.test = {
    render: function (params) {
      const test = TLA.data.testById(params.id);
      if (!test) return TLA.pages.notFound.render();
      if (session && session.test.id !== test.id) clearSession();
      if (session && session.running) return runningMarkup();
      if (test.type === "writing" || test.type === "speaking") {
        return TLA.ui.pageHead({
          crumbs: [{ label: t("nav.mock"), href: "#/tests" }, { label: test.titleUz }],
          eyebrow: test.track ? test.track.toUpperCase() : "",
          title: test.titleUz,
          lead: test.descUz
        }) + '<section class="section">' + specialMarkup(test) + "</section>";
      }
      return '<section class="section">' + introMarkup(test) + "</section>";
    },

    mounted: function (params) {
      const test = TLA.data.testById(params.id);
      if (!test) return;

      if (test.type === "writing") {
        const level = test.levels[1] || test.levels[0];
        const task = TLA.data.writingTasks.filter(w => w.level === level)[0] || TLA.data.writingTasks[2];
        TLA.widgets.mountWriting(task);
        return;
      }
      if (test.type === "speaking") {
        const level = test.levels[1] || test.levels[0];
        const task = TLA.data.speakingTasks.filter(s => s.level === level)[0] || TLA.data.speakingTasks[2];
        TLA.widgets.mountSpeaking(task);
        return;
      }

      if (session && session.running) {
        bindRunning();
        paintQuestion();
        paintPalette();
        startTicker();
        return;
      }

      const startBtn = U.$("#startTest");
      if (!startBtn) return;
      startBtn.addEventListener("click", function () {
        const items = test.id === "diagnostic"
          ? TLA.engine.buildDiagnostic("d-" + Date.now())
          : TLA.engine.buildTest(test, test.id + "-" + Date.now());

        if (!items.length) {
          TLA.ui.toast("Bu test uchun savollar topilmadi.", "error");
          return;
        }
        session = {
          test: test,
          items: items,
          answers: new Array(items.length).fill(null),
          flags: new Array(items.length).fill(false),
          index: 0,
          left: test.minutes * 60,
          spent: 0,
          running: true
        };
        TLA.state.track("test_started", { test: test.id });
        TLA.router.rerender();
      });
    },

    unmount: function () {
      if (session && session.keyHandler) document.removeEventListener("keydown", session.keyHandler);
      if (session && session.visHandler) document.removeEventListener("visibilitychange", session.visHandler);
      if (session && !session.running) clearSession();
      if (player) { player.destroy(); player = null; }
      TLA.audio.stopAll();
    },

    isRunning: function () { return !!(session && session.running); },

    meta: function (params) {
      const test = TLA.data.testById(params.id);
      return test ? { title: test.titleUz + " — Tatbiqul Lisan Academy", desc: test.descUz } : null;
    }
  };
})();


/* ===== 16-page-result.js ===== */
/* ============================================================
   PAGE — Test result
   Full analytics for signed-in users; a partial result plus a
   registration gate for guests (value first, sign-up second).
   ============================================================ */
window.TLA = window.TLA || {};
TLA.pages = TLA.pages || {};

(function () {
  "use strict";
  const U = TLA.utils;
  const t = (k, v) => TLA.i18n.t(k, v);

  function skillRows(attempt) {
    return Object.keys(attempt.skillScores).map(function (s) {
      const value = attempt.skillScores[s];
      const lvl = (attempt.skillLevels || {})[s];
      const tone = value >= 80 ? "jade" : value >= 60 ? "" : "gold";
      return '<div class="skill-row">' +
        '<span class="sn">' + t("misc.skill." + s) + "</span>" +
        '<span class="progress ' + tone + '"><span style="width:' + value + '%"></span></span>' +
        '<span class="sv">' + value + "%" + (lvl ? " · " + lvl.toUpperCase() : "") + "</span></div>";
    }).join("");
  }

  function reviewMarkup(attempt) {
    return attempt.detail.map(function (d, i) {
      const q = TLA.data.questionById(d.ref);
      if (!q) return "";
      const options = (d.optOrder || q.opts.map((_, oi) => oi)).map(function (origIdx, pos) {
        const isCorrect = pos === d.correctPos;
        const isGiven = pos === d.given;
        const cls = isCorrect ? " is-correct" : (isGiven ? " is-wrong" : "");
        return '<div class="opt' + (q.optsAr ? " ar-opt" : "") + cls + '" style="cursor:default">' +
          '<span class="key">' + String.fromCharCode(65 + pos) + "</span>" +
          '<span class="otext">' + (q.optsAr ? q.opts[origIdx] : U.esc(q.opts[origIdx])) + "</span>" +
          (isGiven ? '<span class="badge badge-outline">' + t("test.yourAnswer") + "</span>" : "") +
          "</div>";
      }).join("");

      return '<details class="acc"><summary>' +
        '<span class="row" style="gap:var(--sp-3);min-width:0">' +
        '<span class="badge ' + (d.ok ? "badge-jade" : "badge-red") + '">' + (i + 1) + "</span>" +
        '<span style="overflow:hidden;text-overflow:ellipsis">' + U.esc(q.promptUz || q.ar) + "</span></span>" +
        "</summary>" +
        '<div class="acc-body">' +
        (q.ar ? '<p class="ar ar-lg" style="margin-bottom:var(--sp-3)">' + q.ar + "</p>" : "") +
        options +
        '<div class="q-explain" style="margin-top:var(--sp-4)"><strong>' + t("test.explanation") + ":</strong> " +
        U.esc(q.expUz) + "</div></div></details>";
    }).join("");
  }

  TLA.pages.result = {
    render: function (params) {
      const attempt = TLA.state.attemptById(params.id);
      if (!attempt) {
        return TLA.ui.pageHead({ title: t("error.notFound"), lead: t("error.notFoundD") }) +
          '<section class="section"><div class="container container-narrow">' +
          TLA.ui.emptyState("◔", t("empty.tests"), t("empty.searchD"),
            '<a class="btn btn-primary" href="#/tests">' + t("nav.tests") + "</a>") + "</div></section>";
      }

      const authed = TLA.state.isAuthed();
      const gated = !authed;
      const series = Object.keys(attempt.skillScores).map(s => ({
        label: t("misc.skill." + s), value: attempt.skillScores[s]
      }));
      const sg = TLA.engine.strengthsAndGaps(attempt.skillScores);
      const recs = TLA.engine.recommend({ skillScores: attempt.skillScores, level: attempt.level });
      const plan = TLA.engine.planSentence(attempt.skillScores, attempt.level);

      const hero = '<div class="score-hero" data-reveal>' +
        '<div class="score-ring">' + TLA.charts.donut(attempt.score, { size: 168 }) +
        '<div class="val"><span>' + attempt.score + "%</span></div></div>" +
        "<div>" +
        '<span class="eyebrow" style="color:var(--gold-300)">' + U.esc(attempt.titleUz) + "</span>" +
        '<h1 style="color:var(--ivory);margin:var(--sp-3) 0">' + t("result.title") + "</h1>" +
        '<div class="row row-wrap" style="gap:var(--sp-5);align-items:center">' +
        '<div class="level-badge"><span class="lv">' + String(attempt.level).toUpperCase() + "</span>" +
        '<span class="lb">' + t("result.estimated") + "</span></div>" +
        '<div class="stack-sm">' +
        '<div><span class="muted" style="font-size:var(--fs-2xs)">' + t("result.correctCount") + '</span><br><strong style="color:var(--ivory);font-size:var(--fs-lg)">' +
        attempt.correct + " / " + attempt.total + "</strong></div>" +
        '<div><span class="muted" style="font-size:var(--fs-2xs)">' + t("result.timeSpent") + '</span><br><strong style="color:var(--ivory);font-size:var(--fs-lg)">' +
        U.fmtTime(attempt.seconds) + "</strong></div>" +
        "</div>" +
        '<div class="stack-sm">' +
        '<div><span class="muted" style="font-size:var(--fs-2xs)">' + t("dash.xp") + '</span><br><strong style="color:var(--gold-300);font-size:var(--fs-lg)">+' +
        attempt.xp + " XP</strong></div>" +
        '<div><span class="muted" style="font-size:var(--fs-2xs)">' + t("misc.date") + '</span><br><strong style="color:var(--ivory);font-size:var(--fs-sm)">' +
        U.fmtDate(attempt.at, TLA.i18n.get()) + "</strong></div>" +
        "</div></div>" +
        (attempt.auto ? '<p class="muted" style="margin-top:var(--sp-4);font-size:var(--fs-2xs)">' + t("test.timeUp") + "</p>" : "") +
        "</div></div>";

      const analysis = '<div class="grid grid-2" style="margin-top:var(--sp-6)">' +
        '<div class="card" data-reveal><h3>' + t("result.breakdown") + "</h3>" +
        '<div style="margin:var(--sp-5) 0">' + TLA.charts.shamsa(series, { aria: t("result.breakdown") }) + "</div>" +
        skillRows(attempt) + "</div>" +
        '<div class="stack-lg">' +
        '<div class="card" data-reveal><h3>' + t("result.strengths") + "</h3>" +
        '<div class="stack-sm" style="margin-top:var(--sp-4)">' +
        (sg.strengths.length
          ? sg.strengths.map(s => '<div class="row" style="gap:var(--sp-3)"><span style="color:var(--success)">✓</span>' +
            "<span>" + t("misc.skill." + s.skill) + ' — <b>' + s.score + "%</b></span></div>").join("")
          : '<p class="muted" style="font-size:var(--fs-sm)">Barcha ko‘nikmalar bo‘yicha ball 70% dan past — asosiy e’tiborni takrorlashga qarating.</p>') +
        "</div>" +
        '<div class="rule-gold" style="margin:var(--sp-5) 0"></div>' +
        "<h3>" + t("result.improve") + "</h3>" +
        '<div class="stack-sm" style="margin-top:var(--sp-4)">' +
        (sg.gaps.length
          ? sg.gaps.map(s => '<div class="row" style="gap:var(--sp-3)"><span style="color:var(--warn)">⚠</span>' +
            "<span>" + t("misc.skill." + s.skill) + " — <b>" + s.score + "%</b></span></div>").join("")
          : '<p class="muted" style="font-size:var(--fs-sm)">Barcha ko‘nikmalar 75% dan yuqori — keyingi darajaga o‘tishingiz mumkin.</p>') +
        "</div></div>" +
        '<div class="card card-dark" data-reveal><h3 style="color:var(--ivory)">Tavsiya etilgan yo‘l</h3>' +
        '<p class="muted" style="margin-top:var(--sp-3);line-height:1.7">' + U.esc(plan) + "</p></div>" +
        "</div></div>";

      const recommendations = '<div class="card" style="margin-top:var(--sp-6)" data-reveal>' +
        '<div class="row-between" style="margin-bottom:var(--sp-4)"><h3>' + t("result.recommended") + "</h3>" +
        '<a class="btn btn-quiet btn-sm" href="#/dashboard">' + t("nav.dashboard") + " →</a></div>" +
        '<div class="rec-list">' +
        recs.map(r => '<a class="rec-item" href="' + r.href + '">' +
          '<span style="flex:1"><strong style="font-size:var(--fs-sm)">' + U.esc(r.titleUz) + "</strong><br>" +
          '<span class="muted" style="font-size:var(--fs-2xs)">' + U.esc(r.metaUz) + "</span></span>" +
          '<span class="arw">→</span></a>').join("") +
        "</div>" +
        '<div class="row row-wrap" style="margin-top:var(--sp-5);gap:var(--sp-3)">' +
        '<a class="btn btn-primary btn-arrow" href="' + (recs[0] ? recs[0].href : "#/learn") + '">' +
        t("result.startPractice") + ' <span class="arw">→</span></a>' +
        '<a class="btn btn-ghost" href="#/test/' + attempt.testId + '">' + t("result.again") + "</a>" +
        "</div></div>";

      const review = '<div class="card" style="margin-top:var(--sp-6)" data-reveal>' +
        '<div class="row-between" style="margin-bottom:var(--sp-4)"><h3>' + t("test.review") + "</h3>" +
        '<span class="badge">' + attempt.correct + "/" + attempt.total + "</span></div>" +
        reviewMarkup(attempt) + "</div>";

      const gate = '<div class="gate-overlay"><div class="card gate-card card-illum">' +
        '<span class="eyebrow">' + t("result.gateTitle") + "</span>" +
        '<h3 style="margin:var(--sp-3) 0">' + t("result.gateTitle") + "</h3>" +
        '<p class="muted" style="font-size:var(--fs-sm)">' + t("result.gateBody") + "</p>" +
        '<div class="stack-sm" style="margin-top:var(--sp-5)">' +
        '<button class="btn btn-primary btn-block btn-lg" data-action="auth-register">' + t("result.gateCta") + "</button>" +
        '<button class="btn btn-ghost btn-block" data-action="auth-login">' + t("action.login") + "</button>" +
        "</div>" +
        '<p class="muted" style="font-size:var(--fs-3xs);margin-top:var(--sp-4)">' + t("auth.demoNote") + "</p>" +
        "</div></div>";

      return '<section class="section"><div class="container">' +
        hero +
        (gated
          ? '<div class="gate-blur" style="margin-top:var(--sp-6)">' +
            '<div class="locked-layer">' + analysis + recommendations + "</div>" + gate + "</div>"
          : analysis + recommendations + review) +
        '<div style="margin-top:var(--sp-6)">' +
        TLA.ui.complianceNote(t("diag.note")) + "</div>" +
        "</div></section>";
    },

    mounted: function () {
      const p = TLA.state.profile();
      if (TLA.state.isAuthed() && p.level) TLA.ui.renderHeader();
    },

    meta: { title: "Test natijasi — Tatbiqul Lisan Academy", desc: "Ko‘nikmalar bo‘yicha batafsil natija va shaxsiy tavsiyalar." }
  };
})();


/* ===== 17-page-dash.js ===== */
/* ============================================================
   PAGES — Dashboard, progress, certificates, verify, profile,
   leaderboard
   ============================================================ */
window.TLA = window.TLA || {};
TLA.pages = TLA.pages || {};

(function () {
  "use strict";
  const U = TLA.utils;
  const t = (k, v) => TLA.i18n.t(k, v);

  function requireAuth(title) {
    return TLA.ui.pageHead({ title: title }) +
      '<section class="section"><div class="container container-narrow">' +
      TLA.ui.emptyState("◍", t("auth.needAuth"), t("result.gateBody"),
        '<div class="row" style="justify-content:center;gap:var(--sp-3)">' +
        '<button class="btn btn-primary" data-action="auth-register">' + t("result.gateCta") + "</button>" +
        '<button class="btn btn-ghost" data-action="auth-login">' + t("action.login") + "</button></div>") +
      "</div></section>";
  }

  /* ================= Dashboard ================= */
  TLA.pages.dashboard = {
    render: function () {
      if (!TLA.state.isAuthed()) return requireAuth(t("nav.dashboard"));

  /* ================= Certificates ================= */
  /** Eight-fold girih rosette used as the certificate colophon. */
  function rosetteSvg() {
    const cx = 60, cy = 60;
    function ring(r, rotation, cls) {
      let d = "";
      for (let i = 0; i < 8; i++) {
        const a = rotation + (Math.PI / 4) * i;
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);
        d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
      }
      return '<path class="' + cls + '" d="' + d + ' Z"/>';
    }
    return '<svg class="c-rosette" viewBox="0 0 120 120" aria-hidden="true">' +
      ring(56, 0, "p1") + ring(56, Math.PI / 8, "p1") +
      ring(34, Math.PI / 8, "p2") + ring(34, 0, "p2") +
      '<circle cx="60" cy="60" r="13" class="p2"/></svg>';
  }

      '<div class="c-body">' + rosetteSvg() +

        const email = U.$("#pfEmail").value.trim();
        if (name.length < 2) return TLA.ui.toast(t("auth.errName"), "error");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return TLA.ui.toast(t("auth.errEmail"), "error");

        TLA.ui.toast(t("action.save"), "success");

        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "tatbiqul-lisan-data.json";
        a.click();
        URL.revokeObjectURL(a.href);
        TLA.ui.toast(t("profile.dataExport"), "success");
      });

      U.$("#pfDelete").addEventListener("click", function () {
        TLA.ui.confirmDialog(t("profile.dataDelete"), t("profile.deleteConfirm"), t("action.delete"), function () {
          TLA.state.deleteAccount();

        }, true);
      });

    meta: { title: "Profil — Tatbiqul Lisan Academy", desc: "Profil sozlamalari, maxfiylik va bildirishnomalar." }
  };

  /* ================= Leaderboard ================= */
  TLA.pages.leaderboard = {
    render: function () {
      const me = TLA.state.currentUser();
      const st = TLA.state.settings();
      const rows = TLA.state.allUsers()
        .map(function (u) {
          const prof = TLA.state.profileOf(u.id);
          return { id: u.id, name: u.name, xp: prof.xp || 0, tests: (prof.attempts || []).length };
        })
        .filter(r => r.xp > 0)
        .sort((a, b) => b.xp - a.xp)
        .slice(0, 20);

      return TLA.ui.pageHead({
        crumbs: [{ label: t("nav.home"), href: "#/" }, { label: t("nav.leaderboard") }],
        eyebrow: t("nav.leaderboard"),
        title: "Haftalik reyting",
        lead: "Reyting faqat ro‘yxatdan o‘tgan va ochiq ko‘rinishga rozilik bergan foydalanuvchilardan tuziladi. Soxta ishtirokchilar ko‘rsatilmaydi."
      }) +
        '<section class="section"><div class="container container-narrow">' +
        (me && !st.publicRank
          ? '<div class="alert alert-warn" style="margin-bottom:var(--sp-5)"><span class="ico">◔</span><span>' +
            "Siz reytingda ko‘rinmayapsiz. Profil → Maxfiylik bo‘limidan yoqishingiz mumkin.</span></div>"
          : "") +
        (rows.length
          ? rows.map(function (r, i) {
            const isMe = me && r.id === me.id;
            const hidden = isMe && !st.publicRank;
            return '<div class="leaderboard-row ' + (i < 3 ? "top " : "") + (isMe ? "me" : "") + '">' +
              '<span class="rank">' + (i + 1) + "</span>" +
              '<span class="row" style="gap:var(--sp-3);min-width:0"><span class="avatar avatar-sm">' +
              U.esc(U.initials(hidden ? "—" : r.name)) + "</span>" +
              "<span>" + U.esc(hidden ? "Yashirilgan" : r.name) + (isMe ? " (siz)" : "") + "</span></span>" +
              '<span class="badge badge-gold">✦ ' + U.fmtNumber(r.xp) + "</span>" +
              '<span class="muted" style="font-size:var(--fs-2xs)">' + r.tests + " test</span></div>";
          }).join("")
          : TLA.ui.emptyState("♛", "Reyting hali bo‘sh", "Birinchi testni topshiring va XP to‘plang — ismingiz shu yerda paydo bo‘ladi.",
            '<a class="btn btn-primary" href="#/test/diagnostic">' + t("empty.testsCta") + "</a>")) +
        TLA.ui.complianceNote("Reytingda faqat ism va XP ko‘rsatiladi. Email, natijalar tafsiloti va boshqa shaxsiy ma’lumotlar hech qachon ochilmaydi.") +
        "</div></section>";
    },
    meta: { title: "Reyting — Tatbiqul Lisan Academy", desc: "Haftalik XP reytingi (ixtiyoriy ishtirok)." }
