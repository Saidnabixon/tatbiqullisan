/* ===== 05b-api.js ===== */
/* ============================================================
   API — thin client for the optional backend (backend/server.py).

   Design goal: the rest of the app (06-state.js) should be able to
   "try the backend, fall back to local-only" without caring about
   fetch/token plumbing. This module draws one important distinction:

     - a NETWORK failure (backend not running, DNS/CORS error, timeout)
       REJECTS the returned promise — callers catch this and fall back
       to the local-only demo behaviour, so the static site keeps
       working standalone exactly as it did before a backend existed.

     - an API-level failure (wrong password, duplicate email — the
       backend IS reachable and answered) RESOLVES normally with
       {ok:false, error, message} — callers must NOT fall back to
       local logic for this case, since that would silently create a
       confusing local ghost account instead of reporting the real
       validation error.
   ============================================================ */
window.TLA = window.TLA || {};

TLA.api = (function () {
  "use strict";

  const TOKEN_KEY = "tla_auth_token";
  const TIMEOUT_MS = 8000;
  let memoryToken = null; // fallback if localStorage is unavailable (e.g. private mode)

  function base() {
    const cfg = window.TLA_SITE_CONFIG || {};
    return (cfg.apiBase || "").replace(/\/$/, ""); // "" = same origin, relative paths
  }

  function getToken() {
    try {
      return localStorage.getItem(TOKEN_KEY) || memoryToken;
    } catch (e) {
      return memoryToken;
    }
  }

  function setToken(token) {
    memoryToken = token;
    try {
      if (token) localStorage.setItem(TOKEN_KEY, token);
      else localStorage.removeItem(TOKEN_KEY);
    } catch (e) { /* private browsing or storage disabled — memory still holds it for this tab */ }
  }

  function clearToken() { setToken(null); }

  /**
   * Low-level request helper.
   * Throws (rejects) only on network-level failure — callers rely on
   * this to decide whether the backend is reachable at all.
   */
  async function request(method, path, body, useAuth, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs || TIMEOUT_MS);
    const headers = { "Content-Type": "application/json" };
    if (useAuth) {
      const token = getToken();
      if (token) headers.Authorization = "Bearer " + token;
    }

    let res;
    try {
      res = await fetch(base() + path, {
        method: method,
        headers: headers,
        body: body ? JSON.stringify(body) : undefined,
        signal: controller.signal
      });
    } finally {
      clearTimeout(timer);
    }

    let data = {};
    try { data = await res.json(); } catch (e) { /* empty/non-JSON body */ }

    if (!res.ok) {
      return { ok: false, status: res.status, error: data.error || "unknown", message: data.message || "" };
    }
    return Object.assign({ ok: true, status: res.status }, data);
  }

  /** True once we've confirmed the backend answered at least once. Lets the
   *  UI avoid repeating the "running in local-only mode" notice every call. */
  let backendConfirmedUnreachable = false;

  async function health() {
    try {
      const r = await request("GET", "/api/health", null, false);
      backendConfirmedUnreachable = !r.ok;
      return r.ok;
    } catch (e) {
      backendConfirmedUnreachable = true;
      return false;
    }
  }

  async function register(name, email, password) {
    return request("POST", "/api/auth/register", { name: name, email: email, password: password }, false);
  }

  async function login(email, password) {
    return request("POST", "/api/auth/login", { email: email, password: password }, false);
  }

  async function logout() {
    try {
      return await request("POST", "/api/auth/logout", null, true);
    } catch (e) {
      return { ok: false }; // best-effort — local session is cleared regardless by the caller
    }
  }

  /** Shorter timeout than register/login: this runs unattended at boot
   *  (session restore), so a slow/hung backend should fail fast rather
   *  than delaying first paint for a returning visitor. */
  async function me() {
    return request("GET", "/api/auth/me", null, true, 3500);
  }

  return {
    getToken, setToken, clearToken, health, register, login, logout, me,
    get wasUnreachable() { return backendConfirmedUnreachable; }
  };
})();


/* ===== 06-state.js ===== */
/* ============================================================
   STATE — application state, auth, progress, gamification
   Every mutation goes through here, then persists via TLA.store.
   Replacing the bodies with API calls is enough to move to a
   real backend; the UI never touches storage directly.
   ============================================================ */
window.TLA = window.TLA || {};

TLA.state = (function () {
  "use strict";
  const U = TLA.utils;

  let data = null;
  const listeners = [];

  /* ---------- demo-only password digest ----------
     Real deployments hash server-side with bcrypt/argon2 and never
     send or keep the plain password. This exists so the prototype
     never stores a readable password, not as real security.        */
  function digest(text) {
    let h1 = 0x811c9dc5, h2 = 0x1000193;
    const salted = "tla$" + text;
    for (let i = 0; i < salted.length; i++) {
      const c = salted.charCodeAt(i);
      h1 = ((h1 ^ c) * 16777619) >>> 0;
      h2 = ((h2 + c * 31) ^ (h2 << 5)) >>> 0;
    }
    return h1.toString(36) + "-" + h2.toString(36);
  }

  function blankProfile() {
    return {
      level: null,
      targetLevel: "b2",
      goal: "exam",
      dailyMinutes: 30,
      examDate: "",
      plan: "free",
      xp: 0,
      streak: 0,
      bestStreak: 0,
      lastActiveDay: null,
      activeDays: [],
      lessons: {},          // lessonId -> { done:true, at }
      attempts: [],         // test attempts (newest last)
      skills: {},           // skillId -> rolling score 0..100
      vocab: {},            // arabic word -> { added, box, due }
      bookmarks: [],
      certificates: [],
      achievements: [],
      payments: [],
      tasks: {},            // dateKey -> { vocab:true, ... }
      studyMinutes: 0,
      onboarded: false
    };
  }

  function defaults() {
    return {
      v: 1,
      settings: {
        theme: "light",
        lang: "uz",
        motion: "on",
        fontScale: 1,
        publicRank: true,
        analytics: true,
        notif: { lessons: true, tests: true, streak: true, marketing: false }
      },
      session: { userId: null },
      users: [],
      profiles: {},
      guest: blankProfile(),
      config: JSON.parse(JSON.stringify(TLA.data.defaultConfig)),
      configVersion: TLA.data.configVersion || 0,
      plans: JSON.parse(JSON.stringify(TLA.data.defaultPlans)),
      admin: { extraQuestions: [], teachers: [], notices: [], certCounter: 0 },
      notifications: [],
      analytics: [],
      recentSearches: []
    };
  }

  function migrate(loaded) {
    const base = defaults();
    if (!loaded || typeof loaded !== "object") return base;
    const out = Object.assign(base, loaded);
    out.settings = Object.assign(base.settings, loaded.settings || {});
    out.settings.notif = Object.assign(base.settings.notif, (loaded.settings || {}).notif || {});
    // A newer site.config.json wins over whatever an admin saved locally,
    // so redeploying with updated contacts actually reaches returning visitors.
    const savedVersion = loaded.configVersion || 0;
    const fileVersion = TLA.data.configVersion || 0;
    out.config = fileVersion > savedVersion
      ? JSON.parse(JSON.stringify(TLA.data.defaultConfig))
      : Object.assign(base.config, loaded.config || {});
    out.configVersion = Math.max(savedVersion, fileVersion);
    out.admin = Object.assign(base.admin, loaded.admin || {});
    out.guest = Object.assign(blankProfile(), loaded.guest || {});
    out.profiles = loaded.profiles || {};
    Object.keys(out.profiles).forEach(function (k) {
      out.profiles[k] = Object.assign(blankProfile(), out.profiles[k]);
    });
    if (!Array.isArray(out.plans) || !out.plans.length) out.plans = base.plans;
    return out;
  }

  function persist() {
    TLA.store.save(data);
    listeners.forEach(fn => { try { fn(data); } catch (e) { /* ignore */ } });
  }

  async function init() {
    const loaded = await TLA.store.load();
    data = migrate(loaded);
    return data;
  }

  function onChange(fn) { listeners.push(fn); }

  /* ---------------- Session ---------------- */
  function currentUser() {
    if (!data.session.userId) return null;
    return data.users.filter(u => u.id === data.session.userId)[0] || null;
  }
  function isAuthed() { return !!currentUser(); }
  function isAdmin() {
    const u = currentUser();
    return !!u && (u.role === "admin" || u.role === "superadmin");
  }

  /** Active profile: the signed-in user's, or the guest sandbox. */
  function profile() {
    const u = currentUser();
    if (!u) return data.guest;
    if (!data.profiles[u.id]) data.profiles[u.id] = blankProfile();
    return data.profiles[u.id];
  }

  /** Mirrors a backend user record into local state so the rest of the
   *  app (admin panel's user list, profile page, leaderboard) keeps
   *  working against `data.users`/`data.profiles` unchanged — this is a
   *  read-through cache of identity, not a second source of truth for
   *  passwords (backend-mirrored users have no local `pass` digest, so
   *  `loginLocal` can never match them — see registerLocal/loginLocal
   *  fallback notes below). */
  function mirrorBackendUser(bu) {
    let existing = data.users.filter(u => u.id === bu.id)[0];
    if (!existing) {
      existing = { id: bu.id, name: bu.name, email: bu.email, role: bu.role, createdAt: new Date().toISOString(), backend: true };
      data.users.push(existing);
    } else {
      existing.name = bu.name;
      existing.email = bu.email;
      existing.role = bu.role;
    }
    if (!data.profiles[bu.id]) data.profiles[bu.id] = blankProfile();
    return existing;
  }

  /** Local-only account creation — the original (pre-backend) behaviour.
   *  Used automatically when no backend is reachable, so the static site
   *  keeps working standalone exactly as before a backend existed. The
   *  first local account still auto-becomes admin, since without a
   *  backend there is no other way to reach the admin panel. */
  function registerLocal(name, email, password, role) {
    const mail = String(email).trim().toLowerCase();
    if (data.users.some(u => u.email === mail)) {
      return { ok: false, error: "exists" };
    }
    const isFirst = data.users.length === 0;
    const user = {
      id: U.uid("u"),
      name: String(name).trim(),
      email: mail,
      pass: digest(password),
      role: role || (isFirst ? "admin" : "student"),
      createdAt: new Date().toISOString()
    };
    data.users.push(user);
    data.profiles[user.id] = Object.assign(blankProfile(), JSON.parse(JSON.stringify(data.guest)));
    data.guest = blankProfile();
    data.session.userId = user.id;
    track("registration", { role: user.role });
    notify("system", "Hisob yaratildi", "Xush kelibsiz! Shaxsiy o‘quv rejangiz tayyor.");
    touchStreak();
    persist();
    return { ok: true, user: user };
  }

  function loginLocal(email, password) {
    const mail = String(email).trim().toLowerCase();
    const user = data.users.filter(u => u.email === mail && u.pass === digest(password))[0];
    if (!user) return { ok: false, error: "creds" };
    data.session.userId = user.id;
    track("login", {});
    touchStreak();
    persist();
    return { ok: true, user: user };
  }

  /** Tries the backend first; falls back to local-only ONLY on a network
   *  failure (backend unreachable), never on a validation failure (e.g.
   *  duplicate email) — see 05b-api.js header comment for why that
   *  distinction matters. Callers now receive a Promise. */
  async function register(name, email, password, role) {
    let result;
    try {
      result = await TLA.api.register(name, email, password);
    } catch (networkErr) {
      return registerLocal(name, email, password, role);
    }
    if (!result.ok) return { ok: false, error: result.error };

    const user = mirrorBackendUser(result.user);
    TLA.api.setToken(result.token);
    data.profiles[user.id] = Object.assign(blankProfile(), JSON.parse(JSON.stringify(data.guest)));
    data.guest = blankProfile();
    data.session.userId = user.id;
    track("registration", { role: user.role, backend: true });
    notify("system", "Hisob yaratildi", "Xush kelibsiz! Shaxsiy o‘quv rejangiz tayyor.");
    touchStreak();
    persist();
    return { ok: true, user: user };
  }

  async function login(email, password) {
    let result;
    try {
      result = await TLA.api.login(email, password);
    } catch (networkErr) {
      return loginLocal(email, password);
    }
    if (!result.ok) return { ok: false, error: result.error };

    const user = mirrorBackendUser(result.user);
    TLA.api.setToken(result.token);
    data.session.userId = user.id;
    track("login", { backend: true });
    touchStreak();
    persist();
    return { ok: true, user: user };
  }

  /** Called once at boot (20-router.js) so a page reload with a valid
   *  saved token comes back signed in instead of flashing "guest".
   *  Silent no-op when there's no token, the token is invalid/expired,
   *  or the backend is unreachable right now (the token is kept in that
   *  last case, so it can still work once the backend is back up). */
  async function restoreSession() {
    const token = TLA.api.getToken();
    if (!token) return;
    let result;
    try {
      result = await TLA.api.me();
    } catch (networkErr) {
      return;
    }
    if (!result.ok) { TLA.api.clearToken(); return; }
    const user = mirrorBackendUser(result.user);
    data.session.userId = user.id;
    persist();
  }

  /** Synchronous on purpose (no caller currently awaits logout): local
   *  session clears immediately so the UI updates right away, while the
   *  backend token invalidation happens best-effort in the background. */
  function logout() {
    const token = TLA.api.getToken();
    data.session.userId = null;
    TLA.api.clearToken();
    persist();
    if (token) TLA.api.logout().catch(function () { /* best effort */ });
  }

  function updateUser(patch) {
    const u = currentUser();
    if (!u) return;
    Object.assign(u, patch);
    persist();
  }

  /** Local-only for now: this backend increment has no DELETE /api/users
   *  endpoint yet, so a backend-mirrored account still exists server-side
   *  after this call — only its local mirror and session are removed.
   *  Clearing the token is essential: without it, restoreSession() would
   *  silently re-fetch and re-mirror the same "deleted" account on the
   *  next page load. */
  function deleteAccount() {
    const u = currentUser();
    if (!u) return;
    delete data.profiles[u.id];
    data.users = data.users.filter(x => x.id !== u.id);
    data.session.userId = null;
    TLA.api.clearToken();
    persist();
  }

  /* ---------------- Settings ---------------- */
  function settings() { return data.settings; }
  function setSetting(key, value) {
    data.settings[key] = value;
    persist();
  }
  function setNotifPref(key, value) {
    data.settings.notif[key] = value;
    persist();
  }

  /* ---------------- Streak & XP ---------------- */
  function touchStreak() {
    const p = profile();
    const today = U.todayKey();
    if (p.lastActiveDay === today) return;
    if (p.lastActiveDay) {
      const gap = U.daysBetween(p.lastActiveDay, today);
      p.streak = gap === 1 ? p.streak + 1 : 1;
    } else {
      p.streak = 1;
    }
    p.lastActiveDay = today;
    p.bestStreak = Math.max(p.bestStreak || 0, p.streak);
    if (p.activeDays.indexOf(today) === -1) p.activeDays.push(today);
    if (p.activeDays.length > 400) p.activeDays = p.activeDays.slice(-400);
    checkAchievements();
    persist();
  }

  function addXp(amount, reason) {
    const p = profile();
    p.xp = (p.xp || 0) + amount;
    track("xp", { amount: amount, reason: reason || "" });
    persist();
    return p.xp;
  }

  function xpToday() {
    const p = profile();
    const today = U.todayKey();
    return (p.attempts || [])
      .filter(a => (a.at || "").slice(0, 10) === today)
      .reduce((sum, a) => sum + (a.xp || 0), 0);
  }

  /* ---------------- Lessons ---------------- */
  function completeLesson(lessonId, minutes) {
    const p = profile();
    if (!p.lessons[lessonId]) {
      p.lessons[lessonId] = { done: true, at: new Date().toISOString() };
      p.studyMinutes = (p.studyMinutes || 0) + (minutes || 20);
      addXp(10, "lesson");
      track("lesson_completed", { lesson: lessonId });
    }
    touchStreak();
    checkAchievements();
    persist();
  }

  function lessonDone(lessonId) {
    return !!(profile().lessons[lessonId] && profile().lessons[lessonId].done);
  }

  function courseProgress(courseId) {
    const course = TLA.data.courseById(courseId);
    if (!course) return { done: 0, total: 0, pct: 0 };
    let done = 0, total = 0;
    course.modules.forEach(m => m.lessons.forEach(l => {
      total++;
      if (lessonDone(l.id)) done++;
    }));
    return { done: done, total: total, pct: U.pct(done, total) };
  }

  /* ---------------- Attempts ---------------- */
  function recordAttempt(attempt) {
    const p = profile();
    attempt.id = attempt.id || U.uid("at");
    attempt.at = new Date().toISOString();
    p.attempts.push(attempt);
    if (p.attempts.length > 200) p.attempts = p.attempts.slice(-200);

    // rolling per-skill score: newest result weighted 40%
    Object.keys(attempt.skillScores || {}).forEach(function (skill) {
      const fresh = attempt.skillScores[skill];
      p.skills[skill] = p.skills[skill] == null ? fresh : Math.round(p.skills[skill] * 0.6 + fresh * 0.4);
    });

    if (attempt.level) p.level = attempt.level;
    p.studyMinutes = (p.studyMinutes || 0) + Math.round((attempt.seconds || 0) / 60);

    let xp = 20;
    if (attempt.score >= 90) xp += 30;
    else if (attempt.score >= 75) xp += 10;
    attempt.xp = xp;
    addXp(xp, "test");

    track("test_completed", { test: attempt.testId, score: attempt.score });
    touchStreak();
    checkAchievements();
    maybeIssueCertificate(attempt);
    persist();
    return attempt;
  }

  function attempts() { return profile().attempts.slice().reverse(); }
  function attemptById(id) { return profile().attempts.filter(a => a.id === id)[0] || null; }
  function attemptsFor(testId) { return profile().attempts.filter(a => a.testId === testId); }

  function stats() {
    const p = profile();
    const list = p.attempts || [];
    const scores = list.map(a => a.score);
    return {
      xp: p.xp || 0,
      streak: p.streak || 0,
      level: p.level,
      tests: list.length,
      avg: scores.length ? Math.round(U.average(scores)) : 0,
      lessons: Object.keys(p.lessons || {}).length,
      hours: Math.round((p.studyMinutes || 0) / 60),
      minutes: p.studyMinutes || 0
    };
  }

  /* ---------------- Vocabulary (spaced repetition) ---------------- */
  const BOX_DAYS = [1, 3, 7, 15, 30];

  function saveWord(word) {
    const p = profile();
    if (p.vocab[word]) return false;
    p.vocab[word] = { added: U.todayKey(), box: 0, due: U.todayKey() };
    track("word_saved", {});
    persist();
    return true;
  }
  function removeWord(word) {
    const p = profile();
    delete p.vocab[word];
    persist();
  }
  function hasWord(word) { return !!profile().vocab[word]; }

  function reviewWord(word, remembered) {
    const p = profile();
    const item = p.vocab[word];
    if (!item) return;
    item.box = remembered ? Math.min(BOX_DAYS.length - 1, item.box + 1) : 0;
    const days = BOX_DAYS[item.box];
    const next = new Date();
    next.setDate(next.getDate() + days);
    item.due = U.todayKey(next);
    persist();
  }

  function dueWords() {
    const p = profile();
    const today = U.todayKey();
    return Object.keys(p.vocab).filter(w => p.vocab[w].due <= today);
  }

  /* ---------------- Bookmarks ---------------- */
  function toggleBookmark(id) {
    const p = profile();
    const i = p.bookmarks.indexOf(id);
    if (i === -1) p.bookmarks.push(id); else p.bookmarks.splice(i, 1);
    persist();
    return p.bookmarks.indexOf(id) !== -1;
  }
  function isBookmarked(id) { return profile().bookmarks.indexOf(id) !== -1; }

  /* ---------------- Achievements ---------------- */
  function checkAchievements() {
    const p = profile();
    const s = stats();
    const questionsAnswered = (p.attempts || []).reduce((n, a) => n + (a.total || 0), 0);
    const gained = [];

    TLA.data.achievements.forEach(function (a) {
      if (p.achievements.indexOf(a.id) !== -1) return;
      const c = a.cond;
      let ok = false;
      if (c.lessons) ok = s.lessons >= c.lessons;
      else if (c.attempts) ok = s.tests >= c.attempts;
      else if (c.streak) ok = s.streak >= c.streak;
      else if (c.questions) ok = questionsAnswered >= c.questions;
      else if (c.skill) ok = (p.skills[c.skill] || 0) >= c.score;
      else if (c.mockScore) ok = (p.attempts || []).some(x => x.kind === "mock" && x.score >= c.mockScore);
      else if (c.courseDone) ok = TLA.data.courses.some(cc => courseProgress(cc.id).pct === 100);
      if (ok) { p.achievements.push(a.id); gained.push(a); }
    });

    gained.forEach(function (a) {
      notify("achievement", "Yangi yutuq: " + a.uz, "Tabriklaymiz! Yutuq profilingizga qo‘shildi.");
      if (TLA.ui && TLA.ui.toast) TLA.ui.toast(a.uz, "xp");
    });
    return gained;
  }

  function hasAchievement(id) { return profile().achievements.indexOf(id) !== -1; }

  /* ---------------- Certificates ---------------- */
  function nextCertId() {
    data.admin.certCounter = (data.admin.certCounter || 0) + 1;
    const prefix = (data.config.certificatePrefix || "TLA");
    const year = new Date().getFullYear();
    return prefix + "-" + year + "-" + String(data.admin.certCounter).padStart(4, "0");
  }

  function issueCertificate(payload) {
    const p = profile();
    const u = currentUser();
    const cert = {
      id: nextCertId(),
      name: u ? u.name : "Mehmon",
      titleUz: payload.titleUz,
      level: payload.level || "",
      score: payload.score || null,
      issued: new Date().toISOString(),
      kind: payload.kind || "course"
    };
    p.certificates.push(cert);
    track("certificate_earned", { kind: cert.kind });
    notify("certificate", "Sertifikat berildi", cert.titleUz + " — " + cert.id);
    persist();
    return cert;
  }

  function maybeIssueCertificate(attempt) {
    if (!isAuthed()) return;
    const p = profile();
    if (attempt.kind === "mock" && attempt.score >= 80) {
      const already = p.certificates.some(c => c.kind === "mock" && c.titleUz === attempt.titleUz);
      if (!already) issueCertificate({ titleUz: attempt.titleUz, level: attempt.level, score: attempt.score, kind: "mock" });
    }
    TLA.data.courses.forEach(function (c) {
      if (courseProgress(c.id).pct === 100) {
        const already = p.certificates.some(x => x.kind === "course" && x.titleUz === c.titleUz);
        if (!already) issueCertificate({ titleUz: c.titleUz, level: c.code, kind: "course" });
      }
    });
  }

  function findCertificate(id) {
    const wanted = String(id).trim().toUpperCase();
    let found = null;
    Object.keys(data.profiles).forEach(function (uid) {
      (data.profiles[uid].certificates || []).forEach(function (c) {
        if (c.id.toUpperCase() === wanted) found = c;
      });
    });
    (data.guest.certificates || []).forEach(function (c) {
      if (c.id.toUpperCase() === wanted) found = c;
    });
    return found;
  }

  /* ---------------- Daily tasks ---------------- */
  function taskState() {
    const p = profile();
    const today = U.todayKey();
    if (!p.tasks[today]) p.tasks[today] = {};
    // keep only the last 30 days
    const keys = Object.keys(p.tasks).sort();
    if (keys.length > 30) keys.slice(0, keys.length - 30).forEach(k => delete p.tasks[k]);
    return p.tasks[today];
  }
  function completeTask(key) {
    const t = taskState();
    if (t[key]) return false;
    t[key] = true;
    addXp(5, "task");
    touchStreak();
    persist();
    return true;
  }

  /* ---------------- Plans & payments ---------------- */
  function plans() { return data.plans; }
  function setPlanPrice(planId, price) {
    const plan = data.plans.filter(p => p.id === planId)[0];
    if (plan) { plan.price = Math.max(0, Number(price) || 0); persist(); }
  }
  function currentPlan() { return profile().plan || "free"; }

  function recordPayment(planId, method) {
    const p = profile();
    const plan = data.plans.filter(x => x.id === planId)[0];
    const pay = {
      id: U.uid("pay"),
      planId: planId,
      planName: plan ? plan.uz : planId,
      amount: plan ? plan.price : 0,
      method: method,
      status: "paid",
      at: new Date().toISOString(),
      demo: true
    };
    p.payments.push(pay);
    p.plan = planId;
    track("purchase_completed", { plan: planId, method: method });
    notify("payment", "To‘lov qabul qilindi (demo)", (plan ? plan.uz : planId) + " tarifi faollashtirildi.");
    persist();
    return pay;
  }

  function allPayments() {
    const out = [];
    Object.keys(data.profiles).forEach(function (uid) {
      const user = data.users.filter(u => u.id === uid)[0];
      (data.profiles[uid].payments || []).forEach(function (p) {
        out.push(Object.assign({ user: user ? user.name : "—" }, p));
      });
    });
    return out.sort((a, b) => (a.at < b.at ? 1 : -1));
  }

  /* ---------------- Notifications ---------------- */
  function notify(type, title, body) {
    data.notifications.unshift({
      id: U.uid("n"), type: type, title: title, body: body,
      at: new Date().toISOString(), read: false
    });
    if (data.notifications.length > 40) data.notifications.length = 40;
    persist();
  }
  function notifications() { return data.notifications; }
  function unreadCount() { return data.notifications.filter(n => !n.read).length; }
  function markAllRead() {
    data.notifications.forEach(n => { n.read = true; });
    persist();
  }

  /* ---------------- Analytics (local, no PII) ---------------- */
  function track(event, props) {
    if (!data.settings.analytics) return;
    data.analytics.push({ e: event, t: Date.now(), p: props || {} });
    if (data.analytics.length > 500) data.analytics = data.analytics.slice(-500);
  }
  function analyticsSummary() {
    const counts = {};
    data.analytics.forEach(a => { counts[a.e] = (counts[a.e] || 0) + 1; });
    return counts;
  }

  /* ---------------- Search history ---------------- */
  function addSearch(term) {
    if (!term) return;
    data.recentSearches = [term].concat(data.recentSearches.filter(t => t !== term)).slice(0, 6);
    persist();
  }
  function recentSearches() { return data.recentSearches; }

  /* ---------------- Config & admin ---------------- */
  function config() { return data.config; }
  function setConfig(path, value) {
    const parts = path.split(".");
    let node = data.config;
    for (let i = 0; i < parts.length - 1; i++) {
      if (!node[parts[i]]) node[parts[i]] = {};
      node = node[parts[i]];
    }
    node[parts[parts.length - 1]] = value;
    persist();
  }

  function allUsers() { return data.users; }
  function profileOf(userId) { return data.profiles[userId] || blankProfile(); }
  function setUserRole(userId, role) {
    const u = data.users.filter(x => x.id === userId)[0];
    if (u) { u.role = role; persist(); }
  }
  function removeUser(userId) {
    data.users = data.users.filter(u => u.id !== userId);
    delete data.profiles[userId];
    if (data.session.userId === userId) data.session.userId = null;
    persist();
  }

  function extraQuestions() { return data.admin.extraQuestions; }
  function addQuestion(q) {
    q.id = q.id || U.uid("q");
    q.custom = true;
    data.admin.extraQuestions.push(q);
    TLA.data.questions.push(q);
    persist();
    return q;
  }
  function removeQuestion(id) {
    data.admin.extraQuestions = data.admin.extraQuestions.filter(q => q.id !== id);
    const i = TLA.data.questions.findIndex(q => q.id === id);
    if (i > -1) TLA.data.questions.splice(i, 1);
    persist();
  }

  function teachers() { return data.admin.teachers; }
  function addTeacher(t) {
    t.id = U.uid("t");
    data.admin.teachers.push(t);
    persist();
    return t;
  }
  function removeTeacher(id) {
    data.admin.teachers = data.admin.teachers.filter(t => t.id !== id);
    persist();
  }

  function exportData() {
    const u = currentUser();
    return JSON.stringify({
      exportedAt: new Date().toISOString(),
      user: u ? { name: u.name, email: u.email, role: u.role } : null,
      profile: profile(),
      settings: data.settings
    }, null, 2);
  }

  async function wipe() {
    await TLA.store.clear();
    data = defaults();
    persist();
  }

  /* Load custom questions saved by an admin back into the bank. */
  function hydrateCustomQuestions() {
    (data.admin.extraQuestions || []).forEach(function (q) {
      if (!TLA.data.questions.some(x => x.id === q.id)) TLA.data.questions.push(q);
    });
  }

  return {
    init, onChange, raw: () => data, hydrateCustomQuestions,
    currentUser, isAuthed, isAdmin, profile, register, login, logout, restoreSession, updateUser, deleteAccount,
    settings, setSetting, setNotifPref,
    touchStreak, addXp, xpToday,
    completeLesson, lessonDone, courseProgress,
    recordAttempt, attempts, attemptById, attemptsFor, stats,
    saveWord, removeWord, hasWord, reviewWord, dueWords,
    toggleBookmark, isBookmarked,
    checkAchievements, hasAchievement,
    issueCertificate, findCertificate,
    taskState, completeTask,
    plans, setPlanPrice, currentPlan, recordPayment, allPayments,
    notify, notifications, unreadCount, markAllRead,
    track, analyticsSummary,
    addSearch, recentSearches,
    config, setConfig,
    allUsers, profileOf, setUserRole, removeUser,
    extraQuestions, addQuestion, removeQuestion,
    teachers, addTeacher, removeTeacher,
    exportData, wipe
  };
})();


/* ===== 07-engine.js ===== */
/* ============================================================
   ENGINE — test assembly, scoring, level estimation,
   recommendation logic
   ============================================================ */
window.TLA = window.TLA || {};

TLA.engine = (function () {
  "use strict";
  const U = TLA.utils;
  const ORDER = ["a1", "a2", "b1", "b2", "c1", "c2"];

  /* ---------------- Test assembly ---------------- */

  /**
   * Builds a question set for a test definition.
   * Reading/listening items stay grouped by their passage so the
   * learner never jumps between texts mid-section.
   */
  function buildTest(def, seed) {
    const rnd = U.seededRandom(seed || def.id + "-" + Date.now());
    const pool = TLA.data.questions.filter(function (q) {
      if (q.type === "writing" || q.type === "speaking") return false;
      if (def.levels && def.levels.indexOf(q.level) === -1) return false;
      if (def.skills && def.skills.indexOf(q.skill) === -1) return false;
      return true;
    });

    const perSkill = {};
    def.skills.forEach(s => { perSkill[s] = []; });
    pool.forEach(q => { if (perSkill[q.skill]) perSkill[q.skill].push(q); });

    const skills = def.skills.filter(s => perSkill[s] && perSkill[s].length);
    if (!skills.length) return [];

    const base = Math.floor(def.count / skills.length);
    let remainder = def.count - base * skills.length;
    const picked = [];

    skills.forEach(function (skill) {
      let want = base + (remainder-- > 0 ? 1 : 0);
      const list = perSkill[skill];
      if (skill === "reading" || skill === "listening") {
        // keep passages intact: take whole groups until quota is met
        const key = skill === "reading" ? "textId" : "scriptId";
        const groups = U.groupBy(list, q => q[key]);
        const groupKeys = U.shuffle(Object.keys(groups), rnd);
        groupKeys.forEach(function (gk) {
          if (want <= 0) return;
          const group = groups[gk];
          group.slice(0, Math.max(1, Math.min(group.length, want))).forEach(function (q) {
            if (want > 0) { picked.push(q); want--; }
          });
        });
      } else {
        U.shuffle(list, rnd).slice(0, want).forEach(q => picked.push(q));
      }
    });

    // order: grammar/vocabulary first, then reading, then listening
    const rank = { grammar: 0, vocabulary: 1, reading: 2, listening: 3, writing: 4, speaking: 5 };
    picked.sort(function (a, b) {
      const r = (rank[a.skill] ?? 9) - (rank[b.skill] ?? 9);
      if (r !== 0) return r;
      const ga = a.textId || a.scriptId || "";
      const gb = b.textId || b.scriptId || "";
      if (ga !== gb) return ga < gb ? -1 : 1;
      return ORDER.indexOf(a.level) - ORDER.indexOf(b.level);
    });

    // shuffle answer options while tracking the correct index
    return picked.map(function (q) {
      const idx = q.opts.map((_, i) => i);
      const shuffled = U.shuffle(idx, rnd);
      return {
        ref: q.id,
        q: q,
        optOrder: shuffled,
        correctPos: shuffled.indexOf(q.ans)
      };
    });
  }

  /** Diagnostic pulls a fixed spread across levels so the estimate is meaningful. */
  function buildDiagnostic(seed) {
    const rnd = U.seededRandom(seed || "diag-" + Date.now());
    const plan = [
      { level: "a1", n: 3 }, { level: "a2", n: 3 }, { level: "b1", n: 4 },
      { level: "b2", n: 4 }, { level: "c1", n: 3 }, { level: "c2", n: 3 }
    ];
    const picked = [];
    plan.forEach(function (slot) {
      const skillsWanted = ["grammar", "vocabulary", "reading", "listening"];
      const bucket = TLA.data.questions.filter(q =>
        q.level === slot.level && skillsWanted.indexOf(q.skill) !== -1);
      const grouped = U.groupBy(bucket, q => q.skill);
      const keys = U.shuffle(Object.keys(grouped), rnd);
      let taken = 0, ki = 0;
      while (taken < slot.n && ki < keys.length * 3) {
        const list = grouped[keys[ki % keys.length]];
        const item = list && list.length ? list.splice(Math.floor(rnd() * list.length), 1)[0] : null;
        if (item) { picked.push(item); taken++; }
        ki++;
      }
    });

    const rank = { grammar: 0, vocabulary: 1, reading: 2, listening: 3 };
    picked.sort(function (a, b) {
      const r = (rank[a.skill] ?? 9) - (rank[b.skill] ?? 9);
      if (r !== 0) return r;
      return ORDER.indexOf(a.level) - ORDER.indexOf(b.level);
    });

    return picked.map(function (q) {
      const shuffled = U.shuffle(q.opts.map((_, i) => i), rnd);
      return { ref: q.id, q: q, optOrder: shuffled, correctPos: shuffled.indexOf(q.ans) };
    });
  }

  /* ---------------- Scoring ---------------- */

  function scoreAttempt(items, answers) {
    let correct = 0;
    const bySkill = {};
    const byLevel = {};

    items.forEach(function (item, i) {
      const skill = item.q.skill;
      const level = item.q.level;
      bySkill[skill] = bySkill[skill] || { c: 0, n: 0 };
      byLevel[level] = byLevel[level] || { c: 0, n: 0 };
      bySkill[skill].n++;
      byLevel[level].n++;
      const given = answers[i];
      const ok = given !== null && given !== undefined && given === item.correctPos;
      if (ok) { correct++; bySkill[skill].c++; byLevel[level].c++; }
    });

    const skillScores = {};
    Object.keys(bySkill).forEach(function (s) {
      skillScores[s] = U.pct(bySkill[s].c, bySkill[s].n);
    });

    const levelAccuracy = {};
    Object.keys(byLevel).forEach(function (l) {
      levelAccuracy[l] = U.pct(byLevel[l].c, byLevel[l].n);
    });

    return {
      correct: correct,
      total: items.length,
      score: U.pct(correct, items.length),
      skillScores: skillScores,
      levelAccuracy: levelAccuracy
    };
  }

  /** Highest level the learner clears at ≥60%, with an overall-score fallback. */
  function estimateLevel(result) {
    const acc = result.levelAccuracy || {};
    let best = null;
    for (let i = 0; i < ORDER.length; i++) {
      const lv = ORDER[i];
      if (acc[lv] === undefined) continue;
      if (acc[lv] >= 60) best = lv;
      else if (best) break;
    }
    if (!best) {
      const s = result.score;
      if (s >= 88) best = "c1";
      else if (s >= 74) best = "b2";
      else if (s >= 58) best = "b1";
      else if (s >= 40) best = "a2";
      else best = "a1";
    }
    return best;
  }

  function bandFromScore(score) {
    if (score >= 92) return "c2";
    if (score >= 80) return "c1";
    if (score >= 66) return "b2";
    if (score >= 50) return "b1";
    if (score >= 34) return "a2";
    return "a1";
  }

  /** Per-skill CEFR estimate, never above the hardest item that skill contained. */
  function skillLevels(items, result) {
    const maxLevel = {};
    items.forEach(function (item) {
      const s = item.q.skill;
      const li = ORDER.indexOf(item.q.level);
      maxLevel[s] = Math.max(maxLevel[s] === undefined ? -1 : maxLevel[s], li);
    });
    const out = {};
    Object.keys(result.skillScores).forEach(function (s) {
      const band = ORDER.indexOf(bandFromScore(result.skillScores[s]));
      const cap = maxLevel[s] === undefined ? band : maxLevel[s];
      out[s] = ORDER[Math.max(0, Math.min(band, cap))];
    });
    return out;
  }

  function strengthsAndGaps(skillScores) {
    const entries = Object.keys(skillScores).map(k => ({ skill: k, score: skillScores[k] }));
    entries.sort((a, b) => b.score - a.score);
    const strengths = entries.filter(e => e.score >= 70).slice(0, 2);
    const gaps = entries.slice().reverse().filter(e => e.score < 75).slice(0, 2);
    return { strengths: strengths, gaps: gaps };
  }

  /* ---------------- Recommendations ---------------- */

  /**
   * Turns a skill profile into concrete next steps: lessons for the
   * weakest skills first, then a matching practice test.
   */
  function recommend(opts) {
    const o = opts || {};
    const p = TLA.state.profile();
    const skills = o.skillScores || p.skills || {};
    const level = o.level || p.level || "a1";
    const li = Math.max(0, ORDER.indexOf(level));

    const ranked = Object.keys(skills).map(k => ({ skill: k, score: skills[k] }))
      .sort((a, b) => a.score - b.score);
    const weak = ranked.length ? ranked.slice(0, 2).map(r => r.skill) : ["listening", "vocabulary"];

    const out = [];
    const course = TLA.data.courses[li];
    if (course) {
      weak.forEach(function (skill) {
        const lesson = course.modules
          .reduce((acc, m) => acc.concat(m.lessons), [])
          .filter(l => l.skill === skill && !TLA.state.lessonDone(l.id))[0];
        if (lesson) {
          out.push({
            kind: "lesson",
            titleUz: lesson.titleUz,
            metaUz: course.code + " · " + TLA.i18n.t("misc.skill." + skill),
            href: "#/lesson/" + lesson.id
          });
        }
      });
    }

    weak.forEach(function (skill) {
      const test = TLA.data.testById("darajaviy-" + ORDER[li] + "-" + skill);
      if (test) {
        out.push({
          kind: "test",
          titleUz: test.titleUz,
          metaUz: test.count + " " + TLA.i18n.t("test.questions") + " · " + test.minutes + " " + TLA.i18n.t("test.minutes"),
          href: "#/test/" + test.id
        });
      }
    });

    const due = TLA.state.dueWords();
    if (due.length) {
      out.push({
        kind: "vocab",
        titleUz: "Takrorlash: " + due.length + " ta so‘z",
        metaUz: "Intervalli takrorlash rejasi",
        href: "#/dictionary?due=1"
      });
    }

    if (out.length < 3) {
      out.push({
        kind: "test",
        titleUz: TLA.data.testById("daily-challenge").titleUz,
        metaUz: "8 savol · 8 daqiqa",
        href: "#/test/daily-challenge"
      });
    }
    return out.slice(0, 4);
  }

  /** Short Uzbek sentence explaining what to work on next. */
  function planSentence(skillScores, level) {
    const ranked = Object.keys(skillScores).map(k => ({ skill: k, score: skillScores[k] }))
      .sort((a, b) => a.score - b.score);
    if (!ranked.length) return "";
    const nextLevel = ORDER[Math.min(ORDER.length - 1, ORDER.indexOf(level) + 1)];
    const names = ranked.slice(0, 2).map(r => TLA.i18n.t("misc.skill." + r.skill));
    return "Natijangizga ko‘ra " + nextLevel.toUpperCase() + " darajasiga o‘tishdan oldin " +
      names.join(" va ") + " ko‘nikmalarini mustahkamlash tavsiya etiladi.";
  }

  /* ---------------- Question difficulty analytics ---------------- */

  /** Aggregate answer statistics — feeds the admin "hardest questions" view. */
  function questionStats() {
    const map = {};
    TLA.state.raw && null;
    const all = TLA.state.profile().attempts || [];
    all.forEach(function (a) {
      (a.detail || []).forEach(function (d) {
        map[d.ref] = map[d.ref] || { n: 0, c: 0 };
        map[d.ref].n++;
        if (d.ok) map[d.ref].c++;
      });
    });
    return Object.keys(map).map(function (ref) {
      const q = TLA.data.questionById(ref);
      return {
        id: ref,
        skill: q ? q.skill : "—",
        level: q ? q.level : "—",
        promptUz: q ? (q.promptUz || q.ar) : ref,
        n: map[ref].n,
        pValue: U.pct(map[ref].c, map[ref].n)
      };
    }).sort((a, b) => a.pValue - b.pValue);
  }

  return {
    ORDER, buildTest, buildDiagnostic, scoreAttempt, estimateLevel,
    bandFromScore, skillLevels, strengthsAndGaps, recommend, planSentence, questionStats
  };
})();


/* ===== 08-charts.js ===== */
/* ============================================================
   CHARTS — dependency-free SVG rendering
   The "shamsa" rosette is the platform's signature visual: a skill
   radar drawn as an illuminated manuscript medallion.
   ============================================================ */
window.TLA = window.TLA || {};

TLA.charts = (function () {
  "use strict";
  const U = TLA.utils;

  function polar(cx, cy, r, angleDeg) {
    const a = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }

  /* ---------------- Shamsa rosette (radar) ---------------- */
  function shamsa(series, opts) {
    const o = opts || {};
    const size = 320, cx = 160, cy = 160, R = o.radius || 104;
    const n = series.length;
    if (!n) return "";
    const step = 360 / n;

    let rings = "";
    [0.25, 0.5, 0.75, 1].forEach(function (f) {
      let d = "";
      for (let i = 0; i < n; i++) {
        const p = polar(cx, cy, R * f, i * step);
        d += (i === 0 ? "M" : "L") + p.x.toFixed(1) + " " + p.y.toFixed(1);
      }
      rings += '<path class="ring" d="' + d + ' Z"/>';
    });

    let spokes = "";
    for (let i = 0; i < n; i++) {
      const p = polar(cx, cy, R, i * step);
      spokes += '<line class="spoke" x1="' + cx + '" y1="' + cy + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '"/>';
    }

    // scalloped outer rosette
    const petals = 16, pr = R + 12;
    let petalPath = "";
    for (let i = 0; i <= petals; i++) {
      const p = polar(cx, cy, pr, (360 / petals) * i);
      const chord = 2 * pr * Math.sin(Math.PI / petals) / 2;
      petalPath += i === 0
        ? "M" + p.x.toFixed(1) + " " + p.y.toFixed(1)
        : " A" + chord.toFixed(1) + " " + chord.toFixed(1) + " 0 0 1 " + p.x.toFixed(1) + " " + p.y.toFixed(1);
    }

    let area = "", nodes = "", labels = "";
    for (let i = 0; i < n; i++) {
      const value = U.clamp(Number(series[i].value) || 0, 0, 100) / 100;
      const p = polar(cx, cy, R * Math.max(0.06, value), i * step);
      area += (i === 0 ? "M" : "L") + p.x.toFixed(1) + " " + p.y.toFixed(1);
      nodes += '<circle class="node" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.4"/>';

      const lp = polar(cx, cy, R + 30, i * step);
      const anchor = lp.x > cx + 6 ? "start" : (lp.x < cx - 6 ? "end" : "middle");
      labels += '<text class="lbl" x="' + lp.x.toFixed(1) + '" y="' + (lp.y - 2).toFixed(1) + '" text-anchor="' + anchor + '">' +
        U.esc(series[i].label) + "</text>" +
        '<text class="val" x="' + lp.x.toFixed(1) + '" y="' + (lp.y + 11).toFixed(1) + '" text-anchor="' + anchor + '">' +
        Math.round(series[i].value) + "%</text>";
    }

    // The side labels sit outside the plot radius and are end/start anchored,
    // so the viewBox is padded horizontally — otherwise long skill names
    // ("Tinglash", "Leksika") get clipped at the SVG edge.
    const padX = 52;
    return '<svg class="shamsa ' + (o.onDark ? "shamsa-on-dark" : "") + '" viewBox="' + (-padX) + ' 0 ' +
      (size + padX * 2) + ' ' + size +
      '" role="img" aria-label="' + U.attr(o.aria || "Ko‘nikmalar diagrammasi") + '">' +
      '<path class="petal" d="' + petalPath + ' Z"/>' +
      rings + spokes +
      '<path class="area" d="' + area + ' Z"/>' + nodes + labels +
      "</svg>";
  }

  /* ---------------- Bars ---------------- */
  function bars(series, opts) {
    const o = opts || {};
    const w = 520, h = o.height || 190, padL = 34, padB = 26, padT = 12;
    const n = series.length;
    if (!n) return "";
    const max = o.max || 100;
    const bw = (w - padL - 10) / n;
    let grid = "", rects = "", labels = "";

    [0, 0.25, 0.5, 0.75, 1].forEach(function (f) {
      const y = padT + (h - padT - padB) * (1 - f);
      grid += '<line class="grid-line" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + w + '" y2="' + y.toFixed(1) + '"/>' +
        '<text class="axis-lbl" x="' + (padL - 8) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + Math.round(max * f) + "</text>";
    });

    series.forEach(function (item, i) {
      const value = U.clamp(item.value, 0, max);
      const barH = (h - padT - padB) * (value / max);
      const x = padL + i * bw + bw * 0.18;
      const y = h - padB - barH;
      rects += '<rect class="bar' + (item.alt ? " alt" : "") + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) +
        '" width="' + (bw * 0.64).toFixed(1) + '" height="' + Math.max(2, barH).toFixed(1) + '" rx="4"><title>' +
        U.esc(item.label) + ": " + Math.round(item.value) + "</title></rect>";
      labels += '<text class="axis-lbl" x="' + (x + bw * 0.32).toFixed(1) + '" y="' + (h - 8) +
        '" text-anchor="middle">' + U.esc(item.label) + "</text>";
    });

    return '<svg class="chart-svg" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet" role="img">' +
      grid + rects + labels + "</svg>";
  }

  /* ---------------- Line ---------------- */
  function line(points, opts) {
    const o = opts || {};
    const w = 520, h = o.height || 190, padL = 34, padB = 26, padT = 14, padR = 10;
    if (points.length < 2) {
      return '<div class="empty" style="padding:2rem"><p class="muted">' +
        U.esc(o.emptyText || "Grafik uchun kamida ikkita natija kerak.") + "</p></div>";
    }
    const max = o.max || 100;
    const innerW = w - padL - padR;
    const innerH = h - padT - padB;
    const stepX = innerW / (points.length - 1);

    let grid = "";
    [0, 0.5, 1].forEach(function (f) {
      const y = padT + innerH * (1 - f);
      grid += '<line class="grid-line" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (w - padR) + '" y2="' + y.toFixed(1) + '"/>' +
        '<text class="axis-lbl" x="' + (padL - 8) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end">' + Math.round(max * f) + "</text>";
    });

    let d = "", dots = "", labels = "";
    points.forEach(function (pt, i) {
      const x = padL + stepX * i;
      const y = padT + innerH * (1 - U.clamp(pt.value, 0, max) / max);
      d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
      dots += '<circle class="dot" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="4"><title>' +
        U.esc(pt.label) + ": " + Math.round(pt.value) + "</title></circle>";
      if (points.length <= 8 || i % 2 === 0) {
        labels += '<text class="axis-lbl" x="' + x.toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + U.esc(pt.label) + "</text>";
      }
    });

    const areaPath = d + " L" + (padL + stepX * (points.length - 1)).toFixed(1) + " " + (h - padB) +
      " L" + padL + " " + (h - padB) + " Z";

    return '<svg class="chart-svg" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet" role="img">' +
      '<defs><linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="rgba(200,162,83,.42)"/><stop offset="100%" stop-color="rgba(200,162,83,0)"/>' +
      "</linearGradient></defs>" +
      grid + '<path class="line-area" d="' + areaPath + '"/><path class="line" d="' + d + '"/>' + dots + labels + "</svg>";
  }

  /* ---------------- Donut ---------------- */
  function donut(value, opts) {
    const o = opts || {};
    const size = o.size || 168, stroke = o.stroke || 12;
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const filled = c * U.clamp(value, 0, 100) / 100;
    return '<svg viewBox="0 0 ' + size + " " + size + '" width="' + size + '" height="' + size + '" role="img" aria-label="' +
      Math.round(value) + '%">' +
      '<circle class="donut-track" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r.toFixed(1) + '" stroke-width="' + stroke + '"/>' +
      '<circle class="donut-value" cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r.toFixed(1) + '" stroke-width="' + stroke +
      '" stroke-dasharray="' + filled.toFixed(1) + " " + c.toFixed(1) + '" transform="rotate(-90 ' + size / 2 + " " + size / 2 + ')"/>' +
      "</svg>";
  }

  /* ---------------- Sparkline ---------------- */
  function sparkline(values, opts) {
    const o = opts || {};
    const w = o.width || 120, h = o.height || 32;
    if (!values.length) return "";
    const max = Math.max.apply(null, values.concat([1]));
    const step = values.length > 1 ? w / (values.length - 1) : w;
    let d = "";
    values.forEach(function (v, i) {
      const x = step * i;
      const y = h - (h - 4) * (v / max) - 2;
      d += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1);
    });
    return '<svg class="chart-svg" viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<path class="line" d="' + d + '" stroke-width="2"/></svg>';
  }

  return { shamsa, bars, line, donut, sparkline };
})();


/* ===== 09-qr.js ===== */
/* ============================================================
   QR — minimal QR Code generator (version 4, EC level L, byte mode)
   Enough capacity for a verification URL (up to 78 characters).
   Implements ISO/IEC 18004: RS(100,80), all 8 masks with penalty
   scoring, BCH format information.
   ============================================================ */
window.TLA = window.TLA || {};

TLA.qr = (function () {
  "use strict";

  const VERSION = 4;
  const SIZE = 17 + VERSION * 4;          // 33
  const TOTAL_CODEWORDS = 100;
  const EC_CODEWORDS = 20;
  const DATA_CODEWORDS = TOTAL_CODEWORDS - EC_CODEWORDS; // 80
  const ALIGN_POS = [6, 26];
  const G15 = 0x537;
  const G15_MASK = 0x5412;
  const EC_LEVEL_L = 1;                    // format indicator bits for L

  /* ---------- Galois field GF(256) ---------- */
  const EXP = new Uint8Array(512);
  const LOG = new Uint8Array(256);
  (function initGF() {
    let x = 1;
    for (let i = 0; i < 255; i++) {
      EXP[i] = x;
      LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11d;
    }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();

  function gfMul(a, b) {
    if (a === 0 || b === 0) return 0;
    return EXP[LOG[a] + LOG[b]];
  }

  function generatorPoly(degree) {
    let poly = [1];
    for (let i = 0; i < degree; i++) {
      const next = new Array(poly.length + 1).fill(0);
      for (let j = 0; j < poly.length; j++) {
        next[j] ^= poly[j];
        next[j + 1] ^= gfMul(poly[j], EXP[i]);
      }
      poly = next;
    }
    return poly;
  }

  function reedSolomon(data, ecLen) {
    const gen = generatorPoly(ecLen);
    const res = new Array(data.length + ecLen).fill(0);
    for (let i = 0; i < data.length; i++) res[i] = data[i];
    for (let i = 0; i < data.length; i++) {
      const factor = res[i];
      if (factor === 0) continue;
      for (let j = 0; j < gen.length; j++) {
        res[i + j] ^= gfMul(gen[j], factor);
      }
    }
    return res.slice(data.length);
  }

  /* ---------- Data encoding ---------- */
  function toBytes(text) {
    const out = [];
    for (let i = 0; i < text.length; i++) {
      let c = text.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f)); }
      else { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f)); }
    }
    return out;
  }

  function encodeData(text) {
    let bytes = toBytes(text);
    if (bytes.length > DATA_CODEWORDS - 2) bytes = bytes.slice(0, DATA_CODEWORDS - 2);

    const bits = [];
    function push(value, length) {
      for (let i = length - 1; i >= 0; i--) bits.push((value >>> i) & 1);
    }
    push(0b0100, 4);              // byte mode
    push(bytes.length, 8);        // character count (versions 1–9)
    bytes.forEach(b => push(b, 8));

    const capacityBits = DATA_CODEWORDS * 8;
    for (let i = 0; i < 4 && bits.length < capacityBits; i++) bits.push(0);
    while (bits.length % 8 !== 0) bits.push(0);

    const codewords = [];
    for (let i = 0; i < bits.length; i += 8) {
      let byte = 0;
      for (let j = 0; j < 8; j++) byte = (byte << 1) | bits[i + j];
      codewords.push(byte);
    }
    const pads = [0xec, 0x11];
    let k = 0;
    while (codewords.length < DATA_CODEWORDS) codewords.push(pads[k++ % 2]);

    return codewords.concat(reedSolomon(codewords, EC_CODEWORDS));
  }

  /* ---------- Matrix ---------- */
  function blank() {
    const m = [];
    for (let r = 0; r < SIZE; r++) m.push(new Array(SIZE).fill(null));
    return m;
  }

  function placeFinder(m, row, col) {
    for (let r = -1; r <= 7; r++) {
      for (let c = -1; c <= 7; c++) {
        const rr = row + r, cc = col + c;
        if (rr < 0 || rr >= SIZE || cc < 0 || cc >= SIZE) continue;
        const inRing = (r >= 0 && r <= 6 && (c === 0 || c === 6)) ||
          (c >= 0 && c <= 6 && (r === 0 || r === 6)) ||
          (r >= 2 && r <= 4 && c >= 2 && c <= 4);
        m[rr][cc] = inRing;
      }
    }
  }

  function placeAlignment(m) {
    for (let i = 0; i < ALIGN_POS.length; i++) {
      for (let j = 0; j < ALIGN_POS.length; j++) {
        const row = ALIGN_POS[i], col = ALIGN_POS[j];
        if (m[row][col] !== null) continue;      // overlaps a finder
        for (let r = -2; r <= 2; r++) {
          for (let c = -2; c <= 2; c++) {
            m[row + r][col + c] = (Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0));
          }
        }
      }
    }
  }

  function placeTiming(m) {
    for (let i = 8; i < SIZE - 8; i++) {
      if (m[6][i] === null) m[6][i] = i % 2 === 0;
      if (m[i][6] === null) m[i][6] = i % 2 === 0;
    }
  }

  function bchTypeInfo(data) {
    let d = data << 10;
    function digit(v) { let n = 0; while (v !== 0) { n++; v >>>= 1; } return n; }
    while (digit(d) - digit(G15) >= 0) d ^= (G15 << (digit(d) - digit(G15)));
    return ((data << 10) | d) ^ G15_MASK;
  }

  function placeFormat(m, maskPattern) {
    const bits = bchTypeInfo((EC_LEVEL_L << 3) | maskPattern);
    for (let i = 0; i < 15; i++) {
      const on = ((bits >> i) & 1) === 1;
      if (i < 6) m[i][8] = on;
      else if (i < 8) m[i + 1][8] = on;
      else m[SIZE - 15 + i][8] = on;
    }
    for (let i = 0; i < 15; i++) {
      const on = ((bits >> i) & 1) === 1;
      if (i < 8) m[8][SIZE - i - 1] = on;
      else if (i < 9) m[8][15 - i - 1 + 1] = on;
      else m[8][15 - i - 1] = on;
    }
    m[SIZE - 8][8] = true;  // dark module
  }

  function maskFn(pattern, i, j) {
    switch (pattern) {
      case 0: return (i + j) % 2 === 0;
      case 1: return i % 2 === 0;
      case 2: return j % 3 === 0;
      case 3: return (i + j) % 3 === 0;
      case 4: return (Math.floor(i / 2) + Math.floor(j / 3)) % 2 === 0;
      case 5: return ((i * j) % 2) + ((i * j) % 3) === 0;
      case 6: return ((((i * j) % 2) + ((i * j) % 3)) % 2) === 0;
      default: return ((((i + j) % 2) + ((i * j) % 3)) % 2) === 0;
    }
  }

  function mapData(m, codewords, maskPattern) {
    let inc = -1, row = SIZE - 1, bitIndex = 7, byteIndex = 0;
    for (let col = SIZE - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (;;) {
        for (let c = 0; c < 2; c++) {
          if (m[row][col - c] === null) {
            let dark = false;
            if (byteIndex < codewords.length) {
              dark = ((codewords[byteIndex] >>> bitIndex) & 1) === 1;
            }
            if (maskFn(maskPattern, row, col - c)) dark = !dark;
            m[row][col - c] = dark;
            bitIndex--;
            if (bitIndex === -1) { byteIndex++; bitIndex = 7; }
          }
        }
        row += inc;
        if (row < 0 || row >= SIZE) { row -= inc; inc = -inc; break; }
      }
    }
  }

  function penalty(m) {
    let score = 0;
    // rule 1: runs of 5+
    for (let r = 0; r < SIZE; r++) {
      for (let dir = 0; dir < 2; dir++) {
        let run = 1;
        for (let c = 1; c < SIZE; c++) {
          const prev = dir === 0 ? m[r][c - 1] : m[c - 1][r];
          const cur = dir === 0 ? m[r][c] : m[c][r];
          if (cur === prev) { run++; }
          else { if (run >= 5) score += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) score += 3 + (run - 5);
      }
    }
    // rule 2: 2x2 blocks
    for (let r = 0; r < SIZE - 1; r++) {
      for (let c = 0; c < SIZE - 1; c++) {
        const v = m[r][c];
        if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) score += 3;
      }
    }
    // rule 3: finder-like patterns
    const pat = [true, false, true, true, true, false, true, false, false, false, false];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        for (let dir = 0; dir < 2; dir++) {
          let match = true;
          for (let k = 0; k < pat.length; k++) {
            const rr = dir === 0 ? r : r + k;
            const cc = dir === 0 ? c + k : c;
            if (rr >= SIZE || cc >= SIZE || m[rr][cc] !== pat[k]) { match = false; break; }
          }
          if (match) score += 40;
        }
      }
    }
    // rule 4: dark module ratio
    let dark = 0;
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (m[r][c]) dark++;
    const ratio = Math.abs((dark * 100) / (SIZE * SIZE) - 50);
    score += Math.floor(ratio / 5) * 10;
    return score;
  }

  /** Returns a SIZE×SIZE boolean matrix for the given text. */
  function matrix(text) {
    const codewords = encodeData(String(text || ""));
    let best = null, bestScore = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      const m = blank();
      placeFinder(m, 0, 0);
      placeFinder(m, SIZE - 7, 0);
      placeFinder(m, 0, SIZE - 7);
      placeAlignment(m);
      placeTiming(m);
      placeFormat(m, mask);
      mapData(m, codewords, mask);
      const score = penalty(m);
      if (score < bestScore) { bestScore = score; best = m; }
    }
    return best;
  }

  /** Renders the matrix as a compact, crisp SVG string. */
  function svg(text, opts) {
    const o = opts || {};
    const m = matrix(text);
    const quiet = o.quiet === undefined ? 2 : o.quiet;
    const dim = SIZE + quiet * 2;
    let path = "";
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (m[r][c]) path += "M" + (c + quiet) + " " + (r + quiet) + "h1v1h-1z";
      }
    }
    return '<svg viewBox="0 0 ' + dim + " " + dim + '" shape-rendering="crispEdges" role="img" aria-label="QR">' +
      '<rect width="' + dim + '" height="' + dim + '" fill="#ffffff"/>' +
      '<path d="' + path + '" fill="' + (o.color || "#0b1c2e") + '"/></svg>';
  }

  return { matrix, svg, SIZE };
})();


/* ===== 10-audio.js ===== */
/* ============================================================
   AUDIO — listening playback
   Uses the device speech engine for Arabic when a voice exists.
   When it does not, the player runs in a clearly labelled demo
   mode and the transcript becomes available so the exercise
   stays usable instead of silently failing.
   In production these calls are replaced by real audio files
   served from object storage (see services layer in README).
   ============================================================ */
window.TLA = window.TLA || {};

TLA.audio = (function () {
  "use strict";

  let voices = [];
  let arabicVoice = null;
  let current = null;

  function refreshVoices() {
    if (!("speechSynthesis" in window)) return;
    try {
      voices = window.speechSynthesis.getVoices() || [];
      arabicVoice = voices.filter(v => (v.lang || "").toLowerCase().indexOf("ar") === 0)[0] || null;
    } catch (e) {
      voices = [];
      arabicVoice = null;
    }
  }

  if ("speechSynthesis" in window) {
    refreshVoices();
    try { window.speechSynthesis.onvoiceschanged = refreshVoices; } catch (e) { /* ignore */ }
  }

  function hasArabicVoice() { return !!arabicVoice; }
  function mode() { return arabicVoice ? "speech" : "demo"; }

  /**
   * Creates a playback controller for one script.
   * Callbacks: onTick(progress 0..1, elapsedSeconds), onEnd(), onState(state)
   */
  function createPlayer(options) {
    const opts = options || {};
    const totalSeconds = Math.max(4, opts.seconds || 30);
    let rate = 1;
    let elapsed = 0;
    let timer = null;
    let state = "idle";
    let plays = 0;

    function emitState(next) {
      state = next;
      if (opts.onState) opts.onState(next);
    }

    function tick() {
      elapsed += 0.2 * rate;
      const progress = Math.min(1, elapsed / totalSeconds);
      if (opts.onTick) opts.onTick(progress, Math.min(totalSeconds, elapsed));
      if (progress >= 1) stop(true);
    }

    function startTimer() {
      clearInterval(timer);
      timer = setInterval(tick, 200);
    }

    function speak() {
      if (!("speechSynthesis" in window) || !arabicVoice || !opts.text) return false;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(opts.text);
        utter.voice = arabicVoice;
        utter.lang = arabicVoice.lang || "ar-SA";
        utter.rate = rate;
        utter.onend = function () { stop(true); };
        utter.onerror = function () { stop(true); };
        window.speechSynthesis.speak(utter);
        return true;
      } catch (e) {
        return false;
      }
    }

    function play() {
      if (state === "playing") return;
      if (opts.maxPlays && plays >= opts.maxPlays && elapsed === 0) {
        if (opts.onLimit) opts.onLimit();
        return;
      }
      if (elapsed === 0 || elapsed >= totalSeconds) {
        elapsed = 0;
        plays++;
        speak();
      } else if ("speechSynthesis" in window && arabicVoice) {
        try { window.speechSynthesis.resume(); } catch (e) { /* ignore */ }
      }
      startTimer();
      emitState("playing");
    }

    function pause() {
      clearInterval(timer);
      if ("speechSynthesis" in window && arabicVoice) {
        try { window.speechSynthesis.pause(); } catch (e) { /* ignore */ }
      }
      emitState("paused");
    }

    function stop(finished) {
      clearInterval(timer);
      timer = null;
      if ("speechSynthesis" in window) {
        try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
      }
      if (finished) {
        elapsed = totalSeconds;
        if (opts.onTick) opts.onTick(1, totalSeconds);
        if (opts.onEnd) opts.onEnd();
      } else {
        elapsed = 0;
        if (opts.onTick) opts.onTick(0, 0);
      }
      emitState("idle");
    }

    function toggle() { state === "playing" ? pause() : play(); }

    function setRate(value) {
      rate = value;
      if (state === "playing") { stop(false); play(); }
    }

    function seek(fraction) {
      elapsed = totalSeconds * Math.max(0, Math.min(1, fraction));
      if (opts.onTick) opts.onTick(elapsed / totalSeconds, elapsed);
    }

    function destroy() { stop(false); }

    return {
      play, pause, stop, toggle, setRate, seek, destroy,
      get state() { return state; },
      get plays() { return plays; },
      get total() { return totalSeconds; },
      get rate() { return rate; }
    };
  }

  /** One-shot pronunciation for a single word or sentence. */
  function speakOnce(text) {
    if (!("speechSynthesis" in window)) return false;
    refreshVoices();
    if (!arabicVoice) return false;
    try {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.voice = arabicVoice;
      utter.lang = arabicVoice.lang || "ar-SA";
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
      return true;
    } catch (e) {
      return false;
    }
  }

  function stopAll() {
    if (current) { current.destroy(); current = null; }
    if ("speechSynthesis" in window) {
      try { window.speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    }
  }

  return { hasArabicVoice, mode, createPlayer, speakOnce, stopAll, refreshVoices };
})();

  /* ---------------- Theme, language, motion ---------------- */
  function applySettings() {
    const s = TLA.state.settings();
    document.documentElement.setAttribute("data-theme", s.theme);
    document.documentElement.setAttribute("data-motion", s.motion === "off" ? "off" : "on");
    document.documentElement.style.setProperty("--font-scale", s.fontScale || 1);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", s.theme === "dark" ? "#061321" : "#f7f5f0");
  }

  function toggleTheme() {
    const s = TLA.state.settings();
    TLA.state.setSetting("theme", s.theme === "dark" ? "light" : "dark");
    applySettings();
    renderHeader();
  }

  function setLang(lang) {
    TLA.state.setSetting("lang", lang);
    TLA.i18n.set(lang);
    renderShell();
    if (TLA.router) TLA.router.rerender();
  }

  /* ---------------- Toast ---------------- */
  function toast(message, kind) {
    const wrap = U.$("#toastWrap");
    if (!wrap) return;
    const el = document.createElement("div");
    el.className = "toast toast-" + (kind || "info");
    el.setAttribute("role", "status");
    const icon = kind === "success" ? "✓" : kind === "error" ? "!" : kind === "xp" ? "✦" : "•";
    el.innerHTML = '<span class="ico">' + icon + "</span><span>" + U.esc(message) + "</span>";
    wrap.appendChild(el);
    setTimeout(function () {
      el.classList.add("out");
      setTimeout(() => el.remove(), 260);
    }, 3200);
  }

  /* ---------------- Modal ---------------- */
  function modal(html, opts) {
    const o = opts || {};
    const root = U.$("#modalRoot");
    lastFocus = document.activeElement;
    root.innerHTML =
      '<div class="modal-backdrop" data-action="modal-close"></div>' +
      '<div class="modal ' + (o.wide ? "modal-lg" : "") + '" role="dialog" aria-modal="true" ' +
      (o.label ? 'aria-label="' + U.attr(o.label) + '"' : "") + ">" +
      '<button class="modal-close" data-action="modal-close" aria-label="' + U.attr(t("action.close")) + '">✕</button>' +
      html + "</div>";
    root.hidden = false;
    document.body.classList.add("is-locked");
    const focusable = root.querySelector("input, select, textarea, button:not(.modal-close), a[href]");
    if (focusable) setTimeout(() => focusable.focus(), 60);
    return root;
  }

    const root = U.$("#modalRoot");

  /* ---------------- Auth ---------------- */
  function openAuth(mode) {
    const isLogin = mode === "login";
    modal(
      '<div class="text-center" style="margin-bottom:var(--sp-5)">' +
      '<span class="logo-mark" style="margin:0 auto var(--sp-3)"><span>ت</span></span>' +
      "<h3>" + (isLogin ? t("auth.loginTitle") : t("auth.registerTitle")) + "</h3>" +
      '<p class="muted" style="font-size:var(--fs-sm)">' + (isLogin ? "" : t("result.gateBody")) + "</p></div>" +
      '<form id="authForm" novalidate>' +
      (isLogin ? "" :
        '<label class="field"><span class="label">' + t("auth.name") + '</span>' +
        '<input class="input" name="name" autocomplete="name" required><span class="field-msg" data-for="name"></span></label>') +
      '<label class="field"><span class="label">' + t("auth.email") + '</span>' +
      '<input class="input" name="email" type="email" autocomplete="email" required><span class="field-msg" data-for="email"></span></label>' +
      '<label class="field"><span class="label">' + t("auth.password") + '</span>' +
      '<input class="input" name="password" type="password" autocomplete="' + (isLogin ? "current-password" : "new-password") + '" required>' +
      '<span class="field-hint">' + t("auth.passwordHint") + '</span><span class="field-msg" data-for="password"></span></label>' +
      (isLogin ? "" :
        '<label class="check" style="margin-top:var(--sp-4)"><input type="checkbox" name="agree">' +
        "<span>" + t("auth.agree") + "</span></label><span class='field-msg' data-for='agree'></span>") +
      '<button class="btn btn-primary btn-block btn-lg" type="submit" style="margin-top:var(--sp-5)">' +
      (isLogin ? t("action.login") : t("action.register")) + "</button>" +
      "</form>" +
      '<div class="divider-or" style="margin:var(--sp-5) 0">' + t("misc.total") + "</div>" +
      '<button class="btn btn-ghost btn-block" data-action="telegram-auth">✈ ' + t("auth.telegram") + "</button>" +
      '<p class="muted text-center" style="font-size:var(--fs-2xs);margin-top:var(--sp-4)">' + t("auth.demoNote") + "</p>" +
      '<p class="text-center" style="margin-top:var(--sp-4);font-size:var(--fs-sm)">' +
      (isLogin ? t("auth.noAccount") + ' <button class="btn btn-quiet" data-action="auth-register">' + t("action.register") + "</button>"
        : t("auth.haveAccount") + ' <button class="btn btn-quiet" data-action="auth-login">' + t("action.login") + "</button>") +
      "</p>",
      { label: isLogin ? t("auth.loginTitle") : t("auth.registerTitle") }
    );

    const form = U.$("#authForm");
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      const fd = new FormData(form);
      const name = (fd.get("name") || "").toString().trim();
      const email = (fd.get("email") || "").toString().trim();
      const password = (fd.get("password") || "").toString();
      const agree = fd.get("agree");

      U.$$(".field-msg", form).forEach(n => { n.textContent = ""; });
      U.$$(".field", form).forEach(n => n.classList.remove("field-error"));
      function fail(field, message) {
        const msg = form.querySelector('[data-for="' + field + '"]');
        if (msg) { msg.textContent = message; msg.closest(".field") && msg.closest(".field").classList.add("field-error"); }
        return false;
      }

      let ok = true;
      if (!isLogin && name.length < 2) ok = fail("name", t("auth.errName"));
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) ok = fail("email", t("auth.errEmail"));
      if (password.length < 8) ok = fail("password", t("auth.errPass"));
      if (!isLogin && !agree) ok = fail("agree", t("auth.errAgree"));
      if (!ok) return;

      // register()/login() may reach across the network now (05b-api.js) —
      // show that something is happening rather than leaving the button
      // looking inert for the round trip.
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalLabel = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = t("misc.loading");

      let res;
      try {
        res = isLogin ? await TLA.state.login(email, password) : await TLA.state.register(name, email, password);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalLabel;
      }

      if (!res.ok) {
        if (res.error === "exists") return fail("email", "Bu email allaqachon ro‘yxatdan o‘tgan.");
        if (res.error === "rate_limited") return fail("password", "Juda ko‘p urinish. Birozdan so‘ng qayta urinib ko‘ring.");
        return fail("password", t("auth.errCreds"));
      }
      closeModal();
      renderShell();
      toast(t("auth.welcome", { name: res.user.name }), "success");
      const profile = TLA.state.profile();
      if (!isLogin && !profile.onboarded) openOnboarding();
      else if (TLA.router) TLA.router.go("#/dashboard");
    });
  }

  let searchCache = null;
  let cursor = 0;

  function openSearch() {
    const overlay = U.$("#searchOverlay");
    searchCache = searchCache || searchIndex();
    const recent = TLA.state.recentSearches();
    overlay.innerHTML =
      '<div class="modal-backdrop" data-action="search-close"></div>' +
      '<div class="search-panel" role="dialog" aria-modal="true" aria-label="' + U.attr(t("nav.search")) + '">' +
      '<div class="search-head search-box">' +
      '<span class="search-ico">⌕</span>' +
      '<input class="input" id="searchInput" placeholder="' + U.attr(t("search.placeholder")) + '" autocomplete="off">' +
      "</div>" +
      '<div class="search-results" id="searchResults">' +
      (recent.length
        ? '<div class="search-group"><div class="search-group-label">' + t("search.recent") + "</div>" +
          recent.map(r => '<button class="search-hit" data-recent="' + U.attr(r) + '"><span class="ht">' + U.esc(r) + "</span></button>").join("") + "</div>"
        : "") +
      "</div>" +
      '<div class="search-foot"><span><span class="kbd">↑↓</span> ' + t("search.hint") + "</span>" +
      '<span><span class="kbd">↵</span> ' + t("search.select") + "</span>" +
      '<span><span class="kbd">esc</span> ' + t("search.esc") + "</span></div></div>";
    overlay.hidden = false;
    document.body.classList.add("is-locked");

    const input = U.$("#searchInput");
    setTimeout(() => input.focus(), 50);
    input.addEventListener("input", U.debounce(function () { runSearch(input.value); }, 120));
    input.addEventListener("keydown", function (ev) {
      const hits = U.$$(".search-hit", U.$("#searchResults"));
      if (ev.key === "ArrowDown") { ev.preventDefault(); cursor = Math.min(hits.length - 1, cursor + 1); paintCursor(hits); }
      else if (ev.key === "ArrowUp") { ev.preventDefault(); cursor = Math.max(0, cursor - 1); paintCursor(hits); }
      else if (ev.key === "Enter") {
        ev.preventDefault();
        const target = hits[cursor];
        if (target) target.click();
      }
    });
    U.$("#searchResults").addEventListener("click", function (ev) {
      const recentBtn = ev.target.closest("[data-recent]");
      if (recentBtn) { input.value = recentBtn.dataset.recent; runSearch(input.value); input.focus(); }
    });
  }

  function paintCursor(hits) {
    hits.forEach((h, i) => h.classList.toggle("is-cursor", i === cursor));
    if (hits[cursor]) hits[cursor].scrollIntoView({ block: "nearest" });
  }

  function runSearch(term) {
    const host = U.$("#searchResults");
    cursor = 0;
    if (!term || term.trim().length < 2) {
      host.innerHTML = '<div class="search-group"><div class="search-group-label">' + t("search.recent") + "</div>" +
        TLA.state.recentSearches().map(r => '<button class="search-hit" data-recent="' + U.attr(r) + '"><span class="ht">' + U.esc(r) + "</span></button>").join("") +
        "</div>";
      return;
    }
    const hits = searchCache.filter(item => U.includesLoose(item.key, term)).slice(0, 24);
    if (!hits.length) {
      host.innerHTML = '<div class="empty" style="border:0;background:none"><div class="glyph">؟</div><h4>' +
        t("empty.search") + "</h4><p>" + t("empty.searchD") + "</p></div>";
      return;
    }
    const groups = U.groupBy(hits, h => h.group);
    host.innerHTML = Object.keys(groups).map(function (g) {
      return '<div class="search-group"><div class="search-group-label">' + U.esc(g) + "</div>" +
        groups[g].map(h => '<a class="search-hit" href="' + h.href + '" data-search-go="' + U.attr(term) + '">' +
          '<span><span class="ht">' + U.esc(h.title) + '</span><br><span class="hs">' + U.esc(h.sub || "") + "</span></span></a>").join("") +
        "</div>";
    }).join("");
    paintCursor(U.$$(".search-hit", host));
  }

  function closeSearch() {
    const overlay = U.$("#searchOverlay");
    if (!overlay || overlay.hidden) return;
    overlay.hidden = true;
    overlay.innerHTML = "";
    document.body.classList.remove("is-locked");
  }
