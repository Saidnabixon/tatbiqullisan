.rec-btn {
  width: 92px; height: 92px;
  border-radius: 50%;
  background: linear-gradient(150deg, var(--rubric-500), var(--rubric-700));
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 1.7rem;
  box-shadow: var(--sh-lg);
  transition: transform var(--t-base) var(--ease-spring);
}
.rec-btn:hover { transform: scale(1.05); }
.rec-btn.recording { animation: recPulse 1.4s var(--ease) infinite; }
@keyframes recPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(207, 99, 73, 0.5); }
  50% { box-shadow: 0 0 0 18px rgba(207, 99, 73, 0); }
}

/* ================= Results ================= */
.score-hero {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--sp-8);
  align-items: center;
  padding: clamp(1.5rem, 4vw, 3rem);
  border-radius: var(--r-xl);
  background: linear-gradient(140deg, var(--navy-800), var(--navy-950));
  color: var(--ink-inverse);
  border: 1px solid var(--border-inverse);
  box-shadow: var(--sh-xl);
  position: relative;
  overflow: hidden;
}
.score-hero::after {
  content: "";
  position: absolute;
  inset-block-start: -60%;
  inset-inline-start: -10%;
  width: 420px; height: 420px;
  background: radial-gradient(circle, rgba(200, 162, 83, 0.2), transparent 65%);
}
.score-ring { position: relative; width: 168px; height: 168px; flex: none; }
.score-ring .val {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  flex-direction: column;
  font-family: var(--font-display);
  font-size: 2.4rem;
  color: var(--ivory);
  line-height: 1;
}
.level-badge {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 108px; height: 108px;
  border-radius: 26px;
  background: linear-gradient(150deg, var(--gold-300), var(--gold-600));
  color: #2a2008;
  box-shadow: var(--sh-gold);
  border: 1px solid rgba(255, 255, 255, 0.35);
}
.level-badge .lv { font-family: var(--font-display); font-size: 2.4rem; line-height: 1; font-weight: 700; }
.level-badge .lb { font-size: var(--fs-3xs); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }

.skill-row { display: grid; grid-template-columns: minmax(0, 120px) minmax(0, 1fr) auto; gap: var(--sp-3); align-items: center; }
.skill-row + .skill-row { margin-top: var(--sp-3); }
.skill-row .sn { font-size: var(--fs-sm); font-weight: 600; }
.skill-row .sv { font-family: var(--font-mono); font-size: var(--fs-xs); text-align: end; white-space: nowrap; }

.rec-list { display: grid; gap: var(--sp-3); counter-reset: rec; }
.rec-item {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  transition: all var(--t-base) var(--ease);
  width: 100%;
  text-align: start;
}
.rec-item:hover { border-color: var(--gold-400); transform: translateX(3px); }
html[dir="rtl"] .rec-item:hover { transform: translateX(-3px); }
.rec-item::before {
  counter-increment: rec;
  content: counter(rec);
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent-ink);
  display: grid;
  place-items: center;
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  font-weight: 700;
  flex: none;
}

.gate-blur { position: relative; }
.gate-blur .locked-layer {
  filter: blur(7px);
  pointer-events: none;
  user-select: none;
  opacity: 0.75;
}
.gate-overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--sp-5);
  background: linear-gradient(180deg, transparent, var(--bg) 42%);
  text-align: center;
}
.gate-card { max-width: 420px; }

/* ================= Dashboard ================= */
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--sp-6); align-items: start; }
.dash-hero {
  padding: var(--sp-6);
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--navy-800), var(--navy-950));
  color: var(--ink-inverse);
  border: 1px solid var(--border-inverse);
  position: relative;
  overflow: hidden;
}
.dash-hero h2 { color: var(--ivory); }
.streak-strip { display: flex; gap: 6px; }
.streak-day {
  flex: 1;
  min-width: 0;
  aspect-ratio: 1 / 1.15;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: var(--fs-3xs);
  font-weight: 700;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--ink-3);
}
.streak-day.on { background: linear-gradient(150deg, var(--gold-300), var(--gold-600)); color: #2a2008; border-color: transparent; }
.streak-day.today { box-shadow: 0 0 0 2px var(--accent); }

.task-item {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all var(--t-fast) var(--ease);
  width: 100%;
  text-align: start;
}
.task-item + .task-item { margin-top: var(--sp-2); }
.task-item:hover { border-color: var(--gold-400); }
.task-item .tbox {
  width: 22px; height: 22px;
  border-radius: 7px;
  border: 1.5px solid var(--border-strong);
  display: grid;
  place-items: center;
  color: transparent;
  font-size: 11px;
  flex: none;
  transition: all var(--t-fast) var(--ease);
}
.task-item.done .tbox { background: var(--success); border-color: var(--success); color: #fff; }
.task-item.done .tlabel { text-decoration: line-through; color: var(--ink-3); }
.task-item .tlabel { font-size: var(--fs-sm); font-weight: 600; }

.badge-tile {
  display: grid;
  place-items: center;
  align-content: start;
  gap: 6px;
  padding: var(--sp-4) var(--sp-2);
  min-width: 0;
  border-radius: var(--r-md);
  border: 1px solid var(--border);
  background: var(--surface-2);
  text-align: center;
  transition: all var(--t-base) var(--ease);
}
.badge-tile.locked { opacity: 0.42; filter: grayscale(1); }
.badge-tile:not(.locked):hover { transform: translateY(-3px); box-shadow: var(--sh-md); border-color: var(--gold-400); }
.badge-tile .bg-ico {
  width: 46px; height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 1.2rem;
  background: linear-gradient(150deg, var(--gold-200), var(--gold-400));
  color: #3a2c08;
}
.badge-tile .bg-nm {
  font-size: var(--fs-3xs);
  font-weight: 700;
  line-height: 1.25;
  text-align: center;
  /* achievement names vary in length; clamp to two lines instead of
     spilling out of the tile */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  min-height: 2.5em;
}

/* ================= Library / blog ================= */
.res-card {
  display: flex;
  gap: var(--sp-4);
  padding: var(--sp-4);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  transition: all var(--t-base) var(--ease);
  width: 100%;
  text-align: start;
  align-items: flex-start;
}
.res-card:hover { border-color: var(--gold-400); box-shadow: var(--sh-md); transform: translateY(-2px); }
.res-ico {
  width: 46px; height: 46px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 1.15rem;
  flex: none;
  background: var(--brand-soft);
  color: var(--navy-700);
}
[data-theme="dark"] .res-ico { color: var(--brand-strong); }
.res-ico.pdf { background: var(--danger-soft); color: var(--danger); }
.res-ico.audio { background: var(--warn-soft); color: var(--warn); }
.res-ico.video { background: var(--success-soft); color: var(--success); }
.res-card .rt { font-weight: 650; font-size: var(--fs-sm); }
.res-card .rs { font-size: var(--fs-2xs); color: var(--ink-3); margin-top: 3px; line-height: 1.5; }
.res-card .rm { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); flex-wrap: wrap; }

.post-card {
  display: flex;
  flex-direction: column;
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
  transition: all var(--t-base) var(--ease);
  height: 100%;
  text-align: start;
}
.post-card:hover { transform: translateY(-4px); box-shadow: var(--sh-lg); border-color: var(--gold-300); }
.post-cover {
  height: 132px;
  position: relative;
  background: linear-gradient(140deg, var(--navy-700), var(--navy-950));
  display: grid;
  place-items: center;
  overflow: hidden;
}
.post-cover .glyph { font-family: var(--font-arabic); font-size: 3rem; color: rgba(231, 205, 147, 0.55); direction: rtl; }
.post-cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(45deg, rgba(231, 205, 147, 0.09) 0 1px, transparent 1px 13px),
    repeating-linear-gradient(-45deg, rgba(231, 205, 147, 0.09) 0 1px, transparent 1px 13px);
}
.post-body { padding: var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-2); flex: 1; }
.post-body h3 { font-size: var(--fs-md); line-height: 1.35; }
.post-body .excerpt { font-size: var(--fs-sm); color: var(--ink-3); line-height: 1.55; }
.post-body .pmeta { margin-top: auto; padding-top: var(--sp-3); font-size: var(--fs-3xs); color: var(--ink-3); display: flex; gap: var(--sp-3); }

.article { max-width: 72ch; margin-inline: auto; }
.article h2 { font-size: var(--fs-2xl); margin-top: var(--sp-8); margin-bottom: var(--sp-3); }
.article h3 { font-size: var(--fs-xl); margin-top: var(--sp-6); margin-bottom: var(--sp-2); }
.article p { margin-bottom: var(--sp-4); line-height: var(--lh-loose); color: var(--ink-2); }
.article ul { margin: 0 0 var(--sp-4); padding-inline-start: var(--sp-5); list-style: disc; color: var(--ink-2); }
.article li { margin-bottom: var(--sp-2); line-height: var(--lh-loose); }
.article .ar { margin-block: var(--sp-4); }
.article blockquote {
  margin: var(--sp-5) 0;
  padding: var(--sp-4) var(--sp-5);
  border-inline-start: 3px solid var(--gold-500);
  background: var(--accent-soft);
  border-radius: var(--r-sm);
  font-style: italic;
  color: var(--ink-2);
}

/* ================= Pricing ================= */
.plan {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  padding: var(--sp-6);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  background: var(--surface);
  position: relative;
  transition: all var(--t-base) var(--ease);
  height: 100%;
}
.plan:hover { transform: translateY(-4px); box-shadow: var(--sh-lg); }
.plan.featured {
  border-color: var(--gold-400);
  box-shadow: var(--sh-lg);
  background: linear-gradient(180deg, var(--gold-100), var(--surface) 30%);
}
[data-theme="dark"] .plan.featured { background: linear-gradient(180deg, rgba(200, 162, 83, 0.12), var(--surface) 30%); }
.plan .ribbon {
  position: absolute;
  inset-block-start: -12px;
  inset-inline-start: 50%;
  transform: translateX(-50%);
  padding: 0.25rem 0.8rem;
  border-radius: var(--r-pill);
  background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
  color: #2a2008;
  font-size: var(--fs-3xs);
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.plan .pname { font-family: var(--font-display); font-size: var(--fs-xl); }
.plan .price { display: flex; align-items: baseline; gap: 6px; }
.plan .price .amt { font-family: var(--font-display); font-size: var(--fs-3xl); line-height: 1; }
.plan .price .per { font-size: var(--fs-2xs); color: var(--ink-3); }
.plan ul { display: grid; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--ink-2); }
.plan ul li { display: flex; gap: var(--sp-2); align-items: flex-start; line-height: 1.45; }
.plan ul li .tick { color: var(--success); flex: none; }
.plan ul li.off { color: var(--ink-3); }
.plan ul li.off .tick { color: var(--border-strong); }
.plan .plan-cta { margin-top: auto; }

.pay-method {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: var(--sp-4);
  border: 1.5px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
  cursor: pointer;
  transition: all var(--t-fast) var(--ease);
  width: 100%;
  text-align: start;
}
.pay-method:hover { border-color: var(--navy-400); }
.pay-method.is-selected { border-color: var(--navy-700); background: var(--brand-soft); }
.pay-method .pm-logo {
  width: 44px; height: 30px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  font-size: var(--fs-3xs);
  font-weight: 800;
  letter-spacing: 0.02em;
  color: #fff;
  flex: none;
}

/* ================= Certificate ================= */
.cert-frame {
  position: relative;
  aspect-ratio: 1.414 / 1;
  border-radius: var(--r-md);
  background: linear-gradient(150deg, #fffdf6, #f6efdf);
  border: 2px solid var(--gold-600);
  box-shadow: var(--sh-lg);
  padding: clamp(1rem, 3.2vw, 2.4rem);
  overflow: hidden;
  color: #1a1508;
  container-type: inline-size;
}
.cert-frame::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(168, 132, 44, 0.55);
  border-radius: 6px;
  pointer-events: none;
}
.cert-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    repeating-conic-gradient(from 0deg at 0% 0%, rgba(168, 132, 44, 0.05) 0deg 15deg, transparent 15deg 30deg);
  opacity: 0.6;
  pointer-events: none;
}
.cert-inner { position: relative; height: 100%; display: flex; flex-direction: column; text-align: center; }
.cert-inner .c-acad { font-family: var(--font-display); font-size: clamp(0.9rem, 2.4cqi, 1.4rem); letter-spacing: 0.04em; }
.cert-inner .c-ar { font-family: var(--font-arabic); color: #7a5f1c; direction: rtl; font-size: clamp(0.85rem, 2.2cqi, 1.2rem); }
.cert-inner .c-kicker { font-size: clamp(0.5rem, 1.3cqi, 0.72rem); letter-spacing: 0.24em; text-transform: uppercase; color: #7a5f1c; margin-top: 2%; }
.cert-inner .c-name { font-family: var(--font-display); font-size: clamp(1.2rem, 4.4cqi, 2.6rem); margin-block: 1.5% 1%; }
.cert-inner .c-desc { font-size: clamp(0.6rem, 1.7cqi, 0.95rem); color: #4a3d1a; }
/* The A4-landscape ratio leaves a large gap between the citation and the
   footer; a centred rosette + Arabic line fills it the way a manuscript
   colophon would, instead of leaving dead space. */
.cert-inner .c-body { flex: 1; display: grid; place-items: center; gap: 2%; }
.cert-inner .c-rosette { width: clamp(70px, 20cqi, 150px); opacity: 0.5; }
.cert-inner .c-rosette .p1 { fill: none; stroke: var(--gold-600); stroke-width: 1.1; }
.cert-inner .c-rosette .p2 { fill: rgba(168, 132, 44, 0.12); stroke: rgba(168, 132, 44, 0.5); stroke-width: 1; }
.cert-inner .c-blessing { font-family: var(--font-arabic); direction: rtl; color: #7a5f1c; font-size: clamp(0.7rem, 2cqi, 1.05rem); }
.cert-inner .c-foot { margin-top: auto; display: grid; grid-template-columns: 1fr auto 1fr; justify-items: center; align-items: end; gap: 4%; text-align: start; }
.cert-inner .c-foot .c-meta { justify-self: start; }
.cert-inner .c-foot .qr-box { justify-self: end; }
.cert-inner .c-meta { font-family: var(--font-mono); font-size: clamp(0.45rem, 1.15cqi, 0.68rem); color: #5c4a17; line-height: 1.7; }
.cert-seal {
  width: clamp(46px, 12cqi, 88px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--gold-300), var(--gold-600));
  display: grid;
  place-items: center;
  font-family: var(--font-arabic);
  color: #2e2308;
  font-size: clamp(0.9rem, 3cqi, 1.6rem);
  box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.5), var(--sh-md);
  border: 2px solid rgba(255, 255, 255, 0.45);
  flex: none;
}
.qr-box { background: #fff; padding: 6px; border-radius: 6px; box-shadow: var(--sh-xs); flex: none; }
.qr-box canvas, .qr-box svg { display: block; width: clamp(52px, 13cqi, 92px); height: auto; image-rendering: pixelated; }

/* ================= Admin ================= */
.admin-shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: var(--sp-6); align-items: start; }
.admin-nav { position: sticky; top: calc(var(--header-h) + var(--sp-4)); display: grid; gap: 2px; padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); }
.admin-nav button {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  padding: 0.6rem 0.75rem;
  border-radius: var(--r-sm);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-3);

window.TLA = window.TLA || {};

      .replace(/</g, "&lt;")

      .replace(/'/g, "&#39;");

  const attr = esc;

  function clamp(n, min, max) {
    return Math.min(max, Math.max(min, n));
  }

  function pct(part, total) {
    if (!total) return 0;
    return Math.round((part / total) * 100);
  }

  function uid(prefix) {
    return (prefix || "id") + "-" + Math.random().toString(36).slice(2, 9);
  }

  /** Deterministic PRNG so generated tests are reproducible per seed. */
  function seededRandom(seed) {
    let s = 0;
    const str = String(seed);
    for (let i = 0; i < str.length; i++) s = (s * 31 + str.charCodeAt(i)) >>> 0;
    if (s === 0) s = 42;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >> 17;
      s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };

    const arr = list.slice();
    const r = rnd || Math.random;
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function debounce(fn, wait) {
    let t;
    return function () {
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(ctx, args), wait || 200);
    };
  }

  function throttle(fn, wait) {
    let last = 0, timer = null;
    return function () {
      const now = Date.now(), args = arguments, ctx = this;
      if (now - last >= wait) { last = now; fn.apply(ctx, args); }
      else if (!timer) {
        timer = setTimeout(() => { last = Date.now(); timer = null; fn.apply(ctx, args); }, wait - (now - last));

  function delegate(root, type, selector, handler) {

    });

  function fmtTime(totalSeconds) {
    const s = Math.max(0, Math.floor(totalSeconds));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0");

  function fmtDuration(minutes, locale) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    const unit = { uz: ["soat", "daqiqa"], en: ["h", "min"], ar: ["ساعة", "دقيقة"] }[locale] || ["soat", "daqiqa"];
    if (h && m) return h + " " + unit[0] + " " + m + " " + unit[1];
    if (h) return h + " " + unit[0];
    return m + " " + unit[1];
  }

  function fmtNumber(n) {
    return new Intl.NumberFormat("ru-RU").format(Math.round(n || 0)).replace(/\u00A0/g, " ");
  }

  function fmtMoney(amount, currency) {
    return fmtNumber(amount) + " " + (currency || "so'm");
  }

  function fmtDate(iso, locale) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const map = { uz: "ru-RU", en: "en-GB", ar: "ar-EG" };
    try {
      return new Intl.DateTimeFormat(map[locale] || "ru-RU", {
        day: "2-digit", month: "short", year: "numeric"
      }).format(d);
    } catch (e) {
      return d.toISOString().slice(0, 10);
    }
  }

  function todayKey(date) {
    const d = date ? new Date(date) : new Date();
    return d.toISOString().slice(0, 10);
  }

  function daysBetween(aKey, bKey) {
    const a = new Date(aKey + "T00:00:00Z").getTime();
    const b = new Date(bKey + "T00:00:00Z").getTime();

      .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
      .replace(/[إأآٱ]/g, "ا")
      .replace(/ى/g, "ي")

    if (!needle) return true;
    const h = normalizeArabic(String(haystack)).toLowerCase();

    return h.indexOf(n) !== -1;

    const from = Number(node.dataset.val || 0);

/* ===== 01-storage.js ===== */
/* ============================================================
   STORAGE — swappable persistence layer
   Order of preference:
     1. window.storage  (host-provided async key/value store)
     2. localStorage    (browser)
     3. in-memory       (always works, resets on reload)
   The rest of the app only talks to TLA.store, so replacing this
   file with real API calls is the only change needed for a backend.
   ============================================================ */
window.TLA = window.TLA || {};

TLA.store = (function () {
  "use strict";

  const KEY = "tla:v1:state";
  let driver = "memory";
  let memory = {};
  let cache = null;
  let writeTimer = null;

  function detect() {
    if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") {
      driver = "host";
      return;
    }
    try {
      const probe = "__tla_probe__";
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
      driver = "local";
    } catch (e) {
      driver = "memory";
    }
  }

  async function readRaw() {
    try {
      if (driver === "host") {
        const res = await window.storage.get(KEY);
        return res && res.value ? res.value : null;
      }
      if (driver === "local") return window.localStorage.getItem(KEY);
      return memory[KEY] || null;
    } catch (e) {
      return null;
    }
  }

  async function writeRaw(text) {
    try {
      if (driver === "host") { await window.storage.set(KEY, text); return true; }
      if (driver === "local") { window.localStorage.setItem(KEY, text); return true; }
      memory[KEY] = text;
      return true;
    } catch (e) {
      memory[KEY] = text;
      return false;
    }
  }

  /** Loads persisted state once at boot. Returns a plain object. */
  async function load() {
    detect();
    const raw = await readRaw();
    if (!raw) { cache = {}; return cache; }
    try {
      const parsed = JSON.parse(raw);
      cache = parsed && typeof parsed === "object" ? parsed : {};
    } catch (e) {
      cache = {};
    }
    return cache;
  }

  /** Debounced write-through: reads stay synchronous from memory. */
  function save(state) {
    cache = state;
    if (writeTimer) clearTimeout(writeTimer);
    writeTimer = setTimeout(() => {
      writeTimer = null;
      let text;
      try { text = JSON.stringify(cache); }
      catch (e) { return; }
      writeRaw(text);
    }, 220);
  }

  async function flush() {
    if (writeTimer) { clearTimeout(writeTimer); writeTimer = null; }
    try { await writeRaw(JSON.stringify(cache || {})); } catch (e) { /* ignore */ }
  }

  async function clear() {
    cache = {};
    try {
      if (driver === "host") await window.storage.delete(KEY);
      else if (driver === "local") window.localStorage.removeItem(KEY);
      else delete memory[KEY];
    } catch (e) { /* ignore */ }
  }

  return {
    load, save, flush, clear,
    get driver() { return driver; }
  };
})();


/* ===== 02-i18n.js ===== */

  let current = "uz";
  const listeners = [];

  function t(key, vars) {
    const table = dict[current] || dict.uz;
    let str = table[key];
    if (str === undefined) str = dict.uz[key];
    if (str === undefined) return key;
    if (vars) {
      Object.keys(vars).forEach(k => {
        str = str.replace(new RegExp("\\{" + k + "\\}", "g"), vars[k]);
      });
    }
    return str;
  }

  function set(lang) {
    if (!dict[lang]) return;
    current = lang;
    const rtl = lang === "ar";
    document.documentElement.lang = lang;
    document.documentElement.dir = rtl ? "rtl" : "ltr";
    listeners.forEach(fn => { try { fn(lang); } catch (e) { /* ignore */ } });
  }

  function onChange(fn) { listeners.push(fn); }
  function get() { return current; }
  function isRTL() { return current === "ar"; }
  function available() { return ["uz", "en", "ar"]; }

  return { t, set, get, onChange, isRTL, available };
})();

  TLA.data.courses = TLA.data.levels.map(function (lvl, li) {
    const topics = moduleTopics[lvl.id];
    const perModule = [4, 4, 3, 3, 3, 3];
    let lessonNo = 0;
    const modules = topics.map(function (topic, mi) {
      const lessons = [];
      for (let i = 0; i < perModule[mi]; i++) {
        lessonNo++;
        const skill = skillCycle[(mi + i) % skillCycle.length];
        lessons.push({
          id: lvl.id + "-l" + lessonNo,
          no: lessonNo,
          titleUz: topic.uz + " — " + (i + 1) + "-dars",
          titleAr: topic.ar,
          skill: skill,
          minutes: 18 + ((mi + i) % 3) * 6,
          free: li === 0 || (mi === 0 && i < 2),
          textId: packsByLevel[lvl.id].text,
          grammarId: packsByLevel[lvl.id].grammar[i % 2]
        });
      }
      return {
        id: lvl.id + "-m" + (mi + 1),
        no: mi + 1,
        titleUz: topic.uz,
        titleAr: topic.ar,
        lessons: lessons
      };
    });

    const totalLessons = modules.reduce((n, m) => n + m.lessons.length, 0);
    return {
      id: lvl.id,
      level: lvl.id,
      code: lvl.code,
      titleUz: lvl.code + " Arab tili",
      titleAr: "اللُّغَةُ الْعَرَبِيَّة " + lvl.code,
      titleEn: lvl.code + " Arabic",
      subtitleUz: lvl.uz + " daraja",
      descUz: lvl.descUz,
      lessons: totalLessons,
      hours: lvl.hours,
      words: lvl.words,
      free: li === 0,
      skills: ["reading", "listening", "grammar", "vocabulary", "speaking", "writing"],
      forWhom: courseCopy[lvl.id].forWhom,
      outcomes: courseCopy[lvl.id].outcomes,
      modules: modules
    };
  });

  TLA.data.courseById = function (id) {
    return TLA.data.courses.filter(c => c.id === id)[0] || null;
  };

  TLA.data.lessonById = function (lessonId) {
    for (const course of TLA.data.courses) {
      for (const mod of course.modules) {
        for (const lesson of mod.lessons) {
          if (lesson.id === lessonId) return { course, module: mod, lesson };
        }
      }
    }
    return null;
  };

  TLA.data.allLessons = function () {
    const out = [];
    TLA.data.courses.forEach(c => c.modules.forEach(m => m.lessons.forEach(l => out.push({ course: c, module: m, lesson: l }))));

/* ---------------- Bank helpers ---------------- */
TLA.data.questionById = function (id) {
  return TLA.data.questions.filter(q => q.id === id)[0] || null;
};

TLA.data.filterQuestions = function (filter) {
  const f = filter || {};
  return TLA.data.questions.filter(function (q) {
    if (f.level && q.level !== f.level) return false;
    if (f.levels && f.levels.indexOf(q.level) === -1) return false;
    if (f.skill && q.skill !== f.skill) return false;
    if (f.skills && f.skills.indexOf(q.skill) === -1) return false;
    if (f.diff && q.diff !== f.diff) return false;
    if (f.topic && q.topic !== f.topic) return false;
    return true;
  });
};
